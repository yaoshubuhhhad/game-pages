<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>挂念</title>
<link rel="stylesheet" href="../theme/theme.css">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
.page{max-width:420px;margin:0 auto;padding:50px 20px 40px;position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.page::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 35%,rgba(30,18,10,.3) 0%,rgba(8,4,1,.7) 55%,rgba(3,1,0,.9) 100%)}
.back-link{position:absolute;top:20px;left:16px;color:var(--text-faint);font-size:12px;text-decoration:none;z-index:10}
.back-link:hover{color:var(--gold)}
.title{font-size:20px;font-weight:700;color:rgba(255,255,255,.78);letter-spacing:8px;font-family:serif;text-align:center;margin-bottom:4px}
.subtitle{font-size:10px;color:var(--text-faint);letter-spacing:4px;text-align:center;margin-bottom:24px}

/* ====== 第一层：树枝 + 木牌（沉浸区，无任何文字） ====== */
.branch-area{position:relative;width:100%;height:360px;overflow:hidden}
.branch-svg{position:absolute;top:0;left:50%;transform:translateX(-50%);width:340px;height:340px;opacity:.25;animation:branch-sway 12s ease-in-out infinite}
@keyframes branch-sway{0%,100%{transform:translateX(-50%) rotate(0deg)}30%{transform:translateX(-50%) rotate(.3deg)}70%{transform:translateX(-50%) rotate(-.25deg)}}

/* 木牌 */
.plaque-container{position:absolute;animation:plaque-sway 8s ease-in-out infinite}
.plaque-container:nth-child(odd){animation-delay:0s}
.plaque-container:nth-child(even){animation-delay:4s}
@keyframes plaque-sway{0%,100%{transform:rotate(0deg)}30%{transform:rotate(1deg)}60%{transform:rotate(-.6deg)}85%{transform:rotate(.4deg)}}
.plaque{background:linear-gradient(180deg,rgba(110,70,35,.32),rgba(65,35,18,.24));border:1px solid rgba(200,155,60,.05);border-radius:2px 2px 3px 3px;padding:10px 12px;width:115px;text-align:center;font-size:11px;line-height:1.7;font-family:serif;letter-spacing:.5px;cursor:default;transition:transform .5s,box-shadow .5s,opacity 1.2s,filter 1.2s;box-shadow:inset 0 1px 0 rgba(255,220,160,.03),0 2px 8px rgba(0,0,0,.45);position:relative}
.plaque:hover{transform:translateY(-4px) rotate(0deg)!important;box-shadow:inset 0 1px 0 rgba(255,220,160,.12),0 0 24px rgba(200,155,60,.1),0 6px 18px rgba(0,0,0,.55);cursor:pointer}
.plaque.reading{transform:scale(1.08) rotate(0deg)!important;box-shadow:inset 0 1px 0 rgba(255,220,160,.18),0 0 40px rgba(200,155,60,.18),0 8px 24px rgba(0,0,0,.6);z-index:20;filter:none!important;opacity:1!important}
.plaque .rope{position:absolute;top:-28px;left:50%;width:1.5px;height:28px;background:rgba(255,220,180,.08);transform:translateX(-50%)}

/* 时间层次 */
.plaque.fading{opacity:.35;filter:blur(1.5px) grayscale(.4)}
.plaque.dying{opacity:0;filter:blur(6px);transform:translateY(24px) rotate(0deg)!important;transition:opacity 3s ease-in,filter 3s ease-in,transform 3s ease-in}

/* 深度层：非最新木牌缩小、变暗、微模糊 */
.plaque.depth-1{transform:scale(.92);opacity:.65;filter:blur(.6px)}
.plaque.depth-2{transform:scale(.85);opacity:.45;filter:blur(1.2px)}

/* 最新木牌——最亮、最暖、最清晰 */
.plaque.fresh{box-shadow:inset 0 1px 0 rgba(255,220,160,.08),0 0 16px rgba(200,155,60,.08),0 3px 12px rgba(0,0,0,.4)}
.plaque.fresh .rope{background:rgba(255,220,180,.18)}

/* 新留言浮现 */
.plaque.emerging{animation:plaque-emerge 1.6s ease-out}
@keyframes plaque-emerge{0%{opacity:0;transform:translateY(-10px);box-shadow:inset 0 1px 0 rgba(255,220,160,0),0 0 0 rgba(200,155,60,0)}40%{opacity:.6;box-shadow:inset 0 1px 0 rgba(255,220,160,.2),0 0 30px rgba(200,155,60,.25)}100%{opacity:1;transform:translateY(0)}}

/* ====== 第二层：仪式区（空木牌 = 用户行为入口） ====== */
.ritual-area{position:relative;width:100%;display:flex;justify-content:center;margin-top:-12px;z-index:2}
.plaque.empty{width:150px;background:linear-gradient(180deg,rgba(200,155,60,.12),rgba(120,80,40,.06));border:1px solid rgba(200,155,60,.22);color:rgba(255,255,255,.25);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;min-height:52px;letter-spacing:3px;border-radius:2px 2px 3px 3px;animation:empty-pulse 3s ease-in-out infinite}
.plaque.empty:hover{color:rgba(255,255,255,.5);border-color:rgba(200,155,60,.4);box-shadow:inset 0 1px 0 rgba(255,220,160,.15),0 0 28px rgba(200,155,60,.18),0 4px 14px rgba(0,0,0,.55)}
@keyframes empty-pulse{0%,100%{box-shadow:inset 0 1px 0 rgba(255,220,160,.03),0 0 10px rgba(200,155,60,.04)}50%{box-shadow:inset 0 1px 0 rgba(255,220,160,.1),0 0 18px rgba(200,155,60,.12)}}

/* ====== 第三层：旁白（页面角落的低语） ====== */
.whisper{position:absolute;bottom:28px;right:20px;color:rgba(255,255,255,.08);font-size:10px;line-height:1.8;text-align:right;letter-spacing:2px;font-family:serif;pointer-events:none}

/* 书写面板 */
.write-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(8,3,1,.78);backdrop-filter:blur(10px);flex-direction:column;align-items:center;justify-content:center}
.write-overlay.show{display:flex}
.write-plaque{background:linear-gradient(180deg,rgba(140,95,45,.45),rgba(85,50,28,.3));border:1px solid rgba(200,155,60,.22);border-radius:8px;padding:28px 22px;width:280px;text-align:center;box-shadow:0 0 50px rgba(200,155,60,.1),0 10px 40px rgba(0,0,0,.65);animation:plaque-glow .6s ease-out}
@keyframes plaque-glow{0%{opacity:.2;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
.write-plaque textarea{width:100%;height:100px;background:transparent;border:none;outline:none;resize:none;color:rgba(255,240,220,.78);font-size:13px;line-height:2;font-family:serif;letter-spacing:1px;text-align:center}
.write-plaque textarea::placeholder{color:rgba(255,255,255,.12)}
.write-plaque .char-count{font-size:10px;color:rgba(255,255,255,.13);text-align:right;margin-top:6px}
.write-actions{margin-top:18px;display:flex;gap:12px}
.write-close{position:absolute;top:24px;right:24px;color:rgba(255,255,255,.18);font-size:22px;cursor:pointer;background:none;border:none;line-height:1}
</style>
</head>
<body>
<div class="page">
  <a href="../index.html" class="back-link">← 灯札</a>
  <div class="title">挂 念</div>
  <div class="subtitle">留下 · 挂上 · 沉入夜色</div>

  <!-- 第一层：沉浸区 -->
  <div class="branch-area" id="branchArea">
    <svg class="branch-svg" viewBox="0 0 340 340" fill="none">
      <path d="M0 60 Q80 38 170 52 Q240 65 340 50" stroke="rgba(180,140,90,.48)" stroke-width="2" stroke-linecap="round"/>
      <path d="M170 52 Q180 145 155 240" stroke="rgba(180,140,90,.28)" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M160 155 Q115 195 40 220" stroke="rgba(180,140,90,.18)" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M165 125 Q210 160 270 185" stroke="rgba(180,140,90,.15)" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M70 56 Q90 90 80 135" stroke="rgba(180,140,90,.12)" stroke-width=".9" stroke-linecap="round"/>
    </svg>
    <div id="plaquesContainer"></div>
  </div>

  <!-- 第二层：仪式区 -->
  <div class="ritual-area">
    <div class="plaque empty" id="emptyPlaque">留下些什么？</div>
  </div>

  <!-- 第三层：旁白 -->
  <div class="whisper">有些话，<br>适合留给夜晚。</div>
</div>

<div class="write-overlay" id="writePanel">
  <button class="write-close" id="writeClose">✕</button>
  <div class="write-plaque">
    <textarea id="writeInput" placeholder="留下些什么？" maxlength="140"></textarea>
    <div class="char-count"><span id="charCount">0</span>/140</div>
  </div>
  <div class="write-actions">
    <button class="theme-btn-ghost" id="writeCancel">再想想</button>
    <button class="theme-btn" id="writeSubmit">挂上枝头</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../theme/particles.js"></script>
<script>
var supabase = window.supabase.createClient(
  'https://kzcmavjvsowcmglcutds.supabase.co',
  'sb_publishable_qB7PKRmlPsJdb-PFzpxY7A_QVF9BNcG'
);

var messages = [];
var plaquesContainer = document.getElementById('plaquesContainer');
// 5个位置：中心最新，越往外越深
var positions = [
  {x:112,y:100}, // 0: center — newest, brightest
  {x:20,y:60},   // 1: upper-left
  {x:200,y:50},  // 2: upper-right
  {x:45,y:175},  // 3: lower-left
  {x:195,y:170}, // 4: lower-right
];

function escapeHtml(text) {
  var d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function loadMessages() {
  supabase.from('messages').select('*').order('created_at',{ascending:false}).limit(30).then(function(res){
    if (res.error){console.error(res.error);return;}
    messages = res.data || [];
    renderPlaques();
  });
}

function renderPlaques() {
  var now = Date.now();
  var html = '';
  var active = messages.slice(0,5);
  active.forEach(function(msg,i){
    var age = now - new Date(msg.created_at).getTime();
    var hoursLeft = Math.max(0, 24 - age/3600000);
    var rot = (Math.random() - .5) * 4;
    var fadeClass = hoursLeft < 6 ? ' fading' : '';
    var warmth = Math.max(.3, 1 - age / 86400000);
    // 深度层：i=0 最新最亮；i>=3 更深更暗
    var depthClass = i === 0 ? ' fresh' : (i >= 3 ? ' depth-2' : ' depth-1');
    var pos = positions[i];
    html += '<div class="plaque-container" style="left:'+pos.x+'px;top:'+pos.y+'px;transform:rotate('+rot.toFixed(1)+'deg)">'+
      '<div class="plaque'+fadeClass+depthClass+'" data-id="'+msg.id+'" data-created="'+msg.created_at+'" style="color:rgba(255,'+(220+Math.floor(warmth*35))+','+(180+Math.floor(warmth*60))+','+(.45+warmth*.25).toFixed(2)+');background:linear-gradient(180deg,rgba('+(100+Math.floor(warmth*30))+','+(60+Math.floor(warmth*25))+','+(30+Math.floor(warmth*15))+','+(.28+warmth*.1).toFixed(2)+'),rgba('+(55+Math.floor(warmth*20))+','+(30+Math.floor(warmth*15))+','+(15+Math.floor(warmth*10))+','+(.2+warmth*.08).toFixed(2)+'))">'+
      '<div class="rope"></div>'+escapeHtml(msg.content)+
      '</div></div>';
  });
  plaquesContainer.innerHTML = html;
  // 点击阅读
  plaquesContainer.querySelectorAll('.plaque:not(.empty)').forEach(function(p){
    p.addEventListener('click',function(e){
      e.stopPropagation();
      var wasReading = p.classList.contains('reading');
      plaquesContainer.querySelectorAll('.plaque.reading').forEach(function(r){ r.classList.remove('reading'); });
      if (!wasReading) p.classList.add('reading');
    });
  });
}
// 点击空白取消阅读
document.addEventListener('click',function(){
  plaquesContainer.querySelectorAll('.plaque.reading').forEach(function(r){ r.classList.remove('reading'); });
});

// 空木牌
document.getElementById('emptyPlaque').addEventListener('click',function(){
  document.getElementById('writePanel').classList.add('show');
  document.getElementById('writeInput').focus();
});

// 书写面板
var writeInput = document.getElementById('writeInput');
var charCount = document.getElementById('charCount');
writeInput.addEventListener('input',function(){
  charCount.textContent = writeInput.value.length;
});

document.getElementById('writeClose').addEventListener('click',closeWrite);
document.getElementById('writeCancel').addEventListener('click',closeWrite);
function closeWrite(){
  document.getElementById('writePanel').classList.remove('show');
  writeInput.value = '';
  charCount.textContent = '0';
}

var isSubmitting = false;
document.getElementById('writeSubmit').addEventListener('click',function(){
  var text = writeInput.value.trim();
  if (!text || isSubmitting || text.length > 140) return;
  isSubmitting = true;
  supabase.from('messages').insert({content:text}).select().single().then(function(res){
    isSubmitting = false;
    if (res.error){alert('挂失败了，再试一次');return;}
    closeWrite();
    // 浮现——挂上空木牌的位置
    var emerging = document.createElement('div');
    emerging.className = 'plaque-container emerging-temp';
    emerging.style.cssText = 'position:relative';
    emerging.innerHTML = '<div class="plaque emerging"><div class="rope"></div>'+escapeHtml(text)+'</div>';
    var ritual = document.querySelector('.ritual-area');
    ritual.appendChild(emerging);
    setTimeout(function(){
      if (emerging.parentElement) emerging.remove();
      loadMessages();
    }, 1800);
  });
});

// 时间衰减
setInterval(function(){
  var plaques = document.querySelectorAll('.plaque:not(.empty):not(.dying)');
  var now = Date.now();
  plaques.forEach(function(p){
    var created = p.dataset.created;
    if (!created) return;
    var age = now - new Date(created).getTime();
    var hoursLeft = Math.max(0, 24 - age/3600000);
    if (hoursLeft < 6) p.classList.add('fading');
    if (hoursLeft < 2 && !p.classList.contains('mark-dying')){
      p.classList.add('mark-dying');
      setTimeout(function(){
        p.classList.add('dying');
        setTimeout(function(){
          if (p.parentElement) p.parentElement.remove();
        },3500);
      }, hoursLeft * 3600000);
    }
  });
}, 30000);

loadMessages();
</script>
</body>
</html>
