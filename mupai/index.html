<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>挂念</title>
<link rel="stylesheet" href="../theme/theme.css">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;background:#0a0502}
.page{width:100vw;height:100vh;position:relative;overflow:hidden}
.page::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 55% 45%,rgba(40,25,12,.5) 0%,rgba(12,6,2,.85) 50%,rgba(4,2,0,.95) 100%)}

/* 顶栏 */
.top-bar{position:absolute;top:0;left:0;right:0;z-index:10;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start}
.back-link{color:rgba(255,255,255,.18);font-size:12px;text-decoration:none}
.back-link:hover{color:var(--gold)}
.top-title{text-align:right}
.top-title .name{font-size:16px;font-weight:700;color:rgba(255,255,255,.65);letter-spacing:6px;font-family:serif}
.top-title .hint{font-size:9px;color:rgba(255,255,255,.12);letter-spacing:3px;margin-top:2px}

/* 漂浮区 */
.float-space{position:absolute;inset:0;z-index:1}

/* 碎片 */
.fragment{position:absolute;cursor:default;transition:transform .6s ease-out,opacity .8s,filter 1.5s;font-family:serif;letter-spacing:.5px;line-height:1.7;text-align:center;pointer-events:auto}
/* 默认只显示模糊行 */
.fragment .inner{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .5s}
.fragment:hover .inner{white-space:normal;overflow:visible}
.fragment:hover{z-index:30!important;transform:scale(1.05)}

/* 深度层 */
.frag-near{font-size:14px;color:rgba(255,240,220,.72);filter:blur(0px);z-index:5}
.frag-mid{font-size:11px;color:rgba(255,230,200,.38);filter:blur(.5px);z-index:3}
.frag-far{font-size:9px;color:rgba(255,220,180,.15);filter:blur(1.5px);z-index:1}
.frag-near:hover{color:rgba(255,245,230,.95);filter:blur(0);text-shadow:0 0 20px rgba(200,155,60,.3)}
.frag-mid:hover{color:rgba(255,240,220,.75);filter:blur(0);text-shadow:0 0 14px rgba(200,155,60,.15)}
.frag-far:hover{color:rgba(255,230,200,.4);filter:blur(.5px);text-shadow:0 0 8px rgba(200,155,60,.06)}

/* 漂浮动画 */
.frag-drift{animation:drift 20s ease-in-out infinite}
.frag-drift:nth-child(odd){animation-duration:24s;animation-delay:0s}
.frag-drift:nth-child(even){animation-duration:18s;animation-delay:6s}
.frag-drift:nth-child(3n){animation-duration:22s;animation-delay:3s}
@keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(12px,-8px)}50%{transform:translate(-6px,10px)}75%{transform:translate(-10px,-4px)}}

/* 消失态 */
.fragment.fading{opacity:.25;filter:blur(3px)}
.fragment.dying{opacity:0;filter:blur(8px);transition:opacity 4s ease-in,filter 4s ease-in;pointer-events:none}

/* 写入口 */
.write-entry{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:10;cursor:pointer;font-size:13px;color:rgba(255,255,255,.2);letter-spacing:4px;font-family:serif;transition:color .5s;animation:entry-pulse 4s ease-in-out infinite}
.write-entry:hover{color:rgba(255,255,255,.45)}
@keyframes entry-pulse{0%,100%{opacity:.6}50%{opacity:1}}

/* 角落 */
.corner-whisper{position:absolute;bottom:32px;right:24px;z-index:10;color:rgba(255,255,255,.06);font-size:10px;text-align:right;line-height:1.8;letter-spacing:2px;font-family:serif;pointer-events:none}

/* 书写面板 */
.write-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(6,3,1,.82);backdrop-filter:blur(12px);flex-direction:column;align-items:center;justify-content:center}
.write-overlay.show{display:flex}
.write-plaque{background:linear-gradient(180deg,rgba(140,95,45,.45),rgba(85,50,28,.3));border:1px solid rgba(200,155,60,.22);border-radius:8px;padding:28px 22px;width:280px;text-align:center;box-shadow:0 0 50px rgba(200,155,60,.1),0 10px 40px rgba(0,0,0,.65);animation:plaque-glow .6s ease-out}
@keyframes plaque-glow{0%{opacity:.2;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
.write-plaque textarea{width:100%;height:100px;background:transparent;border:none;outline:none;resize:none;color:rgba(255,240,220,.78);font-size:13px;line-height:2;font-family:serif;letter-spacing:1px;text-align:center}
.write-plaque textarea::placeholder{color:rgba(255,255,255,.12)}
.write-plaque .char-count{font-size:10px;color:rgba(255,255,255,.13);text-align:right;margin-top:6px}
.write-actions{margin-top:18px;display:flex;gap:12px}
.write-close{position:absolute;top:24px;right:24px;color:rgba(255,255,255,.18);font-size:22px;cursor:pointer;background:none;border:none;line-height:1}
</style>
</head>
<body>
<div class="page">
  <div class="top-bar">
    <a href="../index.html" class="back-link">← 灯札</a>
    <div class="top-title">
      <div class="name">挂 念</div>
      <div class="hint">留下 · 漂浮 · 沉入夜色</div>
    </div>
  </div>
  <div class="float-space" id="floatSpace"></div>
  <div class="write-entry" id="writeEntry">留下些什么？</div>
  <div class="corner-whisper">有些话，<br>适合留给夜晚。</div>
</div>

<div class="write-overlay" id="writePanel">
  <button class="write-close" id="writeClose">✕</button>
  <div class="write-plaque">
    <textarea id="writeInput" placeholder="留下些什么？" maxlength="140"></textarea>
    <div class="char-count"><span id="charCount">0</span>/140</div>
  </div>
  <div class="write-actions">
    <button class="theme-btn-ghost" id="writeCancel">再想想</button>
    <button class="theme-btn" id="writeSubmit">挂念</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../theme/particles.js"></script>
<script>
var supabase = window.supabase.createClient(
  'https://kzcmavjvsowcmglcutds.supabase.co',
  'sb_publishable_qB7PKRmlPsJdb-PFzpxY7A_QVF9BNcG'
);

var floatSpace = document.getElementById('floatSpace');
var DEATH_THRESHOLD = 30;

// 漂浮位置池（vw/vh 百分比，保证适配不同屏幕）
function randomPos() {
  return {
    x: 5 + Math.random() * 80,   // 5~85vw
    y: 8 + Math.random() * 70    // 8~78vh
  };
}

function escapeHtml(text) {
  var d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

// 加载 + 渲染
function loadMessages() {
  supabase.from('messages').select('*').order('created_at',{ascending:false}).limit(50).then(function(res){
    if (res.error){console.error(res.error);return;}
    var messages = res.data || [];
    renderFragments(messages);
  });
}

function renderFragments(messages) {
  var now = Date.now();
  var total = messages.length;
  var html = '';

  messages.forEach(function(msg,i){
    var age = now - new Date(msg.created_at).getTime();
    var hoursLeft = Math.max(0, 24 - age/3600000);
    var fadeClass = '';
    // 冷启动: 总数不足阈值时不清除
    if (total > DEATH_THRESHOLD) {
      if (hoursLeft < 3) fadeClass = ' fading';
      if (hoursLeft < 0.5) fadeClass = ' dying';
    }
    // 深度层: 前 8 条近景, 8-20 中景, 其余远景
    var depth, maxW;
    if (i < 8) { depth = 'frag-near'; maxW = 220; }
    else if (i < 20) { depth = 'frag-mid'; maxW = 160; }
    else { depth = 'frag-far'; maxW = 120; }

    var pos = randomPos();
    var text = msg.content;
    // 显示策略: 近景完整显示, 中景截断, 远景只露首句
    var displayText = text;
    if (depth === 'frag-far') {
      displayText = text.length > 8 ? text.substring(0,8)+'…' : text;
    }

    html += '<div class="fragment frag-drift '+depth+fadeClass+'" style="left:'+pos.x+'vw;top:'+pos.y+'vh;max-width:'+maxW+'px" data-id="'+msg.id+'" data-created="'+msg.created_at+'">'+
      '<div class="inner">'+escapeHtml(displayText)+'</div>'+
      '</div>';
    // hover 时显示完整文字
    var fullText = escapeHtml(text);
    if (depth !== 'frag-near') {
      // 中远景 hover 展开完整文字
    }
  });

  floatSpace.innerHTML = html;

  // hover 完整显示
  floatSpace.querySelectorAll('.fragment').forEach(function(frag){
    var id = frag.dataset.id;
    var msg = messages.find(function(m){ return m.id === parseInt(id); });
    if (!msg) return;
    frag.addEventListener('mouseenter',function(){
      frag.querySelector('.inner').textContent = msg.content;
    });
    frag.addEventListener('mouseleave',function(){
      var d = frag.classList.contains('frag-far') ?
        (msg.content.length > 8 ? msg.content.substring(0,8)+'…' : msg.content) :
        msg.content;
      frag.querySelector('.inner').textContent = d;
    });
  });
}

// 时间衰减
setInterval(function(){
  var total = floatSpace.querySelectorAll('.fragment').length;
  if (total <= DEATH_THRESHOLD) return;
  var fragments = floatSpace.querySelectorAll('.fragment:not(.dying)');
  var now = Date.now();
  fragments.forEach(function(f){
    var created = f.dataset.created;
    if (!created) return;
    var age = now - new Date(created).getTime();
    var hoursLeft = Math.max(0, 24 - age/3600000);
    if (hoursLeft < 3) f.classList.add('fading');
    if (hoursLeft < 0.5 && !f.dataset.marked){
      f.dataset.marked = '1';
      var to = hoursLeft * 3600000;
      if (to < 0) to = 100;
      setTimeout(function(){
        f.classList.add('dying');
        setTimeout(function(){ if(f.parentElement) f.remove(); }, 4500);
      }, to);
    }
  });
}, 30000);

// 写入口
document.getElementById('writeEntry').addEventListener('click',function(){
  document.getElementById('writePanel').classList.add('show');
  document.getElementById('writeInput').focus();
});

var writeInput = document.getElementById('writeInput');
var charCount = document.getElementById('charCount');
writeInput.addEventListener('input',function(){
  charCount.textContent = writeInput.value.length;
});

document.getElementById('writeClose').addEventListener('click',closeWrite);
document.getElementById('writeCancel').addEventListener('click',closeWrite);
function closeWrite(){
  document.getElementById('writePanel').classList.remove('show');
  writeInput.value = '';
  charCount.textContent = '0';
}

var isSubmitting = false;
document.getElementById('writeSubmit').addEventListener('click',function(){
  var text = writeInput.value.trim();
  if (!text || isSubmitting || text.length > 140) return;
  isSubmitting = true;
  supabase.from('messages').insert({content:text}).select().single().then(function(res){
    isSubmitting = false;
    if (res.error){alert('挂失败了，再试一次');return;}
    closeWrite();
    loadMessages();
  });
});

loadMessages();
</script>
</body>
</html>
