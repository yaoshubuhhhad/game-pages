<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>挂念</title>
<link rel="stylesheet" href="../theme/theme.css">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;background:#050201}
.space{width:100vw;height:100vh;position:relative;overflow:hidden}
.space::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 42%,rgba(40,25,12,.35) 0%,rgba(12,6,2,.8) 45%,rgba(3,2,0,.96) 100%)}

/* 顶栏 — 极淡 */
.top-left{position:absolute;top:20px;left:20px;z-index:10;color:rgba(255,255,255,.15);font-size:11px;text-decoration:none;letter-spacing:2px}
.top-left:hover{color:var(--gold)}
.top-right{position:absolute;top:20px;right:24px;z-index:10;text-align:right;color:rgba(255,255,255,.22);font-size:14px;font-family:serif;letter-spacing:6px}

/* 角落旁白 — 几乎消失 */
.whisper{position:absolute;bottom:28px;right:22px;z-index:10;color:rgba(255,255,255,.05);font-size:9px;text-align:right;line-height:1.8;letter-spacing:2px;font-family:serif;pointer-events:none}

/* ====== 碎片 ====== */
.fragment{position:absolute;cursor:default;font-family:serif;letter-spacing:.5px;line-height:1.65;text-align:center;transition:transform .6s ease-out,opacity 2s,filter 2s,text-shadow .6s}

/* 近景——大、亮、暖、清晰 */
.frag-near{font-size:15px;color:rgba(255,240,220,.7);filter:blur(0);z-index:6;transform:scale(1.02);text-shadow:0 0 12px rgba(200,155,60,.08)}
.frag-near:hover{color:rgba(255,248,238,.95);text-shadow:0 0 24px rgba(200,155,60,.2);transform:scale(1.08)!important}

/* 中景——中等、半透明 */
.frag-mid{font-size:12px;color:rgba(255,225,195,.35);filter:blur(.4px);z-index:4;transform:scale(.95)}
.frag-mid:hover{color:rgba(255,240,220,.75);filter:blur(0);text-shadow:0 0 12px rgba(200,155,60,.1);transform:scale(1.04)!important}

/* 远景——小、暗、模糊、像快消失了 */
.frag-far{font-size:10px;color:rgba(220,190,150,.14);filter:blur(1.2px);z-index:2;transform:scale(.88)}
.frag-far:hover{color:rgba(255,230,200,.45);filter:blur(.5px);text-shadow:0 0 6px rgba(200,155,60,.04);transform:scale(.95)!important}

/* 写入口——像一块特别的碎片漂浮在近景 */
.frag-entry{font-size:13px;color:rgba(255,255,255,.22);z-index:5;cursor:pointer;letter-spacing:3px;animation:entry-breathe 4s ease-in-out infinite}
.frag-entry:hover{color:rgba(255,255,255,.5);text-shadow:0 0 20px rgba(200,155,60,.15)}
@keyframes entry-breathe{0%,100%{opacity:.5}50%{opacity:1}}

/* 漂浮动画 */
.frag-drift{animation:drift 18s ease-in-out infinite}
.frag-drift:nth-child(odd){animation-duration:22s}
.frag-drift:nth-child(even){animation-duration:16s;animation-delay:5s}
.frag-drift:nth-child(3n){animation-duration:20s;animation-delay:2s}
.frag-drift:nth-child(5n){animation-duration:25s;animation-delay:8s}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0deg)}20%{transform:translate(8px,-5px) rotate(.6deg)}40%{transform:translate(-4px,3px) rotate(-.4deg)}60%{transform:translate(-7px,-2px) rotate(.3deg)}80%{transform:translate(3px,6px) rotate(-.5deg)}}

/* 衰退 + 死亡 */
.fragment.fading{opacity:.2;filter:blur(2.5px) grayscale(.5)}
.fragment.dying{opacity:0;filter:blur(8px);transform:translateY(20px) scale(.7)!important;transition:opacity 4s ease-in,filter 4s ease-in,transform 4s ease-in;pointer-events:none}

/* 书写面板 */
.write-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(6,3,1,.82);backdrop-filter:blur(12px);flex-direction:column;align-items:center;justify-content:center}
.write-overlay.show{display:flex}
.write-plaque{background:linear-gradient(180deg,rgba(140,95,45,.45),rgba(85,50,28,.3));border:1px solid rgba(200,155,60,.22);border-radius:8px;padding:28px 22px;width:280px;text-align:center;box-shadow:0 0 50px rgba(200,155,60,.1),0 10px 40px rgba(0,0,0,.65);animation:plaque-glow .6s ease-out}
@keyframes plaque-glow{0%{opacity:.2;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
.write-plaque textarea{width:100%;height:100px;background:transparent;border:none;outline:none;resize:none;color:rgba(255,240,220,.78);font-size:13px;line-height:2;font-family:serif;letter-spacing:1px;text-align:center}
.write-plaque textarea::placeholder{color:rgba(255,255,255,.12)}
.write-plaque .char-count{font-size:10px;color:rgba(255,255,255,.13);text-align:right;margin-top:6px}
.write-actions{margin-top:18px;display:flex;gap:12px}
.write-close{position:absolute;top:24px;right:24px;color:rgba(255,255,255,.18);font-size:22px;cursor:pointer;background:none;border:none;line-height:1}
</style>
</head>
<body>
<div class="space" id="space">
  <a href="../index.html" class="top-left">← 灯札</a>
  <div class="top-right">挂 念</div>
  <div class="whisper">有些话<br>适合留给<br>夜晚</div>
</div>

<div class="write-overlay" id="writePanel">
  <button class="write-close" id="writeClose">✕</button>
  <div class="write-plaque">
    <textarea id="writeInput" placeholder="留下些什么？" maxlength="140"></textarea>
    <div class="char-count"><span id="charCount">0</span>/140</div>
  </div>
  <div class="write-actions">
    <button class="theme-btn-ghost" id="writeCancel">再想想</button>
    <button class="theme-btn" id="writeSubmit">挂念</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../theme/particles.js"></script>
<script>
var supabase = window.supabase.createClient(
  'https://kzcmavjvsowcmglcutds.supabase.co',
  'sb_publishable_qB7PKRmlPsJdb-PFzpxY7A_QVF9BNcG'
);

var space = document.getElementById('space');
var DEATH = 30;

// 预计算位置——避免重叠的伪随机网格
function spreadPositions(count) {
  var positions = [];
  var cols = 5, rows = Math.ceil(count / cols);
  var vwPad = 12, vhPad = 15;
  var cw = (100 - vwPad*2) / cols;
  var rh = (80 - vhPad*2) / rows;
  for (var i = 0; i < count; i++) {
    var col = i % cols, row = Math.floor(i / cols);
    // 在网格内加随机偏移
    var ox = (Math.random() - .5) * cw * .7;
    var oy = (Math.random() - .5) * rh * .7;
    positions.push({
      x: vwPad + col * cw + cw/2 + ox,
      y: vhPad + row * rh + rh/2 + oy,
      rot: (Math.random() - .5) * 5 // -2.5° ~ 2.5°
    });
  }
  // 随机打乱
  for (var j = positions.length - 1; j > 0; j--) {
    var k = Math.floor(Math.random() * (j + 1));
    var tmp = positions[j]; positions[j] = positions[k]; positions[k] = tmp;
  }
  return positions;
}

function escapeHtml(text) {
  var d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function loadMessages() {
  supabase.from('messages').select('*').order('created_at',{ascending:false}).limit(50).then(function(res){
    if (res.error){console.error(res.error);return;}
    var messages = res.data || [];
    renderMessages(messages);
  });
}

function renderMessages(messages) {
  var now = Date.now();
  var total = messages.length;
  var positions = spreadPositions(total + 1); // +1 for entry
  var html = '';

  messages.forEach(function(msg,i){
    var age = now - new Date(msg.created_at).getTime();
    var hoursLeft = Math.max(0, 24 - age/3600000);
    var fadeClass = '';
    if (total > DEATH) {
      if (hoursLeft < 3) fadeClass = ' fading';
      if (hoursLeft < 0.5) fadeClass = ' dying';
    }
    // 深度分层
    var depth, maxW, trunc;
    if (i < 7) { depth = 'frag-near'; maxW = 200; trunc = 0; }
    else if (i < 18) { depth = 'frag-mid'; maxW = 150; trunc = 10; }
    else { depth = 'frag-far'; maxW = 110; trunc = 6; }

    var pos = positions[i];
    var displayText = msg.content;
    if (trunc > 0 && msg.content.length > trunc) {
      displayText = msg.content.substring(0, trunc) + '…';
    }

    html += '<div class="fragment frag-drift '+depth+fadeClass+'" style="left:'+pos.x+'vw;top:'+pos.y+'vh;max-width:'+maxW+'px;transform:rotate('+pos.rot.toFixed(1)+'deg)" data-id="'+msg.id+'" data-depth="'+depth+'" data-created="'+msg.created_at+'" data-full="'+escapeHtml(msg.content)+'">'+
      escapeHtml(displayText)+
    '</div>';
  });

  // 写入口——近景漂浮块
  var ep = positions[messages.length];
  html += '<div class="fragment frag-drift frag-entry" id="writeEntry" style="left:'+ep.x+'vw;top:'+ep.y+'vh;max-width:160px;transform:rotate('+ep.rot.toFixed(1)+'deg)">'+
    '留下些什么？'+
  '</div>';

  space.innerHTML += html;

  // 绑定 hover 完整显示
  space.querySelectorAll('.fragment:not(.frag-entry)').forEach(function(frag){
    var full = frag.dataset.full;
    var original = frag.textContent;
    frag.addEventListener('mouseenter',function(){
      frag.textContent = full;
    });
    frag.addEventListener('mouseleave',function(){
      frag.textContent = original;
    });
  });

  // 绑定写入口
  var entry = document.getElementById('writeEntry');
  if (entry) {
    entry.addEventListener('click',function(){
      document.getElementById('writePanel').classList.add('show');
      document.getElementById('writeInput').focus();
    });
  }
}

// 时间衰减
setInterval(function(){
  var frags = space.querySelectorAll('.fragment:not(.frag-entry):not(.dying)');
  if (frags.length <= DEATH) return;
  var now = Date.now();
  frags.forEach(function(f){
    var created = f.dataset.created;
    if (!created) return;
    var age = now - new Date(created).getTime();
    var hoursLeft = Math.max(0, 24 - age/3600000);
    if (hoursLeft < 3) f.classList.add('fading');
    if (hoursLeft < 0.5 && !f.dataset.marked){
      f.dataset.marked = '1';
      setTimeout(function(){
        f.classList.add('dying');
        setTimeout(function(){ if(f.parentElement) f.remove(); }, 4500);
      }, Math.max(100, hoursLeft * 3600000));
    }
  });
}, 30000);

// 书写
var writeInput = document.getElementById('writeInput');
var charCount = document.getElementById('charCount');
writeInput.addEventListener('input',function(){ charCount.textContent = writeInput.value.length; });
document.getElementById('writeClose').addEventListener('click',closeWrite);
document.getElementById('writeCancel').addEventListener('click',closeWrite);
function closeWrite(){
  document.getElementById('writePanel').classList.remove('show');
  writeInput.value = '';
  charCount.textContent = '0';
}
var isSubmitting = false;
document.getElementById('writeSubmit').addEventListener('click',function(){
  var text = writeInput.value.trim();
  if (!text || isSubmitting || text.length > 140) return;
  isSubmitting = true;
  supabase.from('messages').insert({content:text}).select().single().then(function(res){
    isSubmitting = false;
    if (res.error){alert('挂失败了，再试一次');return;}
    closeWrite();
    // 清理旧 DOM 重新渲染
    space.querySelectorAll('.fragment').forEach(function(f){ f.remove(); });
    loadMessages();
  });
});

loadMessages();
</script>
</body>
</html>
