<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>求签</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(180deg,#1a0a00,#2d1810,#1a0a00);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
.back-link{position:absolute;top:20px;left:16px;color:rgba(255,255,255,.25);font-size:12px;text-decoration:none;z-index:10}
.back-link:active{color:#e17055}
.container{max-width:420px;margin:0 auto;padding:50px 20px 30px;position:relative;z-index:1;min-height:100vh}
.title{text-align:center;font-size:22px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:8px;font-family:serif;margin-bottom:4px}
.subtitle{text-align:center;font-size:11px;color:rgba(255,255,255,.2);margin-bottom:16px;letter-spacing:4px}

/* 页面阶段 */
.stage{display:none}
.stage.active{display:block}

/* ====== 阶段1: 选签谱 ====== */
.category-list{display:flex;flex-direction:column;gap:8px}
.cat-card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .15s}
.cat-card:active{background:rgba(200,160,60,.1);border-color:rgba(220,180,60,.2)}
.cat-icon{font-size:28px;flex-shrink:0}
.cat-info{flex:1}
.cat-name{font-size:14px;font-weight:600;color:rgba(255,255,255,.7)}
.cat-desc{font-size:11px;color:rgba(255,255,255,.3);margin-top:2px}
.cat-count{font-size:10px;color:rgba(255,255,255,.15);flex-shrink:0}

/* ====== 阶段2: 输入信息 ====== */
.form-group{margin-bottom:14px}
.form-label{font-size:11px;color:rgba(255,255,255,.35);margin-bottom:4px;display:block}
.form-input{width:100%;padding:10px 12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:rgba(255,255,255,.65);font-size:13px;font-family:inherit}
.form-input:focus{outline:none;border-color:rgba(220,180,60,.25)}
.chosen-cat{text-align:center;color:rgba(255,255,255,.3);font-size:12px;margin-bottom:16px}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:16px}
.btn{padding:11px 28px;border-radius:24px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
.btn-back{background:rgba(255,255,255,.06);color:rgba(255,255,255,.35)}
.btn-go{background:linear-gradient(135deg,rgba(200,160,60,.2),rgba(200,160,60,.06));border:1.5px solid rgba(220,180,60,.2);color:#d4a030}

/* ====== 阶段3: 静心默念 ====== */
.meditation-area{text-align:center;padding:20px 0}
.meditation-icon{font-size:64px;margin-bottom:12px}
.meditation-title{font-size:16px;color:rgba(255,255,255,.65);font-weight:600;margin-bottom:8px}
.prayer-text{background:rgba(255,255,255,.04);border-radius:12px;padding:16px;color:rgba(255,255,255,.35);font-size:12px;line-height:1.8;text-align:left;margin:16px 0;font-family:serif;letter-spacing:1px}
.copy-prayer{font-size:10px;color:rgba(255,255,255,.18);cursor:pointer;margin-top:4px;display:inline-block}

/* ====== 阶段4: 摇签 ====== */
.tube-wrapper{position:relative;margin:8px auto 0;width:90px}
.tube{width:90px;height:230px;position:relative}
.tube-body{width:100%;height:100%;background:linear-gradient(180deg,#b8a04a 0%,#c4b050 8%,#b8a040 30%,#c8b458 50%,#b49c40 70%,#c4b050 85%,#b8a04a 100%);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.45),inset 2px 0 8px rgba(255,255,255,.06),inset -2px 0 8px rgba(0,0,0,.08);overflow:hidden;position:relative}
.tube-body::before{content:'';position:absolute;inset:0;opacity:.05;background:repeating-linear-gradient(90deg,transparent 4px,rgba(0,0,0,.3) 5px,transparent 6px)}
.tube-ring{position:absolute;left:3px;right:3px;height:3px;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.3);z-index:2}
.tube-ring.top{top:10px;background:linear-gradient(180deg,#d4a030,#b8860b,#d4a030)}
.tube-ring.bottom{bottom:10px;background:linear-gradient(180deg,#b8860b,#d4a030,#b8860b)}
.tube-base{position:absolute;bottom:-12px;left:50%;margin-left:-42px;width:84px;height:14px;background:linear-gradient(180deg,#8B6914,#6b4c12,#8B6914);border-radius:0 0 12px 12px;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.sticks-container{position:absolute;top:16px;left:18px;right:18px;bottom:16px;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-content:flex-start;overflow:hidden}
.stick{width:5px;border-radius:1px}
.stick-popped{position:absolute;top:-65px;left:50%;margin-left:-4px;width:8px;height:80px;background:linear-gradient(90deg,#f5e6ca,#fff,#f0e6d0);border-radius:3px 3px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.3);z-index:4;display:none}
.stick-popped.show{display:block;animation:stick-out .35s ease-out}
.stick-popped .num{position:absolute;top:16px;left:0;right:0;text-align:center;font-size:7px;color:#8B6914;writing-mode:vertical-rl;font-family:serif}
@keyframes tube-shake{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-6deg)}75%{transform:rotate(5deg)}}
@keyframes stick-out{0%{transform:translateY(0);opacity:0}100%{transform:translateY(-65px);opacity:1}}

.shake-btn{display:inline-block;background:linear-gradient(135deg,rgba(180,130,50,.1),rgba(180,130,50,.03));border:1.5px solid rgba(200,160,60,.18);color:#d4a030;padding:12px 44px;border-radius:26px;font-size:14px;font-weight:600;letter-spacing:4px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.shake-btn:active{background:rgba(200,160,60,.15)}
.shake-btn.shaking{background:rgba(200,160,60,.2);border-color:rgba(220,180,60,.4)}
.hint{color:rgba(255,255,255,.13);font-size:10px;margin-top:6px}

/* ====== 阶段5: 结果 ====== */
.result-zone{width:100%;max-width:320px;margin:0 auto}
.lot-card{background:linear-gradient(135deg,rgba(253,203,110,.06),rgba(200,160,60,.03));border:1px solid rgba(220,180,60,.12);border-radius:12px;padding:16px;margin-bottom:10px}
.lot-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lot-num{color:#d4a030;font-size:15px;font-weight:700;font-family:serif}
.lot-level{background:rgba(220,180,60,.15);color:#d4a030;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600}
.lot-poem{color:rgba(255,255,255,.55);font-size:14px;line-height:2.2;text-align:center;font-family:serif;letter-spacing:3px;white-space:pre-line}
.lot-element{margin-top:10px;color:rgba(255,255,255,.3);font-size:11px}
.lot-meaning{background:rgba(255,255,255,.02);border-radius:10px;padding:12px;color:rgba(255,255,255,.35);font-size:12px;line-height:1.8}
.meaning-label{color:rgba(255,255,255,.18);font-size:10px;margin-bottom:4px}
.retry-btn{display:inline-block;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.25);padding:8px 28px;border-radius:24px;font-size:12px;cursor:pointer;margin:8px 4px}
.retry-btn:active{background:rgba(255,255,255,.08)}

.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 20px;border-radius:20px;font-size:12px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="container">
  <a href="../index.html" class="back-link">← 工具站</a>
  <div class="title">求 签</div>

  <!-- ====== 阶段1: 选签谱 ====== -->
  <div class="stage active" id="stageCategory">
    <div class="subtitle">请选择签谱</div>
    <div class="category-list" id="categoryList"></div>
  </div>

  <!-- ====== 阶段2: 输入信息 ====== -->
  <div class="stage" id="stageInput">
    <div class="subtitle">一事一问 · 心诚则灵</div>
    <div class="chosen-cat" id="chosenCat"></div>
    <div class="form-group">
      <label class="form-label">姓名</label>
      <input class="form-input" id="inputName" placeholder="你的名字">
    </div>
    <div class="form-group">
      <label class="form-label">出生年月日</label>
      <input class="form-input" id="inputBirth" placeholder="例如：1995年3月8日">
    </div>
    <div class="form-group">
      <label class="form-label">所求之事（可选）</label>
      <input class="form-input" id="inputMatter" placeholder="例如：事业前程 / 姻缘 / 财运">
    </div>
    <div class="btn-row">
      <button class="btn btn-back" onclick="goStage('stageCategory')">← 重选签谱</button>
      <button class="btn btn-go" onclick="goStage('stageMeditation')">静心求签 →</button>
    </div>
  </div>

  <!-- ====== 阶段3: 静心默念 ====== -->
  <div class="stage" id="stageMeditation">
    <div class="meditation-area">
      <div class="meditation-icon">🙏</div>
      <div class="meditation-title">静心默念</div>
      <div class="subtitle">心诚则灵 · 一事一问</div>
      <div class="prayer-text" id="prayerText"></div>
      <span class="copy-prayer" onclick="copyPrayer()">📋 复制祷告文</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-go" onclick="goStage('stageShake')">🙏 已默念，开始摇签</button>
    </div>
  </div>

  <!-- ====== 阶段4: 摇签 ====== -->
  <div class="stage" id="stageShake">
    <div class="subtitle" style="text-align:center;">长按签筒摇动 · 松手即出签</div>
    <div class="tube-wrapper" id="tubeWrapper">
      <div class="tube" id="tubeEl">
        <div class="tube-body">
          <div class="tube-ring top"></div>
          <div class="tube-ring bottom"></div>
          <div class="sticks-container" id="sticksContainer"></div>
        </div>
        <div class="tube-base"></div>
        <div class="stick-popped" id="stickPopped"><div class="num" id="stickNum"></div></div>
      </div>
    </div>
    <div style="text-align:center;margin-top:12px;">
      <div class="shake-btn" id="shakeBtn">🖐 长按摇签</div>
      <div class="hint">按住摇动 · 松手出签</div>
    </div>
  </div>

  <!-- ====== 阶段5: 结果 ====== -->
  <div class="stage" id="stageResult">
    <div class="subtitle" style="text-align:center;">签已出</div>
    <div class="result-zone">
      <div class="lot-card">
        <div class="lot-header">
          <span class="lot-num" id="lotNum"></span>
          <span class="lot-level" id="lotLevel"></span>
        </div>
        <div class="lot-poem" id="lotPoem"></div>
        <div class="lot-element" id="lotElement"></div>
      </div>
      <div class="lot-meaning">
        <div class="meaning-label">📖 解签</div>
        <div id="lotMeaning"></div>
      </div>
      <div style="text-align:center;margin-top:10px;">
        <button class="retry-btn" onclick="goStage('stageShake')">🔄 再求一签</button>
        <button class="retry-btn" onclick="goStage('stageCategory')">🎋 换签谱</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
// ====== 9类签谱 ======
var CATEGORIES = [
  {name:'观音灵签',desc:'最通用灵签，适用事业/婚姻/财运等所有事',count:100,icon:'🪷',type:'buddhist'},
  {name:'关帝灵签',desc:'道教忠义，偏事业/官非/义气，典故多三国',count:100,icon:'⚔️',type:'taoist'},
  {name:'黄大仙灵签',desc:'香港华南流行，偏养生/财运/健康',count:100,icon:'🐉',type:'taoist'},
  {name:'妈祖灵签',desc:'东南沿海，偏出海/平安/家宅',count:60,icon:'🌊',type:'taoist'},
  {name:'月老灵签',desc:'专管姻缘，只问感情/婚姻/缘分',count:60,icon:'💕',type:'taoist'},
  {name:'财神灵签',desc:'偏财运/生意/投资/事业',count:100,icon:'💰',type:'taoist'},
  {name:'吕祖灵签',desc:'偏修行/健康/避灾/养生',count:100,icon:'🏔️',type:'taoist'},
  {name:'土地公灵签',desc:'地方小事，家宅/平安/琐碎事',count:32,icon:'🏠',type:'taoist'},
  {name:'六十甲子签',desc:'最古老通用签，偏流年/命运/大事',count:60,icon:'☯️',type:'taoist'}
];

// ====== 签文数据（观音灵签 100签） ======
var LOTS = [
  {id:1,level:'上上',element:'火',direction:'南',poem:'云开见月明\n风正一帆轻\n莫愁前路远\n自有贵人迎',meaning:'所求之事虽有波折但终得贵人相助。事业宜稳扎稳打，感情莫急莫慌。近期有惊喜，保持期待。'},
  {id:2,level:'上',element:'木',direction:'东',poem:'春风吹又生\n枯木亦逢春\n待到花开日\n自有好前程',meaning:'当前虽有困境但春天将至。坚持就是胜利，不要放弃。适合学习充电。'},
  {id:3,level:'上',element:'金',direction:'西',poem:'金石可镂坚\n磨砺出锋寒\n一朝青云上\n声名四海传',meaning:'适合埋头苦干积累实力。金子总会发光，时机未到莫急。'},
  {id:4,level:'中',element:'土',direction:'中',poem:'地势坤载物\n厚德可载福\n安分守己处\n自有天来助',meaning:'稳字当头不宜冒进。按部就班行事，踏实者终得好报。'},
  {id:5,level:'上上',element:'火',direction:'南',poem:'日照千山暖\n风和万物春\n今朝行好事\n自有福临门',meaning:'大吉大利万事俱备。抓住当下好时机，适合大展拳脚。'},
  {id:6,level:'中',element:'水',direction:'北',poem:'水到渠自成\n莫问路几程\n但行脚下事\n功到自然成',meaning:'顺其自然不必焦虑。做好眼前的事即可，结果会来的。'},
  {id:7,level:'上',element:'金',direction:'西',poem:'金声玉振新\n一鸣天下闻\n但看风云会\n终须踏青云',meaning:'有贵人提携之象。适合展示才华积极参加社交。'},
  {id:8,level:'中',element:'木',direction:'东',poem:'木秀于林易\n风摧亦不奇\n守得初心在\n何惧风雨欺',meaning:'保持初心不必羡慕他人速成。慢工出细活后发先至。'},
  {id:9,level:'下',element:'火',direction:'南',poem:'火急燎原势\n须防反噬身\n劝君收烈火\n徐徐可图成',meaning:'急火攻心反伤身。放缓节奏欲速则不达。谨慎行事。'},
  {id:10,level:'中',element:'水',direction:'北',poem:'水静深流远\n不争自向前\n心安即是福\n何必问神仙',meaning:'心静自然顺。有些事急不来，交给时间。知足常乐。'},
  {id:11,level:'上',element:'土',direction:'中',poem:'土厚根基固\n枝繁叶自舒\n辛勤终有报\n不必叹劳劬',meaning:'播种与收获不在同一季节。之前的辛劳快要结果了。'},
  {id:12,level:'中',element:'金',direction:'西',poem:'金玉其外装\n内里须自强\n莫羡他人好\n修身是良方',meaning:'外表不如内在重要。专心提升自己，别比较。'},
  {id:13,level:'上上',element:'火',direction:'南',poem:'祥云天上聚\n瑞气满华堂\n所求皆如愿\n万事尽辉煌',meaning:'诸事顺遂万事如意。适合签订重要合同或开始新计划。'},
  {id:14,level:'中',element:'木',direction:'东',poem:'木已成舟去\n莫念旧时航\n前路风光好\n何必回头望',meaning:'放下过去向前看。新的机会正在路上，别回头。'},
  {id:15,level:'下下',element:'水',direction:'北',poem:'水覆难收转\n风波几度翻\n劝君收羽翼\n暂避此难关',meaning:'前方有险不建议近期做大决定。避风头为上策。'}
];

// ====== 渲染签谱 ======
function renderCategories() {
  var html = '';
  for (var i = 0; i < CATEGORIES.length; i++) {
    var c = CATEGORIES[i];
    html += '<div class="cat-card" data-idx="' + i + '">' +
      '<span class="cat-icon">' + c.icon + '</span>' +
      '<span class="cat-info"><div class="cat-name">' + c.name + '</div><div class="cat-desc">' + c.desc + '</div></span>' +
      '<span class="cat-count">' + c.count + '签</span>' +
    '</div>';
  }
  document.getElementById('categoryList').innerHTML = html;

  document.querySelectorAll('.cat-card').forEach(function(card) {
    card.addEventListener('click', function() {
      currentCategory = CATEGORIES[parseInt(this.dataset.idx)];
      document.getElementById('chosenCat').textContent = '📜 ' + currentCategory.name + ' · ' + currentCategory.count + '签';
      goStage('stageInput');
    });
  });
}

// ====== 阶段切换 ======
var currentCategory = CATEGORIES[0];
var currentLot = null;

function goStage(id) {
  document.querySelectorAll('.stage').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');

  if (id === 'stageMeditation') {
    var name = document.getElementById('inputName').value || '信士';
    document.getElementById('prayerText').textContent =
      '伏以：\n今有信士' + name + '，虔心叩拜' + currentCategory.name + '圣前。\n' +
      '所求之事，诚心祷告，望神明指示。\n' +
      '若有得罪，诚心忏悔；若有福德，愿与众生共沾。\n' +
      '愿神明慈悲，明示吉凶，弟子依教奉行。\n\n叩首再拜';
  }
  if (id === 'stageShake') {
    renderSticks();
    document.getElementById('stickPopped').classList.remove('show');
  }
}

// ====== 签条渲染 ======
function renderSticks() {
  var container = document.getElementById('sticksContainer');
  var html = '';
  var shades = ['#faf3e6','#f5e6ca','#f0e6d0'];
  for (var i = 0; i < 30; i++) {
    var h = 145 + Math.floor(Math.random() * 12) - 6;
    var rot = (Math.random() - .5) * 6;
    html += '<div class="stick" style="height:' + h + 'px;background:' + shades[i%3] + ';transform:rotate(' + rot.toFixed(1) + 'deg);"></div>';
  }
  container.innerHTML = html;
}

// ====== 祷告文复制 ======
function copyPrayer() {
  var t = document.getElementById('prayerText').textContent;
  if (navigator.clipboard) { navigator.clipboard.writeText(t).then(function(){showToast('已复制')}); }
  else { showToast('长按文本手动复制'); }
}

// ====== 摇签交互 ======
var pressTimer = null, isShaking = false;
var tubeEl = document.getElementById('tubeEl');

function onPressStart(e) {
  if (isShaking || pressTimer) return;
  e.preventDefault();
  pressTimer = setTimeout(function() {
    isShaking = true;
    tubeEl.style.animation = 'tube-shake .1s infinite';
    document.getElementById('shakeBtn').classList.add('shaking');
    document.getElementById('shakeBtn').textContent = '🤚 摇动中...';
    document.getElementById('stickPopped').classList.remove('show');
  }, 400);
}
function onPressEnd(e) {
  e.preventDefault();
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  if (!isShaking) return;
  isShaking = false;
  tubeEl.style.animation = '';
  document.getElementById('shakeBtn').classList.remove('shaking');
  document.getElementById('shakeBtn').textContent = '🖐 长按摇签';
  revealLot();
}
function revealLot() {
  var idx = Math.floor(Math.random() * LOTS.length);
  currentLot = LOTS[idx];
  document.getElementById('stickNum').textContent = currentLot.id;
  document.getElementById('stickPopped').classList.add('show');
  setTimeout(function() {
    goStage('stageResult');
    document.getElementById('lotNum').textContent = '第' + currentLot.id + '签';
    document.getElementById('lotLevel').textContent = currentLot.level + '签';
    document.getElementById('lotLevel').style.color = currentLot.level.indexOf('上上')===0?'#fdcb6e':currentLot.level.indexOf('下')===0?'#e17055':'#d4a030';
    document.getElementById('lotPoem').textContent = currentLot.poem;
    document.getElementById('lotElement').innerHTML = getElIcon(currentLot.element) + ' ' + currentLot.element + ' · 宜' + currentLot.direction + '方';
    document.getElementById('lotMeaning').textContent = currentLot.meaning;
  }, 400);
}

  clearTimeout(toastTimer); t.classList.remove('show');
