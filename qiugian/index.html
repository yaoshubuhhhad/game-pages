    {id:47,level:'下下',element:'金',direction:'东',poem:'沉迷书画废朝政\n金兵南下国祚倾\n；荣华富贵一场\n梦北狩他乡恨难平',meaning:'玩物丧志，事业荒废。沉迷爱好误正事，财运耗散，感情不稳，防灾祸。'},
    {id:48,level:'中',element:'金',direction:'南',poem:'壮志未酬鬓已霜\n时运不济命多乖\n；空有才华无处\n用光阴虚度恨难排',meaning:'怀才不遇，时不我与。事业难展，财运平平，感情易错过，需惜时。'},
    {id:49,level:'上',element:'水',direction:'南',poem:'雪地冰天十九年\n忠心不改志弥坚\n；一朝得遇还乡\n日名垂青史万古传',meaning:'坚守终得回报，名成利就。长期努力成功，财运稳，感情忠贞，家宅安宁。'},
    {id:50,level:'下下',element:'水',direction:'中',poem:'引狼入室祸中原\n反复无常不义贤\n；虽得荣华一时\n乐到头终究受天谴',meaning:'背信弃义，引火烧身。事业因背叛失败，财运破败，感情不忠，防灾祸。'},
    {id:51,level:'上上',element:'木',direction:'东',poem:'采菊东篱悠然见\n远离尘嚣自安然\n；富贵荣华非所\n愿清风明月乐无边',meaning:'归隐得福，自在逍遥。事业宜退不宜进，财运够用，感情平淡和睦，健康长寿。'},
    {id:52,level:'中',element:'木',direction:'东',poem:'虎坐中堂鸡犬\n相闹；天不如\n人求反增多少\n笑安而不危菊花天到',meaning:'骨肉团圆，危机化解。家人团聚，事业转好，财运渐佳，感情和睦。'},
    {id:53,level:'下下',element:'火',direction:'南',poem:'勇冠三军无智谋\n反复无常不义徒\n；白门楼上身殒\n命荣华富贵化尘埃',meaning:'有勇无谋，反复败亡。事业缺谋略，财运破败，感情花心，防小人。'},
    {id:54,level:'中',element:'火',direction:'南',poem:'年少才华盖世雄\n一朝才尽梦成空\n；笔墨难写心中\n事壮志难酬恨不穷',meaning:'才华衰退，后劲不足。事业后期乏力，财运平平，感情易变淡，需充电。'},
    {id:55,level:'上',element:'土',direction:'中',poem:'铁面无私断案明\n善恶分明不徇情\n；一身正气鬼神\n敬福禄寿喜自临门',meaning:'公正得福，是非分明。事业凭正直成功，财运稳，感情忠贞，家宅安宁。'},
    {id:56,level:'中',element:'土',direction:'东',poem:'单骑见敌胆气豪\n一言能退万军骄\n；智勇双全人敬\n仰名利双收步步高',meaning:'智勇化解危机，贵人相助。事业凭智慧脱困，财运渐佳，感情和睦。'},
    {id:57,level:'下下',element:'金',direction:'东',poem:'荒淫无道乱朝纲\n民怨沸腾国祚亡\n；大运河畔尸骨\n累荣华富贵一场空',meaning:'荒淫败国，灾祸连连。事业因纵欲失败，财运破败，感情混乱，防家破。'},
    {id:58,level:'中',element:'金',direction:'南',poem:'两句三年得\n一吟双泪流\n；知音如不\n赏归卧故山秋',meaning:'精益求精，慢工出细活。事业需打磨，财运慢进，感情细腻，追求完美。'},
    {id:59,level:'上',element:'水',direction:'南',poem:'鬼谷学艺已学成\n下山辅佐帝王兴\n；智谋过人平天\n下名利双收显威名',meaning:'智谋成事，大展宏图。事业凭智慧成功，财运大进，感情聪慧圆满。'},
    {id:60,level:'下下',element:'水',direction:'中',poem:'嫉贤妒能祸心藏\n陷害同门不义彰\n；虽得荣华一时\n乐马陵道上命遭殃',meaning:'嫉妒招祸，害人害己。事业因嫉妒失败，财运受损，感情挑拨，防小人。'},
    {id:61,level:'中',element:'木',direction:'东',poem:'鸿雁传书万里遥\n相思无尽恨难消\n；一朝得遇团圆\n日苦尽甘来乐逍遥',meaning:'异地相思，终得团圆。感情虽有距离，终能相聚，财运渐佳，事业稳。'},
    {id:62,level:'中',element:'木',direction:'东',poem:'战乱纷飞离故乡\n颠沛流离苦备尝\n；虽有才华难展\n志穷愁潦倒度时光',meaning:'乱世奔波，颠沛流离。事业动荡，财运平平，感情分离，需守旧避险。'},
    {id:63,level:'上',element:'火',direction:'南',poem:'挂帅征西胆气豪\n建功立业显英豪\n；衣锦还乡荣故\n里荣华富贵乐逍遥',meaning:'远征成功，名利双收。外出发展吉，事业成功，财运大进，感情圆满。'},
    {id:64,level:'下下',element:'火',direction:'南',poem:'富贵忘恩负义肠\n不认妻儿丧天良\n；一朝事发身败\n裂荣华富贵化黄粱',meaning:'忘恩负义，身败名裂。事业因负义失败，财运破败，感情不忠，防报应。'},
    {id:65,level:'中',element:'土',direction:'中',poem:'举贤荐能为国忙\n慧眼识才助君王\n；功德圆满名垂\n史福禄寿喜自安康',meaning:'贵人荐贤，助人助己。事业得贵人助，财运渐佳，感情和睦，家宅安宁。'},
    {id:66,level:'中',element:'土',direction:'东',poem:'词坛才子帝王囚\n国破家亡恨难休\n；春花秋月何时\n了往事不堪回首头',meaning:'才华难救国，命运多舛。事业难成，财运平平，感情悲伤，防灾祸。'},
    {id:67,level:'上',element:'金',direction:'东',poem:'千里送妹义气扬\n不贪美色品德彰\n；一朝得志登龙\n位福禄寿喜乐无疆',meaning:'正直得福，贵人相助。事业凭正直成功，财运亨通，感情忠贞，家宅安宁。'},
    {id:68,level:'下下',element:'金',direction:'南',poem:'貌美才高遭人妒\n仕途坎坷祸难除\n；虽有才华难展\n志到头难免受刑诛',meaning:'才美招妒，灾祸连连。事业遭小人嫉妒，财运受损，感情招祸，防纠纷。'},
    {id:69,level:'中',element:'水',direction:'南',poem:'昔日阿蒙不学无\n后来勤学智有余\n；士别三日刮目\n看功成名就显英奇',meaning:'勤学成才，后来居上。事业靠学习进步，财运渐佳，感情成熟，越来越好。'},
    {id:70,level:'中',element:'水',direction:'中',poem:'四岁让梨礼仪彰\n聪明伶俐世无双\n；虽有才华遭人\n忌到头难免祸灾降',meaning:'聪明有礼，防人嫉妒。事业聪明但需低调，财运平平，感情乖巧，防小人。'},
    {id:71,level:'上上',element:'木',direction:'东',poem:'封神台上定乾坤\n众神归位各安身\n；功成身退无牵\n挂福禄寿喜乐长春',meaning:'大功告成，名利双收。事业圆满，财运鼎盛，感情和睦，家宅安宁，万事大吉。'},
    {id:72,level:'中',element:'木',direction:'东',poem:'长坂坡上显神威\n单骑救主胆气魁\n；忠心耿耿人敬\n仰名利双收步步高',meaning:'智勇救危，贵人赏识。事业凭智勇脱困，财运渐佳，感情忠贞，家宅安宁。'},
    {id:73,level:'下下',element:'火',direction:'南',poem:'故国不堪回首中\n雕栏玉砌梦成空\n；荣华富贵随流\n水只剩相思泪眼红',meaning:'国破家亡，万事成空。事业崩溃，财运破败，感情悲伤，家宅不宁，诸事凶险。'},
    {id:74,level:'中',element:'火',direction:'南',poem:'昭君出塞远他乡\n琵琶声断泪两行\n；虽得荣华非所\n愿一生寂寞恨悠长',meaning:'远走他乡，寂寞孤单。事业外出发展但孤独，财运平平，感情分离，易孤单。'},
    {id:75,level:'上',element:'土',direction:'中',poem:'煮酒论英雄\n天下谁与同\n；一朝时机\n至霸业自可成',meaning:'英雄识时，霸业可成。事业有雄心，时机一到成功，财运亨通，感情强势。'},
    {id:76,level:'中',element:'土',direction:'东',poem:'年少聪明智不凡\n砸缸救人显英贤\n；一朝得志登高\n位名利双收福自全',meaning:'机智解难，少年得志。事业凭智慧成功，财运渐佳，感情聪慧，家宅安宁。'},
    {id:77,level:'下下',element:'金',direction:'东',poem:'口蜜腹剑祸心藏\n陷害忠良乱朝纲\n；虽得荣华一时\n乐到头终究受天殃',meaning:'小人阴险，祸国殃民。事业遭小人陷害，财运受损，感情挑拨，防官司灾祸。'},
    {id:78,level:'中',element:'金',direction:'南',poem:'被贬蛮荒恨难平\n壮志未酬泪暗零\n；虽有才华无处\n用穷愁潦倒度余生',meaning:'被贬失意，壮志难酬。事业受阻，财运平平，感情悲伤，需忍耐等待。'},
    {id:79,level:'上',element:'水',direction:'南',poem:'先天下之忧而忧\n后天下之乐而乐\n；忠心耿耿为家\n国福禄寿喜自盈眸',meaning:'忧国忧民，德高福厚。事业凭德行成功，财运稳，感情忠贞，家宅安宁，长寿。'},
    {id:80,level:'下下',element:'水',direction:'中',poem:'三分而已\n何须望奢\n；人要回\n家只待日西斜',meaning:'三分天下，战乱不休。事业分裂，财运不稳，感情不和，家宅不宁，诸事艰辛。'},
    {id:81,level:'上上',element:'木',direction:'东',poem:'功成身退不贪荣\n归隐山林自安宁\n；荣华富贵如浮\n云福寿绵长乐太平',meaning:'功成身退，福寿绵长。事业圆满后宜退，财运够用，感情和睦，健康长寿。'},
    {id:82,level:'中',element:'木',direction:'东',poem:'两句三年得\n一吟双泪流\n；知音如不\n赏归卧故山秋',meaning:'苦吟求工，慢成难求。事业需长期打磨，财运慢进，感情细腻，追求完美。'},
    {id:83,level:'下下',element:'火',direction:'南',poem:'卖国求荣罪恶深\n陷害忠良祸国心\n；虽得荣华一时\n乐遗臭万年恨难禁',meaning:'卖国求荣，遗臭万年。事业因卖国失败，财运破败，感情不忠，防灾祸报应。'},
    {id:84,level:'中',element:'火',direction:'南',poem:'相见时难别亦难\n东风无力百花残\n；春蚕到死丝方\n尽蜡炬成灰泪始干',meaning:'相思无尽，离别伤感。感情多离别相思，财运平平，事业难展，易伤感。'},
    {id:85,level:'上',element:'土',direction:'中',poem:'精忠报国气轩昂\n收复失地显英豪\n；虽遭陷害名不\n朽福禄寿喜自昭彰',meaning:'精忠报国，名垂青史。事业凭忠心成功，财运稳，感情忠贞，家宅安宁，名成利就。'},
    {id:86,level:'中',element:'土',direction:'东',poem:'人生自古谁无死\n留取丹心照汗青\n；忠心耿耿为家\n国名垂万古永留馨',meaning:'忠贞殉国，名垂千古。事业凭气节成功，财运稳，感情忠贞，家宅安宁，流芳百世。'},
    {id:87,level:'下下',element:'金',direction:'东',poem:'误国殃民罪恶深\n荒淫无道乱朝纲\n；虽得荣华一时\n乐到头终究丧其身',meaning:'误国殃民，身败名裂。事业因荒淫失败，财运破败，感情混乱，防家破人亡。'},
    {id:88,level:'中',element:'金',direction:'南',poem:'烟笼寒水月笼沙\n夜泊秦淮近酒家\n；商女不知亡国\n恨隔江犹唱后庭花',meaning:'醉生梦死，国破家亡。事业沉迷安逸，财运耗散，感情花心，防灾祸。'},
    {id:89,level:'上',element:'水',direction:'南',poem:'智谋过人平叛功\n心学传世显英雄\n；功成名就身不\n退福禄寿喜乐无穷',meaning:'智谋平叛，建功立业。事业凭智慧成功，财运大进，感情聪慧圆满，家宅安宁。'},
    {id:90,level:'下下',element:'水',direction:'中',poem:'雨打梨花人在天\n涯功名多费力；\n图事不能成阴阳\n反覆时运令人嗟',meaning:'时运不济，功名难成。事业受阻，财运平平，感情分离，家宅不宁，诸事不顺。'},
    {id:91,level:'上上',element:'木',direction:'东',poem:'隆中对策定三分\n未出茅庐知乾坤\n；一朝得志辅明\n主功成名就万古存',meaning:'未卜先知，大业可成。事业凭智慧成功，财运鼎盛，感情和睦，家宅安宁，万事顺遂。'},
    {id:92,level:'中',element:'木',direction:'东',poem:'桃园结义义气扬\n生死与共不相忘\n；同心协力成大\n业名利双收福自昌',meaning:'结义同心，合作大吉。合伙、团队、兄弟 / 姐妹情吉，事业成功，财运渐佳。'},
    {id:93,level:'下下',element:'火',direction:'南',poem:'脑后反骨祸心藏\n背叛主公不义彰\n；虽有战功难掩\n恶到头难免丧身亡',meaning:'背叛招祸，身败名裂。事业因背叛失败，财运破败，感情不忠，防小人背叛。'},
    {id:94,level:'中',element:'火',direction:'南',poem:'自作聪明盗书忙\n中计反害友身亡\n；虽有小聪明无\n大智慧到头终究受祸殃',meaning:'自作聪明，弄巧成拙。事业耍小聪明反坏事，财运受损，感情挑拨，防小人。'},
    {id:95,level:'上',element:'土',direction:'中',poem:'装病避祸藏锋芒\n静待时机起四方\n；一朝得志掌大\n权名利双收福自长',meaning:'隐忍待时，大权在握。事业宜隐忍，时机一到成功，财运亨通，感情沉稳。'},
    {id:96,level:'中',element:'土',direction:'东',poem:'火烧连营破敌强\n智谋过人显英芒\n；功成名就步步\n高福禄寿喜乐安康',meaning:'智谋破敌，大功告成。事业凭智慧成功，财运大进，感情聪慧圆满，家宅安宁。'},
    {id:97,level:'下下',element:'金',direction:'东',poem:'宦官乱政祸心藏\n蒙蔽君主乱朝纲\n；虽得荣华一时\n乐到头终究国破亡',meaning:'小人乱政，国破家亡。事业遭小人蒙蔽，财运破败，感情混乱，防家破国亡。'},
    {id:98,level:'中',element:'金',direction:'南',poem:'九伐中原志未酬\n心力交瘁恨难休\n；虽有忠心难回\n天穷愁潦倒度春秋',meaning:'壮志难酬，心力交瘁。事业努力难有回报，财运平平，感情疲惫，需量力而行。'},
    {id:99,level:'中',element:'水',direction:'南',poem:'可以转移可\n以了结只恨\n运命迍邅故\n此一得一失',meaning:'先凶后吉，得失相伴。事业有转机但有波折，财运起伏，感情分分合合，耐心应对。'},
    {id:100,level:'下下',element:'水',direction:'中',poem:'月落星沉风\n生雨至；只\n要龙虎不相\n争方可如时利',meaning:'大凶之象，诸事不宜。事业失败，财运破败，健康堪忧，感情破裂，防灾祸、丧事。'},
  ],
  '土地公灵签': [
    {id:1,level:'上上',element:'木',direction:'东',poem:'日出东方万里光\n福星高照福满堂\n；家门清泰人安\n乐财禄丰盈大吉昌',meaning:'大吉大利，万事顺遂。家运兴隆，正财旺、偏财有，贵人扶持，婚姻美满。'},
    {id:2,level:'上',element:'木',direction:'东',poem:'一轮明月照中庭\n万里无云万里清\n；谋事求财皆遂\n意贵人指引遇知音',meaning:'光明顺遂，贵人相助。事业顺利，财运稳进，感情和睦，家宅安宁。'},
    {id:3,level:'中',element:'火',direction:'南',poem:'春到人间草木知\n时来运转莫迟疑\n；谋财谋利皆有\n望稳步登高自有时',meaning:'时运渐至，稳步发展。先难后易，财运渐丰，事业稳进，感情平顺。'},
    {id:4,level:'下下',element:'火',direction:'南',poem:'乌云遮月暗无光\n风雨交加百事伤\n；谋事不成财不\n利家宅不宁祸灾防',meaning:'运势低迷，诸事不顺。财运破败，事业受阻，感情矛盾，防口舌是非。'},
    {id:5,level:'中',element:'土',direction:'中',poem:'平地起风波\n好事总成魔\n；守旧方为\n吉贪多祸自多',meaning:'起伏不定，守旧为宜。不宜冒险，稳守可保本，财运平平，感情平淡。'},
    {id:6,level:'上上',element:'土',direction:'东',poem:'金玉满堂福禄全\n荣华富贵喜连连\n；一帆风顺前程\n远万事亨通乐无边',meaning:'富贵双全，财运鼎盛。正偏财皆旺，事业大成，家运昌隆，婚姻美满。'},
    {id:7,level:'上',element:'金',direction:'东',poem:'花开富贵正当时\n好运临门喜自知\n；财禄自然来送\n你贵人相助不须疑',meaning:'时机正好，好运临门。财运亨通，事业顺利，感情甜蜜，家宅吉祥。'},
    {id:8,level:'下下',element:'金',direction:'南',poem:'水中捞月枉费心\n镜里看花假不成\n；谋事求财空费\n力到头还是一场空',meaning:'虚耗心力，徒劳无获。投资必亏，求财无望，事业难成，感情虚假。'},
    {id:9,level:'上上',element:'水',direction:'南',poem:'龙门得水势滔天\n一跃高升上九天\n；富贵荣华从此\n始功名财禄两双全',meaning:'一跃成名，财运爆发。事业腾飞，正偏财皆得，婚姻圆满，家运昌盛。'},
    {id:10,level:'中',element:'水',direction:'中',poem:'勤俭持家富贵长\n一分辛苦一分粮\n；莫贪意外无妄\n利安分守己福自昌',meaning:'正财稳，靠努力。踏实做事得财，偏财平平，守成吉，感情和睦。'},
    {id:11,level:'上',element:'木',direction:'东',poem:'贵人引路到金阶\n财禄功名随手来\n；万事称心皆如\n意福星高照笑颜开',meaning:'贵人带财，好运连连。合作获利，事业提升，财运亨通，感情遇良缘。'},
    {id:12,level:'中',element:'木',direction:'东',poem:'财来财去似流水\n两手空空难聚堆\n；若要守财须节\n俭莫学浪子乱开销',meaning:'留不住财，漏财。开销大、难积蓄，财运不稳，感情易有摩擦。'},
    {id:13,level:'上上',element:'火',direction:'南',poem:'堆金积玉满庭院\n富贵荣华日日添\n；家兴人旺多吉\n庆福寿康宁万万年',meaning:'巨财入库，家运鼎盛。财源广进，富贵双全，人丁兴旺，万事大吉。'},
    {id:14,level:'中',element:'火',direction:'南',poem:'时来运转吉星临\n苦尽甘来福自深\n；谋事求财皆有\n望前程似锦步步春',meaning:'转运得福，渐入佳境。之前辛苦，之后渐富，财运好转，事业顺利。'},
    {id:15,level:'下下',element:'土',direction:'中',poem:'财星暗淡祸星明\n百事艰难不称心\n；家宅不安口舌\n起破财招灾要小心',meaning:'财运差，祸事临。易破财、负债、纠纷，事业受阻，感情破裂。'},
    {id:16,level:'中',element:'土',direction:'东',poem:'守旧安贫莫强求\n时运未到莫出头\n；安分守己无灾\n祸妄动招忧悔难收',meaning:'不宜进取，守旧吉。冒险必败，安稳度日即可，财运平平，感情平淡。'},
    {id:17,level:'上',element:'金',direction:'东',poem:'春风得意马蹄轻\n财禄功名两有成\n；贵人相助前程\n好万事亨通福满门',meaning:'财运亨通，事业顺利。正偏财皆吉，升职加薪，感情甜蜜，家宅安宁。'},
    {id:18,level:'下下',element:'金',direction:'南',poem:'破财难免是非多\n口舌官非要防躲\n；家宅不宁人不\n安灾星临门祸事磨',meaning:'破财招灾，是非缠身。防纠纷、官非、意外损失，感情危机，家宅不宁。'},
    {id:19,level:'上上',element:'水',direction:'南',poem:'天赐横财福禄临\n意外之财喜盈门\n；富贵荣华天注\n定万事如意享太平',meaning:'偏财爆棚，意外之财。奖金、馈赠、中奖可期，财运极旺，事业大成。'},
    {id:20,level:'中',element:'水',direction:'中',poem:'先苦后甜有转机\n耐心等待莫着急\n；熬过风霜见明\n月财禄自然到身边',meaning:'前期辛苦，后期获利。坚持可富，财运渐丰，事业稳进，感情苦尽甘来。'},
    {id:21,level:'中',element:'木',direction:'东',poem:'世事无常难预料\n财缘浅薄莫强求\n；平平淡淡才是\n福知足常乐少烦忧',meaning:'财运普通，无大财。安稳度日即可，事业平淡，感情平稳，知足常乐。'},
    {id:22,level:'上',element:'木',direction:'东',poem:'生意兴隆通四海\n财源茂盛达三江\n；贵人扶持多顺\n利富贵荣华福满堂',meaning:'大财广进，生意红火。八方来财，事业兴旺，合作有利，婚姻美满。'},
    {id:23,level:'下下',element:'火',direction:'南',poem:'财落空门万事空\n谋事无成枉费功\n；家宅不宁多烦\n恼祸灾临门要提防',meaning:'求财无获，事业失败。投资亏损，财运破败，感情失意，家宅不宁。'},
    {id:24,level:'上上',element:'火',direction:'南',poem:'福满门庭喜气浓\n财源滚滚势无穷\n；荣华富贵皆如\n意万事顺遂乐安康',meaning:'富贵至极，财运鼎盛。正偏财皆旺，家资丰厚，人丁兴旺，万事大吉。'},
    {id:25,level:'中',element:'土',direction:'中',poem:'脚踏实地走前程\n莫贪捷径莫贪名\n；勤俭自然财禄\n至稳步登高福自临',meaning:'正财稳，踏实得财。事业靠实力成功，财运渐丰，感情和睦，家宅安宁。'},
    {id:26,level:'下下',element:'土',direction:'东',poem:'贪财惹祸自招灾\n得不偿失悔难猜\n；投资冒险多亏\n损安分守己免祸来',meaning:'贪则破财，冒险必亏。防高风险投资、骗局，财运破败，事业受阻。'},
    {id:27,level:'上',element:'金',direction:'东',poem:'花开并蒂喜盈门\n财禄双全福自深\n；贵人相助前程\n好万事称心乐无垠',meaning:'财运吉，喜事临门。财源稳步增长，事业顺利，感情甜蜜，家宅吉祥。'},
    {id:28,level:'上上',element:'金',direction:'南',poem:'八方来财四季春\n福星高照福满门\n；富贵荣华皆如\n愿平安顺遂乐终身',meaning:'财路宽广，四季进财。正偏财皆旺，平安进财，事业大成，婚姻美满。'},
    {id:29,level:'中',element:'水',direction:'南',poem:'财缘浅薄少机缘\n莫要强求莫要贪\n；守旧安然无灾\n祸平平淡淡度流年',meaning:'财运平平，无暴富。安稳度日即可，不宜冒险，事业平淡，感情平稳。'},
    {id:30,level:'下下',element:'水',direction:'中',poem:'雪上加霜祸不单\n财破灾临苦难堪\n；家宅不宁人离\n散诸事不顺要提防',meaning:'财运极差，连续破财。防重病、意外、纠纷，事业崩溃，感情破裂。'},
    {id:31,level:'上',element:'木',direction:'东',poem:'福星高照福临门\n财禄亨通万事顺\n；贵人指引前程\n远富贵荣华喜盈门',meaning:'财运吉，福气加持。事业顺利获利，正偏财皆旺，感情甜蜜，家宅安宁。'},
    {id:32,level:'下下',element:'木',direction:'东',poem:'尘埋青钢钱\n美玉陷淤泥\n；何时重出\n世再得光辉显',meaning:'时运不济，才华埋没。谋事不成，财库落空，婚姻不顺，出行不利，需蛰伏待机。'},
  ],
  '六十甲子签': [
    {id:1,level:'上上',element:'金',direction:'西',poem:'日出便见浮云散\n光明清净照世间\n；一向前途通大\n道万事清吉保平安',meaning:'乌云尽散，光明大吉。万事顺遂，贵人指路，事业、财运、婚姻皆吉，家宅平安。'},
    {id:2,level:'上',element:'金',direction:'西',poem:'云开月出正分明\n不须进退问前程\n；婚姻皆由天注\n定和合清吉万事成',meaning:'时运开朗，天定良缘。谋事有成，婚姻和合，家运渐吉，求财有份。'},
    {id:3,level:'中',element:'火',direction:'南',poem:'财中渐渐见分明\n花开花谢结子成\n；宽心且看月中\n桂郎君即便见太平',meaning:'先难后易，渐入佳境。财运缓至，事业稳进，婚姻迟成，守旧吉。'},
    {id:4,level:'上上',element:'火',direction:'南',poem:'风恬浪静可行船\n恰似中秋月一轮\n；凡事不须多忧\n虑福禄自有庆家门',meaning:'风平浪静，圆满吉祥。万事无忧，福禄自来，家道昌盛，婚姻和谐。'},
    {id:5,level:'中',element:'木',direction:'中',poem:'只恐前途有变迁\n劝君作事可宜先\n；且去长江无大\n事命逢太白守身边',meaning:'变数较多，宜早筹划。先凶后吉，守旧无灾，进取需谨慎，贵人暗助。'},
    {id:6,level:'下下',element:'木',direction:'中',poem:'风云致雨落洋洋\n天灾时气必有伤\n；命内此事难和\n合更逢一足出外乡',meaning:'时运不济，灾病口舌。谋事难成，破财招灾，婚姻不合，远行不利。'},
    {id:7,level:'上',element:'土',direction:'西',poem:'红日当头照四方\n贵人指引到金阶\n；求财谋利皆如\n意福禄寿喜自安康',meaning:'红日高照，贵人提携。事业高升，财运亨通，家宅兴旺，万事称心。'},
    {id:8,level:'中',element:'土',direction:'西',poem:'渐渐禾苗结实完\n看看作事定周全\n；宽心且向静中\n坐妻儿鼓舞乐团圆',meaning:'功成圆满，家宅和合。谋事有成，婚姻美满，求财得利，骨肉团圆。'},
    {id:9,level:'下下',element:'金',direction:'北',poem:'龙虎相随在深山\n君尔何须背后看\n；不知此去相爱\n误他日与我却无干',meaning:'小人暗算，内斗耗损。事业受阻，财运破败，感情反目，防人暗算。'},
    {id:10,level:'下下',element:'金',direction:'北',poem:'花开结子一半枯\n可惜今年汝虚度\n；日落西山渐渐\n去劝君不用问前途',meaning:'时运衰败，徒劳无功。谋事难成，破财虚耗，婚姻难就，前途暗淡。'},
    {id:11,level:'中',element:'火',direction:'南',poem:'灵鸡渐渐叫分明\n凡事且看子丑寅\n；云开月出照天\n下郎君即便见太平',meaning:'转机渐至，守时待命。前期奔波，后期安稳，财运平平，婚姻迟吉。'},
    {id:12,level:'上',element:'火',direction:'南',poem:'长江风浪渐渐静\n于今得进可安宁\n；必有贵人相扶\n助凶事脱出见太平',meaning:'风波渐息，贵人解围。脱离险境，事业转好，财运渐佳，家宅安宁。'},
    {id:13,level:'上上',element:'水',direction:'北',poem:'一轮明月照中庭\n万里无云万里清\n；谋事求财皆遂\n意贵人指引遇知音',meaning:'光明澄澈，万事称心。事业大成，财运鼎盛，婚姻美满，贵人知心。'},
    {id:14,level:'中',element:'水',direction:'北',poem:'时来运转吉星临\n苦尽甘来福自深\n；谋事求财皆有\n望前程似锦步步春',meaning:'苦尽甘来，渐入佳境。前期艰辛，后期发达，财运好转，事业顺利。'},
    {id:15,level:'下下',element:'土',direction:'中',poem:'有勇无谋事不成\n贪心不足祸缠身\n；到头万事皆成\n空不如守旧免灾星',meaning:'有勇无谋，贪心招祸。事业失败，财运破败，婚姻不顺，守旧避灾。'},
    {id:16,level:'中',element:'土',direction:'中',poem:'世事无常难预料\n财缘浅薄莫强求\n；平平淡淡才是\n福知足常乐少烦忧',meaning:'财运普通，知足常乐。安稳度日，不宜冒险，事业平淡，感情平稳。'},
    {id:17,level:'上上',element:'金',direction:'西',poem:'满门朱紫庆生辰\n福寿双全世所珍\n；七子八婿皆显\n贵荣华富贵享天伦',meaning:'福禄寿全，家运昌盛。事业、财运、感情、家宅皆吉，万事圆满。'},
    {id:18,level:'中',element:'金',direction:'西',poem:'镇守三关胆气豪\n忠心报国显英豪\n；虽有险阻终能\n守名利双收步步高',meaning:'守成得利，稳扎稳打。事业稳守可成，财运平稳，感情忠贞，家宅安宁。'},
    {id:19,level:'上',element:'木',direction:'北',poem:'跨海征东胆气豪\n功成名就显英豪\n；衣锦还乡荣故\n里荣华富贵乐逍遥',meaning:'远征得利，建功立业。外出发展吉，事业成功，财运大进，感情圆满。'},
    {id:20,level:'下下',element:'木',direction:'北',poem:'富贵忘恩负义肠\n不认妻儿丧天良\n；一朝事发身败\n裂荣华富贵化黄粱',meaning:'忘恩负义，身败名裂。事业因负义失败，财运破败，感情不忠，防报应。'},
    {id:21,level:'中',element:'水',direction:'东',poem:'知音难觅恨难平\n碎琴绝弦不再鸣\n；满腔心事无人\n诉孤芳自赏度余生',meaning:'知音难遇，孤独寂寞。事业少贵人，财运平平，感情难寻知己，易孤独。'},
    {id:22,level:'中',element:'水',direction:'东',poem:'举贤荐能为国忙\n慧眼识才助君王\n；功德圆满名垂\n史福禄寿喜自安康',meaning:'贵人荐贤，助人助己。事业得贵人助，财运渐佳，感情和睦，家宅安宁。'},
    {id:23,level:'下下',element:'土',direction:'中',poem:'渔阳鼙鼓破霓裳\n盛世繁华一旦亡\n；叛乱四起生灵\n炭财运功名尽遭殃',meaning:'大乱将至，灾祸连连。事业崩溃，财运破败，家宅不宁，诸事凶险。'},
    {id:24,level:'上上',element:'土',direction:'中',poem:'陈桥兵变黄袍加\n万里山河一掌拿\n；天意人心皆归\n顺荣华富贵享无涯',meaning:'大权在握，基业稳固。事业登顶，财运鼎盛，家宅安宁，万事大吉。'},
    {id:25,level:'上',element:'火',direction:'南',poem:'隆中对策定三分\n未出茅庐知乾坤\n；一朝得志辅明\n主功成名就万古存',meaning:'未卜先知，大业可成。事业凭智慧成功，财运鼎盛，感情和睦，家宅安宁。'},
    {id:26,level:'中',element:'火',direction:'南',poem:'两句三年得\n一吟双泪流\n；知音如不\n赏归卧故山秋',meaning:'精益求精，慢工出细活。事业需打磨，财运慢进，感情细腻，追求完美。'},
    {id:27,level:'上上',element:'木',direction:'西',poem:'中兴汉室显英才\n扫平群寇定尘埃\n；天意人心皆归\n顺荣华富贵享天开',meaning:'绝地重生，复国大业。事业东山再起，财运鼎盛，家宅安宁，万事顺遂。'},
    {id:28,level:'中',element:'木',direction:'西',poem:'过五关来斩六将\n千里独行义气扬\n；虽有险阻终能\n过功成名就耀四方',meaning:'突破难关，勇往直前。克服困难，事业成功，财运渐佳，感情忠贞。'},
    {id:29,level:'中',element:'水',direction:'北',poem:'东西南北不堪行\n前途此事正可当\n；劝君把定莫烦\n恼家门自有保安康',meaning:'四方不利，安守家门。不宜远行，守旧平安，财运平平，家宅安宁。'},
    {id:30,level:'下下',element:'水',direction:'北',poem:'貌美才高遭人妒\n仕途坎坷祸难除\n；虽有才华难展\n志到头难免受刑诛',meaning:'才美招妒，灾祸连连。事业遭小人嫉妒，财运受损，感情招祸，防纠纷。'},
    {id:31,level:'上上',element:'金',direction:'西',poem:'风恬浪静可行船\n恰似中秋月一轮\n；凡事不须多忧\n虑福禄自有庆家门',meaning:'风平浪静，圆满吉祥。万事无忧，福禄自来，家道昌盛，婚姻和谐。'},
    {id:32,level:'下下',element:'金',direction:'西',poem:'花开结子一半枯\n可惜今年汝虚度\n；日落西山渐渐\n去劝君不用问前途',meaning:'时运衰败，徒劳无功。谋事难成，破财虚耗，婚姻难就，前途暗淡。'},
    {id:33,level:'上',element:'火',direction:'南',poem:'智谋过人平叛功\n心学传世显英雄\n；功成名就身不\n退福禄寿喜乐无穷',meaning:'智谋平叛，建功立业。事业凭智慧成功，财运大进，感情聪慧圆满，家宅安宁。'},
    {id:34,level:'中',element:'火',direction:'南',poem:'昔日阿蒙不学无\n后来勤学智有余\n；士别三日刮目\n看功成名就显英奇',meaning:'勤学成才，后来居上。事业靠学习进步，财运渐佳，感情成熟，越来越好。'},
    {id:35,level:'中',element:'木',direction:'中',poem:'壮志未酬鬓已霜\n时运不济命多乖\n；空有才华无处\n用光阴虚度恨难排',meaning:'怀才不遇，时不我与。事业难展，财运平平，感情易错过，需惜时。'},
    {id:36,level:'下下',element:'木',direction:'中',poem:'荒淫无道乱朝纲\n民怨沸腾国祚亡\n；大运河畔尸骨\n累荣华富贵一场空',meaning:'荒淫败国，灾祸连连。事业因纵欲失败，财运破败，感情混乱，防家破。'},
    {id:37,level:'上上',element:'土',direction:'西',poem:'禅让贤明万古传\n民心归顺自安然\n；国泰民安享太\n平福禄寿喜乐无边',meaning:'谦让得福，名利双收。事业平稳晋升，财运亨通，感情和睦，家宅安宁。'},
    {id:38,level:'中',element:'土',direction:'西',poem:'老当益壮胆气豪\n宝刀未老显英豪\n；虽非年少身强\n健建功立业在今朝',meaning:'老运亨通，宝刀未老。中老年事业财运转好，健康尚可，感情稳定。'},
    {id:39,level:'上',element:'金',direction:'北',poem:'装病避祸藏锋芒\n静待时机起四方\n；一朝得志掌大\n权名利双收福自长',meaning:'隐忍待时，大权在握。事业宜隐忍，时机一到成功，财运亨通，感情沉稳。'},
    {id:40,level:'下下',element:'金',direction:'北',poem:'脑后反骨祸心藏\n背叛主公不义彰\n；虽有战功难掩\n恶到头难免丧身亡',meaning:'背叛招祸，身败名裂。事业因背叛失败，财运破败，感情不忠，防小人背叛。'},
    {id:41,level:'上上',element:'火',direction:'东',poem:'渭水垂钓待时来\n直钩不钓世间财\n；一朝得遇文王\n聘万里鹏程任剪裁',meaning:'大器晚成，贵人提携。事业腾飞，财运亨通，婚姻美满。'},
    {id:42,level:'中',element:'火',direction:'东',poem:'同窗结义却相残\n诡计阴谋惹祸端\n；莫道智谋能取\n胜到头终究受天瞒',meaning:'小人当道，内斗耗损。防竞争、纠纷、背叛，合作不利，感情不和。'},
    {id:43,level:'上上',element:'水',direction:'南',poem:'铁面无私断案明\n善恶分明不徇情\n；一身正气鬼神\n敬福禄寿喜自临门',meaning:'公正得福，是非分明。事业凭正直成功，财运稳，感情忠贞，家宅安宁。'},
    {id:44,level:'中',element:'水',direction:'南',poem:'自作聪明盗书忙\n中计反害友身亡\n；虽有小聪明无\n大智慧到头终究受祸殃',meaning:'自作聪明，弄巧成拙。事业耍小聪明反坏事，财运受损，感情挑拨，防小人。'},
    {id:45,level:'上',element:'土',direction:'中',poem:'单骑见敌胆气豪\n一言能退万军骄\n；智勇双全人敬\n仰名利双收步步高',meaning:'智勇化解危机，贵人相助。事业凭智慧脱困，财运渐佳，感情和睦。'},
    {id:46,level:'下下',element:'土',direction:'中',poem:'沉迷书画废朝政\n金兵南下国祚倾\n；荣华富贵一场\n梦北狩他乡恨难平',meaning:'玩物丧志，事业荒废。沉迷爱好误正事，财运耗散，感情不稳，防灾祸。'},
    {id:47,level:'上',element:'金',direction:'西',poem:'精忠报国气轩昂\n收复失地显英豪\n；虽遭陷害名不\n朽福禄寿喜自昭彰',meaning:'精忠报国，名垂青史。事业凭忠心成功，财运稳，感情忠贞，家宅安宁，名成利就。'},
    {id:48,level:'中',element:'金',direction:'西',poem:'人生自古谁无死\n留取丹心照汗青\n；忠心耿耿为家\n国名垂万古永留馨',meaning:'忠贞殉国，名垂千古。事业凭气节成功，财运稳，感情忠贞，家宅安宁，流芳百世。'},
    {id:49,level:'中',element:'木',direction:'北',poem:'言语虽多不可从\n风云静处未行龙\n；暗中终得明消\n息君尔何须问重重',meaning:'流言勿信，静待佳音。事业需防口舌，财运平平，感情有误会，终得澄清。'},
    {id:50,level:'下下',element:'木',direction:'北',poem:'妖妃乱国祸连连\n忠臣尽丧国祚偏\n；酒池肉林荒朝\n政财运功名尽化烟',meaning:'女色 / 小人乱局，灾祸不断。感情招祸，家宅不宁，财运破败，事业崩塌。'},
    {id:51,level:'中',element:'水',direction:'东',poem:'世事如蝶梦一场\n荣华富贵镜中光\n；不如安分随缘\n过免惹灾殃祸自亡',meaning:'梦幻泡影，随缘度日。事业平淡，财运平平，感情随缘，不宜强求。'},
    {id:52,level:'中',element:'水',direction:'东',poem:'渐渐禾苗结实完\n看看作事定周全\n；宽心且向静中\n坐妻儿鼓舞乐团圆',meaning:'功成圆满，家宅和合。谋事有成，婚姻美满，求财得利，骨肉团圆。'},
    {id:53,level:'上上',element:'土',direction:'中',poem:'功成身退不贪荣\n归隐山林自安宁\n；荣华富贵如浮\n云福寿绵长乐太平',meaning:'功成身退，福寿绵长。事业圆满后宜退，财运够用，感情和睦，健康长寿。'},
    {id:54,level:'下下',element:'土',direction:'中',poem:'口蜜腹剑祸心藏\n陷害忠良乱朝纲\n；虽得荣华一时\n乐到头终究受天殃',meaning:'小人阴险，祸国殃民。事业遭小人陷害，财运受损，感情挑拨，防官司灾祸。'},
    {id:55,level:'中',element:'火',direction:'南',poem:'须知进退总言虚\n看看发暗未必全\n；珠玉深藏还未\n变心中但得枉徒然',meaning:'进退两难，徒劳心机。谋事难成，财运平平，感情误会多，需耐心等待。'},
    {id:56,level:'中',element:'火',direction:'南',poem:'火烧连营破敌强\n智谋过人显英芒\n；功成名就步步\n高福禄寿喜乐安康',meaning:'智谋破敌，大功告成。事业凭智慧成功，财运大进，感情聪慧圆满，家宅安宁。'},
    {id:57,level:'上上',element:'木',direction:'西',poem:'蜀川基业已分明\n五虎同心辅圣明\n；天意人心皆顺\n泰荣华富贵享升平',meaning:'大业可成，地位稳固。事业登顶，财运鼎盛，家宅安宁。'},
    {id:58,level:'中',element:'木',direction:'西',poem:'年少才华盖世雄\n一朝才尽梦成空\n；笔墨难写心中\n事壮志难酬恨不穷',meaning:'才华衰退，后劲不足。事业后期乏力，财运平平，感情易变淡，需充电。'},
    {id:59,level:'上',element:'水',direction:'北',poem:'鬼谷学艺已学成\n下山辅佐帝王兴\n；智谋过人平天\n下名利双收显威名',meaning:'智谋成事，大展宏图。事业凭智慧成功，财运大进，感情聪慧圆满。'},
    {id:60,level:'下下',element:'水',direction:'北',poem:'月落星沉风\n生雨至；只\n要龙虎不相\n争方可如时利',meaning:'大凶之象，诸事不宜。事业失败，财运破败，健康堪忧，感情破裂，防灾祸、丧事。'},
  ],
};

// ====== 五行计算工具 ======
// 天干 → 五行映射
var GAN_ELEMENTS = ['水','木','木','火','火','土','土','金','金','水']; // 0=癸,1=甲,2=乙...9=壬
// 注意：GAN_ELEMENTS[0]=癸(水), [1]=甲(木), [2]=乙(木), [3]=丙(火), [4]=丁(火), [5]=戊(土), [6]=己(土), [7]=庚(金), [8]=辛(金), [9]=壬(水)

// 五行生克关系: 0=木,1=火,2=土,3=金,4=水
var SHENG = [1,2,3,4,0]; // SHENG[i] = i 生的元素
var KE = [2,3,4,0,1];    // KE[i] = i 克的元素
var ELEM_IDX = { '木':0,'火':1,'土':2,'金':3,'水':4 };

// 日柱天干 → 五行（索引0=甲,1=乙...9=癸）
var JIAZI_STEMS = ['木','木','火','火','土','土','金','金','水','水'];

// 解析生日字符串 → {year, month, day} 或 null
// 支持: "1995年3月8日", "1995-03-08", "1995/3/8", "1995.3.8", "1995"
function parseBirthDate(str) {
  if (!str) return null;
  var m1 = str.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
  if (m1) return { year: +m1[1], month: +m1[2], day: +m1[3] };
  var m2 = str.match(/(\d{4})[-.\/]\s*(\d{1,2})[-.\/]\s*(\d{1,2})/);
  if (m2) return { year: +m2[1], month: +m2[2], day: +m2[3] };
  var m3 = str.match(/(\d{4})\s+(\d{1,2})\s+(\d{1,2})/);
  if (m3) return { year: +m3[1], month: +m3[2], day: +m3[3] };
  var m4 = str.match(/(\d{4})/);
  if (m4) return { year: +m4[1], month: null, day: null };
  return null;
}

function isLeapYear(y) { return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0); }

// 从1900-01-01起算的天数（基准: 1900-01-01 = 庚子日）
function daysFrom1900(y, m, d) {
  var total = 0;
  for (var yr = 1900; yr < y; yr++) total += isLeapYear(yr) ? 366 : 365;
  var MD = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  if (isLeapYear(y)) MD[2] = 29;
  for (var mo = 1; mo < m; mo++) total += MD[mo];
  total += d - 1;
  return total;
}

// 从生日获取日干五行（日主=你本人，八字核心）
// 有完整日期→算日柱日干；仅年份→回退年干
function getBirthElement(birthStr) {
  var date = parseBirthDate(birthStr);
  if (!date) return null;
  // 仅有年份：回退年干（立春假设：无月日信息时无法判断，取日历年）
  if (date.month === null || date.day === null) {
    var stemIdx = (date.year - 3) % 10;
    return GAN_ELEMENTS[stemIdx];
  }
  // 完整日期：计算日柱 → 日干 → 五行
  var days = daysFrom1900(date.year, date.month, date.day);
  var jiaziIdx = (days + 37) % 60; // 37 = 庚子在六十甲子中的序号
  if (jiaziIdx === 0) jiaziIdx = 60;
  var stemIdx = (jiaziIdx - 1) % 10; // 0=甲,1=乙...9=癸
  return JIAZI_STEMS[stemIdx];
}

// 从所求之事提取五行（关键词匹配）
function getMatterElement(matterStr) {
  if (!matterStr || !matterStr.trim()) return null;
  var s = matterStr;
  if (/官司|诉讼|纠纷|仲裁|维权|合同|法务/.test(s)) return '金';
  if (/事业|工作|前程|职场|升职|求职|跳槽|创业|面试|转行|晋升|项目/.test(s)) return '木';
  if (/感情|姻缘|婚姻|恋爱|爱情|缘分|桃花|分手|复合|相亲|对象|冷战|暧昧/.test(s)) return '火';
  if (/财运|生意|投资|赚钱|财富|钱|理财|收入|亏|负债|贷款|买房|开销/.test(s)) return '金';
  if (/健康|身体|疾病|养生|康复|治病|手术|失眠|体检|不适|调养/.test(s)) return '土';
  if (/学业|考试|读书|学习|成绩|升学|考研|考公|留学|论文|备考|毕业/.test(s)) return '水';
  if (/出行|迁居|搬家|旅行|远行|迁移|出国|回国|出差|签证/.test(s)) return '水';
  if (/家庭|家人|父母|孩子|子女|亲子|婆媳|亲戚/.test(s)) return '土';
  return null;
}

// ====== 五行行为模型 ======
var ELEMENT_THEMES = {
  '木': { keywords:'成长·开启·贵人·学习·远行', sign:'此刻映照：木气上升。你的能量倾向于成长、开启新局、向外联结。若感受确是如此，宜顺势开拓。', balanced:'步伐稳健，成长有序，方向明朗。', excess:'方向过多、贪多难精、急于求成反增焦虑。' },
  '火': { keywords:'行动·表达·突破·自信·竞争', sign:'此刻映照：火气旺盛。你的能量倾向于行动、表达、争取与突破。动能充足时，需聚焦而非发散。', balanced:'行动有力，进退果断，影响自然扩大。', excess:'冲动急躁、过度消耗、易失分寸伤及自身。' },
  '土': { keywords:'稳定·积累·守成·责任·耐力', sign:'此刻映照：土气沉实。你的能量倾向于稳定、积累、承担责任。厚积方能薄发，不必急于求成。', balanced:'根基稳固，步步为营，虽慢必达。', excess:'保守迟缓、压抑停滞、过度谨慎错失良机。' },
  '金': { keywords:'决断·收获·规则·事业·财富', sign:'此刻映照：金气凝聚。你的能量倾向于判断、抉择、建立规则与收获成果。理性清晰时，边界自明。', balanced:'判断精准，决策果断，所获实在有分量。', excess:'控制过强、冷漠苛刻、压力感重易伤关系。' },
  '水': { keywords:'变化·缘分·情绪·转机·智慧', sign:'此刻映照：水气流转。你的能量倾向于感知、变通、顺势而为。柔能克刚——静观往往比强求更有力。', balanced:'智慧通达，随机应变，缘法自然而来。', excess:'犹豫逃避、情绪起伏、方向迷茫难以落地。' }
};

// 五行生克分析 → 三段式解读: { signTheme, interaction, advice, relation, vibe }
// isMatter: true=userEl来自所求之事, false=userEl来自日主
// lotLevel: 签的等级(上上/上吉/...)，用于下下签加限定词
function analyzeMatch(userEl, signEl, isMatter, lotLevel) {
  if (!userEl || !signEl) return null;
  var u = ELEM_IDX[userEl], s = ELEM_IDX[signEl];
  var st = ELEMENT_THEMES[signEl], ut = ELEMENT_THEMES[userEl];
  var k = st.keywords.split('·')[0], uk = ut.keywords.split('·')[0];
  var xe = ut.excess.split('、')[0];
  var selfLabel = isMatter ? '你问的这件事，五行属' : '此刻的你，日主';
  var selfRef = isMatter ? '这件事' : '你';

  // 签意文本 — 下下/下平签加入限定词
  var signText = st.sign;
  var isLow = lotLevel && (lotLevel.indexOf('下下')===0 || lotLevel.indexOf('下平')===0);
  if (isLow) {
    signText += ' 签文等级偏低，映照出此刻或有阻滞——请以签文具体内容为重，元素主题仅供参考。';
  }

  if (u === s) return {
    relation:'同气共振', vibe:'harmonious',
    signTheme: signText,
    interaction: selfLabel + userEl + '，与签同属' + userEl + '——此刻你与外界同频共振。' + st.balanced + '若近期已有' + xe + '的感受，这支签不是催促，而是提醒：平衡比加速重要。',
    advice: '保持' + k + '的正面力量，同时觉察' + xe + '的倾向。同频是最大的助力——此时顺势即可，不须强推。'
  };
  if (SHENG[s] === u) return {
    relation:'外力滋养', vibe:'favorable',
    signTheme: signText,
    interaction: selfLabel + userEl + '，' + signEl + '生' + userEl + '——此刻你感受到的，是外界在推动' + selfRef + '的内在。签的' + st.keywords + '的能量，恰好呼应了' + selfRef + ut.keywords + '的方向。这是一个有风可借的时刻。',
    advice: '若感受确是如此，可顺势向前，把握' + k + '的窗口。同时留心：太顺时容易' + xe + '——稳中求进，比疾冲更远。'
  };
  if (SHENG[u] === s) return {
    relation:'你需付出', vibe:'effort',
    signTheme: signText,
    interaction: selfLabel + userEl + '，' + userEl + '生' + signEl + '——此刻' + selfRef + '正以自身能量推动' + k + '的方向。你能成此事，但它是长期的功课。留意：不要因持续投入而' + xe + '。',
    advice: '量力而行，分阶段推进。适时回收能量、给自己喘息的空间——持久的节奏，比一次耗尽更有力量。'
  };
  if (KE[s] === u) return {
    relation:'外境压制', vibe:'caution',
    signTheme: signText,
    interaction: selfLabel + userEl + '，' + signEl + '克' + userEl + '——此刻外界与' + selfRef + '内在之间有一种张力。签的' + st.keywords + '的能量，与' + selfRef + ut.keywords + '的节奏并不合拍。这不是坏事，而是在映照：当前方向或许与你的本性格格不入。',
    advice: '若感受确是如此，不必硬碰。与其强推' + k + '方向，不如先以' + uk + '的方式迂回观察。等张力自然松动，再做判断。'
  };
  if (KE[u] === s) return {
    relation:'你为主导', vibe:'control',
    signTheme: signText,
    interaction: selfLabel + userEl + '，' + userEl + '克' + signEl + '——此刻的你，比眼前的' + k + '局面更有主动权。局势在你手中，但掌控不等于压制。过度' + xe + '反而会破坏已有的平衡。',
    advice: '以' + uk + '的力量去引导，而非控制。你已占优势——给对方也给自己留一些空间，水到自然渠成。'
  };
  return null;
}

function getVibeStyle(vibe) {
  if (vibe === 'favorable') return 'color:#fdcb6e;background:rgba(253,203,110,.08);border-color:rgba(253,203,110,.15);';
  if (vibe === 'harmonious') return 'color:#d4a030;background:rgba(212,160,48,.08);border-color:rgba(212,160,48,.12);';
  if (vibe === 'control') return 'color:#74b9ff;background:rgba(116,185,255,.08);border-color:rgba(116,185,255,.12);';
  if (vibe === 'effort') return 'color:rgba(255,255,255,.25);background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.06);';
  return 'color:#e17055;background:rgba(225,112,85,.08);border-color:rgba(225,112,85,.12);';
}

// ====== 渲染签谱 ======
function renderCategories() {
  var html = '';
  for (var i = 0; i < CATEGORIES.length; i++) {
    var c = CATEGORIES[i];
    html += '<div class="cat-card" data-idx="' + i + '">' +
      '<span class="cat-icon">' + c.icon + '</span>' +
      '<span class="cat-info"><div class="cat-name">' + c.name + '</div><div class="cat-desc">' + c.desc + '</div></span>' +
      '<span class="cat-count">' + c.count + '签</span>' +
    '</div>';
  }
  document.getElementById('categoryList').innerHTML = html;

  document.querySelectorAll('.cat-card').forEach(function(card) {
    card.addEventListener('click', function() {
      currentCategory = CATEGORIES[parseInt(this.dataset.idx)];
      document.getElementById('chosenCat').textContent = '📜 ' + currentCategory.name + ' · ' + currentCategory.count + '签';
      goStage('stageInput');
    });
  });
}

// ====== 阶段切换 ======
var currentCategory = CATEGORIES[0];
var currentLot = null;

function goStage(id) {
  document.querySelectorAll('.stage').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');

  if (id === 'stageMeditation') {
    var name = '信士';
    document.getElementById('prayerText').textContent =
      '伏以：\n今有信士' + name + '，虔心叩拜' + currentCategory.name + '圣前。\n' +
      '所求之事，诚心祷告，望神明指示。\n' +
      '若有得罪，诚心忏悔；若有福德，愿与众生共沾。\n' +
      '愿神明慈悲，明示吉凶，弟子依教奉行。\n\n叩首再拜';
  }
  if (id === 'stageShake') {
    document.getElementById('stickPopped').classList.remove('show');
  }
}

// ====== 祷告文复制 ======
function copyPrayer() {
  var t = document.getElementById('prayerText').textContent;
  if (navigator.clipboard) { navigator.clipboard.writeText(t).then(function(){showToast('已复制')}); }
  else { showToast('长按文本手动复制'); }
}

// ====== 摇签交互 ======
var pressTimer = null, isShaking = false, isRevealing = false;
var drawHistory = []; // [{category, time, lotId, level}]
var tubeEl = document.getElementById('tubeEl');
var shakeAudio = new Audio('assets/sounds/freesound_community-spray-can-shake-92396.mp3');
shakeAudio.loop = true;
shakeAudio.volume = 0.4;
var dropAudio = new Audio('assets/sounds/freesound_community-falling-bamboo-83469.mp3');
dropAudio.volume = 0.5;
function cleanDrawHistory() {
  var cutoff = Date.now() - 300000;
  drawHistory = drawHistory.filter(function(d) { return d.time > cutoff; });
}

function onPressStart(e) {
  if (isShaking || pressTimer) return;
  e.preventDefault();
  pressTimer = setTimeout(function() {
    isShaking = true;
    tubeEl.style.animation = 'tube-shake .1s infinite';
    tubeEl.classList.add('shaking');
    document.getElementById('shakeBtn').classList.add('shaking');
    document.getElementById('shakeBtn').textContent = '🤚 摇动中...';
    document.getElementById('stickPopped').classList.remove('show');
    shakeAudio.currentTime = 0;
    shakeAudio.play().catch(function(){});
  }, 400);
}
function onPressEnd(e) {
  e.preventDefault();
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  if (!isShaking) return;
  isShaking = false;
  tubeEl.style.animation = '';
  tubeEl.classList.remove('shaking');
  document.getElementById('shakeBtn').classList.remove('shaking');
  document.getElementById('shakeBtn').textContent = '🖐 长按摇签';
  shakeAudio.pause();
  shakeAudio.currentTime = 0;
  dropAudio.currentTime = 0;
  dropAudio.play().catch(function(){});
  setTimeout(function() { dropAudio.pause(); }, 1200);
  revealLot();
}
function revealLot() {
  if (isRevealing) return;
  isRevealing = true;
  var lots = LOT_DATA[currentCategory.name] || LOT_DATA['观音灵签'];
  var idx = Math.floor(Math.random() * lots.length);
  currentLot = lots[idx];
  document.getElementById('stickNum').textContent = currentLot.id;
  document.getElementById('stickPopped').classList.add('show');
  setTimeout(function() {
    goStage('stageResult');
    document.getElementById('lotNum').textContent = '第' + currentLot.id + '签';
    document.getElementById('lotLevel').textContent = currentLot.level + '签';
    document.getElementById('lotLevel').style.color = currentLot.level.indexOf('上上')===0?'#fdcb6e':currentLot.level.indexOf('下')===0?'#e17055':'#d4a030';
    document.getElementById('lotPoem').textContent = currentLot.poem;
    document.getElementById('lotElement').innerHTML = getElIcon(currentLot.element) + ' ' + currentLot.element + ' · 宜' + currentLot.direction + '方';
    document.getElementById('lotMeaning').textContent = currentLot.meaning;
    // 命理匹配分析
    var birthEl = getBirthElement(document.getElementById('inputBirth').value);
    var matterEl = getMatterElement(document.getElementById('inputMatter').value);
    var signEl = currentLot.element;
    var userEl = matterEl || birthEl;
    var match = analyzeMatch(userEl, signEl, !!matterEl, currentLot.level);
    var matchBox = document.getElementById('matchBox');
    if (match) {
      matchBox.style.cssText = getVibeStyle(match.vibe);
      matchBox.style.display = 'block';
      var badge = document.getElementById('matchBadge');
      badge.textContent = match.relation;
      badge.style.cssText = 'padding:2px 10px;border-radius:8px;font-size:10px;font-weight:600;border:1px solid;' + getVibeStyle(match.vibe);
      var ctx = matterEl ? '所求之事：' + matterEl : '你的日主：' + birthEl;
      document.getElementById('matchSign').innerHTML = '<span class="match-section-label">📜 签意</span>' + match.signTheme;
      document.getElementById('matchInteraction').innerHTML = '<span class="match-section-label">🔗 互动</span>' + ctx + ' · 签属' + signEl + ' · ' + match.relation + '。' + match.interaction;
      document.getElementById('matchAdvice').innerHTML = '<span class="match-section-label">💡 建议</span>' + match.advice;
      var srcNote = birthEl ? '日主由出生日期推算日柱天干得出，反映先天倾向' : '';
      if (birthEl && matterEl) srcNote += '；当前以所求之事五行优先匹配';
      document.getElementById('matchSource').textContent = srcNote;
    } else {
      matchBox.style.display = 'none';
    }
    // 连续求签叙事
    var now = Date.now();
    cleanDrawHistory();
    drawHistory.push({ category: currentCategory.name, time: now, lotId: currentLot.id, level: currentLot.level });
    var sameCategory = drawHistory.filter(function(d) {
      return d.category === currentCategory.name && (now - d.time) < 300000;
    });
    var hint = document.getElementById('multiDrawHint');
    if (sameCategory.length >= 2) {
      var seq = sameCategory.map(function(d) { return d.level; }).join(' → ');
      var first = sameCategory[0].level, last = sameCategory[sameCategory.length-1].level;
      var hasUp = sameCategory.some(function(d) { return d.level.indexOf('上')===0; });
      var hasDown = sameCategory.some(function(d) { return d.level.indexOf('下下')===0 || d.level.indexOf('下平')===0; });
      var story;
      if (first === last && sameCategory.length === 2) {
        story = '两签一致——此刻这件事的能量确实是' + last + '的格局。';
      } else if (hasUp && hasDown) {
        story = '波动本身恰是证明：签映当下，不定终局。不同时刻的你，状态本来就不一样。';
      } else if (hasUp && last.indexOf('上')===0) {
        story = '趋势向上——在对的时刻，你能触达很好的状态。';
      } else if (sameCategory.length >= 3 && sameCategory[0].level === sameCategory[1].level && sameCategory[1].level !== last) {
        story = '常态是' + first + '，但在某个时刻出现了' + last + '——这不是不准，这恰是签的本质：映照此刻，不测终局。';
      } else {
        story = '签在变，因为你在变。不同时刻问同一件事，本就是不同的你。';
      }
      hint.style.display = 'block';
      hint.innerHTML = '你对此事求了' + sameCategory.length + '签：<b>' + seq + '</b>。' + story + ' ——签是「占」，不是「命」。';
    } else {
      hint.style.display = 'none';
    }
    isRevealing = false;
  }, 400);
}
function getElIcon(el){var m={'金':'🪙','木':'🌿','水':'💧','火':'🔥','土':'⛰️'};return m[el]||'';}

var btn = document.getElementById('shakeBtn');
btn.addEventListener('touchstart', onPressStart, {passive:false});
btn.addEventListener('touchend', onPressEnd, {passive:false});
btn.addEventListener('touchcancel', onPressEnd, {passive:false});
btn.addEventListener('mousedown', onPressStart);
btn.addEventListener('mouseup', onPressEnd);
btn.addEventListener('mouseleave', onPressEnd);
btn.addEventListener('touchmove', function(e){e.preventDefault();},{passive:false});

// ====== Toast ======
var toastTimer;
function showToast(m) {
  var t = document.getElementById('toast');
  clearTimeout(toastTimer); t.classList.remove('show');
  t.textContent = m; void t.offsetWidth; t.classList.add('show');
  toastTimer = setTimeout(function(){t.classList.remove('show');},1500);
}

renderCategories();
</script>
