<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>求签</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(180deg,#1a0a00,#2d1810,#1a0a00);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
.back-link{position:absolute;top:20px;left:16px;color:rgba(255,255,255,.25);font-size:12px;text-decoration:none;z-index:10}
.back-link:active{color:#e17055}
.container{max-width:420px;margin:0 auto;padding:50px 20px 30px;position:relative;z-index:1;min-height:100vh}
.title{text-align:center;font-size:22px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:8px;font-family:serif;margin-bottom:32px}
.subtitle{text-align:center;font-size:11px;color:rgba(255,255,255,.2);margin-bottom:36px;letter-spacing:4px}

/* 页面阶段 */
.stage{display:none}
.stage.active{display:block}

/* ====== 阶段1: 选签谱 ====== */
.category-list{display:flex;flex-direction:column;gap:8px}
.cat-card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .15s}
.cat-card:active{background:rgba(200,160,60,.1);border-color:rgba(220,180,60,.2)}
.cat-icon{font-size:28px;flex-shrink:0}
.cat-info{flex:1}
.cat-name{font-size:14px;font-weight:600;color:rgba(255,255,255,.7)}
.cat-desc{font-size:11px;color:rgba(255,255,255,.3);margin-top:2px}
.cat-count{font-size:10px;color:rgba(255,255,255,.15);flex-shrink:0}

/* ====== 阶段2: 输入信息 ====== */
.form-group{margin-bottom:14px}
.form-label{font-size:11px;color:rgba(255,255,255,.35);margin-bottom:4px;display:block}
.form-input{width:100%;padding:10px 12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:rgba(255,255,255,.65);font-size:13px;font-family:inherit}
.form-input:focus{outline:none;border-color:rgba(220,180,60,.25)}
.form-hint{font-size:9px;color:rgba(255,255,255,.12);margin-top:3px;line-height:1.4}
.chosen-cat{text-align:center;color:rgba(255,255,255,.3);font-size:12px;margin-bottom:16px}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:16px}
.btn{padding:11px 28px;border-radius:24px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
.btn-back{background:rgba(255,255,255,.06);color:rgba(255,255,255,.35)}
.btn-go{background:linear-gradient(135deg,rgba(200,160,60,.2),rgba(200,160,60,.06));border:1.5px solid rgba(220,180,60,.2);color:#d4a030}

/* ====== 阶段3: 静心默念 ====== */
.meditation-area{text-align:center;padding:20px 0}
.meditation-icon{font-size:64px;margin-bottom:12px}
.meditation-title{font-size:16px;color:rgba(255,255,255,.65);font-weight:600;margin-bottom:8px}
.meditation-hint{text-align:center;font-size:10px;color:rgba(255,255,255,.15);margin-top:2px;letter-spacing:4px;font-family:serif}
.prayer-text{background:rgba(255,255,255,.04);border-radius:12px;padding:16px;color:rgba(255,255,255,.35);font-size:12px;line-height:1.8;text-align:left;margin:16px 0;font-family:serif;letter-spacing:1px}
.copy-prayer{font-size:10px;color:rgba(255,255,255,.18);cursor:pointer;margin-top:4px;display:inline-block}

/* ====== 阶段4: 摇签 ====== */
.tube-wrapper{position:relative;margin:28px auto 0;width:120px}
.tube{width:120px;height:230px;position:relative}
.tube-body{width:100%;height:100%;background:url('assets/images/4.png') center/cover no-repeat;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.45);overflow:hidden;position:relative}
.tube-body::after{content:'';position:absolute;inset:-10px;background:radial-gradient(ellipse at center,transparent 40%,rgba(26,10,0,.7) 85%,#1a0a00 100%);pointer-events:none;z-index:1}
.tube.shaking{filter:drop-shadow(0 0 16px rgba(253,203,110,.3))}
.stick-popped{position:absolute;top:-65px;left:50%;margin-left:-4px;width:8px;height:80px;background:linear-gradient(90deg,#f5e6ca,#fff,#f0e6d0);border-radius:3px 3px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.3);z-index:4;display:none}
.stick-popped.show{display:block;animation:stick-out .35s ease-out;box-shadow:0 -6px 20px rgba(0,0,0,.3),0 0 24px rgba(253,203,110,.5),0 0 48px rgba(253,203,110,.2)}
.stick-popped .num{position:absolute;top:16px;left:0;right:0;text-align:center;font-size:7px;color:#8B6914;writing-mode:vertical-rl;font-family:serif}
@keyframes tube-shake{0%{transform:translate(0,0) rotate(0deg)}12%{transform:translate(-1px,1px) rotate(-3deg)}25%{transform:translate(1px,-1px) rotate(4deg)}37%{transform:translate(-1px,0) rotate(-5deg)}50%{transform:translate(0,1px) rotate(3deg)}62%{transform:translate(1px,0) rotate(-4deg)}75%{transform:translate(-1px,-1px) rotate(5deg)}87%{transform:translate(0,0) rotate(-2deg)}100%{transform:translate(0,0) rotate(0deg)}}
@keyframes stick-out{0%{transform:translateY(0);opacity:0}100%{transform:translateY(-65px);opacity:1}}
@keyframes result-reveal{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
.stage#stageResult.active .result-zone{animation:result-reveal .5s ease-out}

.shake-btn{display:inline-block;background:linear-gradient(135deg,rgba(180,130,50,.1),rgba(180,130,50,.03));border:1.5px solid rgba(200,160,60,.18);color:#d4a030;padding:12px 44px;border-radius:26px;font-size:14px;font-weight:600;letter-spacing:4px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.shake-btn:active{background:rgba(200,160,60,.15)}
.shake-btn.shaking{background:rgba(200,160,60,.2);border-color:rgba(220,180,60,.4)}
.hint{color:rgba(255,255,255,.13);font-size:10px;margin-top:6px}

/* ====== 阶段5: 结果 ====== */
.result-zone{width:100%;max-width:320px;margin:0 auto}
.lot-card{background:linear-gradient(135deg,rgba(253,203,110,.06),rgba(200,160,60,.03));border:1px solid rgba(220,180,60,.12);border-radius:12px;padding:16px;margin-bottom:10px}
.lot-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lot-num{color:#d4a030;font-size:15px;font-weight:700;font-family:serif}
.lot-level{background:rgba(220,180,60,.15);color:#d4a030;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600}
.lot-poem{color:rgba(255,255,255,.55);font-size:14px;line-height:2.2;text-align:center;font-family:serif;letter-spacing:3px;white-space:pre-line}
.lot-element{margin-top:10px;color:rgba(255,255,255,.3);font-size:11px}
.lot-meaning{background:rgba(255,255,255,.02);border-radius:10px;padding:12px;color:rgba(255,255,255,.35);font-size:12px;line-height:1.8}
.meaning-label{color:rgba(255,255,255,.18);font-size:10px;margin-bottom:4px}
.retry-btn{display:inline-block;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.25);padding:8px 28px;border-radius:24px;font-size:12px;cursor:pointer;margin:8px 4px}
.retry-btn:active{background:rgba(255,255,255,.08)}

.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 20px;border-radius:20px;font-size:12px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.match-box{margin-top:10px;border-radius:10px;padding:12px;border:1px solid rgba(220,180,60,.12);line-height:1.7}
.match-header{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:8px;color:rgba(255,255,255,.3)}
.match-badge{padding:2px 10px;border-radius:8px;font-size:10px;font-weight:600;border:1px solid}
.match-sign-section,.match-interaction-section,.match-advice-section{font-size:11px;margin-bottom:8px;line-height:1.7}
.match-sign-section{color:rgba(255,255,255,.45)}
.match-interaction-section{color:rgba(255,255,255,.35)}
.match-advice-section{color:#d4a030}
.match-section-label{font-size:10px;color:rgba(255,255,255,.18);margin-right:4px}
.match-source{font-size:9px;color:rgba(255,255,255,.12);margin-top:6px;line-height:1.5}
.multi-draw-hint{text-align:center;font-size:11px;color:rgba(255,255,255,.3);margin-top:10px;line-height:1.7;font-family:serif;letter-spacing:2px}
</style>
</head>
<body>
<div class="container">
  <a href="../index.html" class="back-link">← 工具站</a>
  <div class="title">求 签</div>

  <!-- ====== 阶段1: 选签谱 ====== -->
  <div class="stage active" id="stageCategory">
    <div class="subtitle">请选择签谱</div>
    <div class="category-list" id="categoryList"></div>
  </div>

  <!-- ====== 阶段2: 输入信息 ====== -->
  <div class="stage" id="stageInput">
    <div class="subtitle">一事一问 · 心诚则灵</div>
    <div class="chosen-cat" id="chosenCat"></div>
    <div class="form-group">
      <label class="form-label">出生年月日</label>
      <input class="form-input" id="inputBirth" placeholder="例如：1995年3月8日">
      <div class="form-hint">填写完整年月日，可推算日柱天干，解读更准确</div>
    </div>
    <div class="form-group">
      <label class="form-label">所求之事（可选）</label>
      <input class="form-input" id="inputMatter" placeholder="例如：事业前程 / 姻缘 / 财运 / 跳槽 / 考研">
      <div class="form-hint">用于匹配五行属性，辅助签文解读</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-back" onclick="goStage('stageCategory')">← 重选签谱</button>
      <button class="btn btn-go" onclick="goStage('stageMeditation')">静心求签 →</button>
    </div>
  </div>

  <!-- ====== 阶段3: 静心默念 ====== -->
  <div class="stage" id="stageMeditation">
    <div class="meditation-area">
      <div class="meditation-icon">🙏</div>
      <div class="meditation-title">静心默念</div>
      <div class="subtitle">心诚则灵 · 一事一问</div>
      <div class="meditation-hint">签不测命，只映此刻</div>
      <div class="prayer-text" id="prayerText"></div>
      <span class="copy-prayer" onclick="copyPrayer()">📋 复制祷告文</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-go" onclick="goStage('stageShake')">🙏 已默念，开始摇签</button>
    </div>
  </div>

  <!-- ====== 阶段4: 摇签 ====== -->
  <div class="stage" id="stageShake">
    <div class="subtitle" style="text-align:center;">长按签筒摇动 · 松手即出签</div>
    <div class="tube-wrapper" id="tubeWrapper">
      <div class="tube" id="tubeEl">
        <div class="tube-body"></div>
        <div class="stick-popped" id="stickPopped"><div class="num" id="stickNum"></div></div>
      </div>
    </div>
    <div style="text-align:center;margin-top:32px;">
      <div class="shake-btn" id="shakeBtn">🖐 长按摇签</div>
      <div class="hint">按住摇动 · 松手出签</div>
    </div>
  </div>

  <!-- ====== 阶段5: 结果 ====== -->
  <div class="stage" id="stageResult">
    <div class="subtitle" style="text-align:center;">签已出</div>
    <div class="result-zone">
      <div class="lot-card">
        <div class="lot-header">
          <span class="lot-num" id="lotNum"></span>
          <span class="lot-level" id="lotLevel"></span>
        </div>
        <div class="lot-poem" id="lotPoem"></div>
        <div class="lot-element" id="lotElement"></div>
      </div>
      <div class="lot-meaning">
        <div class="meaning-label">📖 解签</div>
        <div id="lotMeaning"></div>
      </div>
      <div class="match-box" id="matchBox" style="display:none;">
        <div class="match-header">
          <span>🔮 五行参考</span>
          <span class="match-badge" id="matchBadge"></span>
        </div>
        <div class="match-sign-section" id="matchSign"></div>
        <div class="match-interaction-section" id="matchInteraction"></div>
        <div class="match-advice-section" id="matchAdvice"></div>
        <div class="match-source" id="matchSource"></div>
      </div>
      <div class="multi-draw-hint" id="multiDrawHint" style="display:none;"></div>
      <div style="text-align:center;margin-top:10px;">
        <button class="retry-btn" onclick="goStage('stageShake')">🔄 再求一签</button>
        <button class="retry-btn" onclick="goStage('stageCategory')">🎋 换签谱</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
// ====== 9类签谱 ======
var CATEGORIES = [
  {name:'观音灵签',desc:'最通用灵签，适用事业/婚姻/财运等所有事',count:100,icon:'🪷',type:'buddhist'},
  {name:'关帝灵签',desc:'道教忠义，偏事业/官非/义气，典故多三国',count:100,icon:'⚔️',type:'taoist'},
  {name:'黄大仙灵签',desc:'香港华南流行，偏养生/财运/健康',count:100,icon:'🐉',type:'taoist'},
  {name:'妈祖灵签',desc:'东南沿海，偏出海/平安/家宅',count:60,icon:'🌊',type:'taoist'},
  {name:'月老灵签',desc:'专管姻缘，只问感情/婚姻/缘分',count:60,icon:'💕',type:'taoist'},
  {name:'财神灵签',desc:'偏财运/生意/投资/事业',count:99,icon:'💰',type:'taoist'},
  {name:'吕祖灵签',desc:'偏修行/健康/避灾/养生',count:100,icon:'🏔️',type:'taoist'},
  {name:'土地公灵签',desc:'地方小事，家宅/平安/琐碎事',count:32,icon:'🏠',type:'taoist'},
  {name:'六十甲子签',desc:'最古老通用签，偏流年/命运/大事',count:60,icon:'☯️',type:'taoist'}
];

// ====== 9类签文数据（各自独立） ======
// 根据六十甲子干支+五行旺衰+季节方位系统生成

var LOT_DATA = {
  '观音灵签': [
    {id:1,level:'上上',element:'木',direction:'东',poem:'天开地辟结良缘\n日吉时良万事全\n若得此签非小可\n人行中正帝王宣',meaning:'万事开端大吉，正心行事，贵人提拔，大事可成。'},
    {id:2,level:'上',element:'木',direction:'东',poem:'鲸鱼未化守江湖\n未许升腾离碧波\n异日峥嵘身变态\n从教一跃禹门过',meaning:'目前蛰伏，忍耐守时，他日时机一到，一跃成名。'},
    {id:3,level:'上平',element:'火',direction:'南',poem:'落落怀中事未休\n恰如江上遇扁舟\n若得贵人相借力\n管教名利两悠悠',meaning:'事有阻滞，须借外力，得贵人相助则平稳顺利。'},
    {id:4,level:'中',element:'火',direction:'南',poem:'千年古镜复重圆\n女再求夫男再婚\n自此门庭重改换\n更添福禄在儿孙',meaning:'破镜重圆、失而复得，旧局重整，家运渐兴。'},
    {id:5,level:'上上',element:'土',direction:'中',poem:'云开雾散日重明\n雨过山河万象新\n若得此签安稳处\n更无灾祸与侵凌',meaning:'阴霾尽去，否极泰来，前程光明，百事吉昌。'},
    {id:6,level:'中',element:'土',direction:'东',poem:'功名得意喜非常\n出仕为官遇贵人\n万里前程如走马\n春风得意好荣身',meaning:'有机会进取，但过程奔波，稳扎稳打可得成就。'},
    {id:7,level:'上',element:'金',direction:'东',poem:'二人相和万事昌\n同心协力利非常\n若能守得谦和志\n自然福禄寿绵长',meaning:'合作和合、和气生财，谦和待人，诸事顺遂。'},
    {id:8,level:'中',element:'金',direction:'南',poem:'未遇时人守旧贫\n一朝得志便超群\n时来运转机缘至\n名利双收喜煞人',meaning:'先难后易，时运一到，青云直上，名利可期。'},
    {id:9,level:'下',element:'水',direction:'南',poem:'世事如棋反复看\n荣华富贵梦中观\n若能悟得其中意\n退步抽身保平安',meaning:'虚多实少，变化无常，不宜贪求，守旧安分方稳。'},
    {id:10,level:'中',element:'水',direction:'中',poem:'石藏无价玉和珍\n只管他乡外客寻\n宛如持灯更觅火\n不如收拾枉劳心',meaning:'舍近求远、外求无益，自身本有资源，不必奔波。'},
    {id:11,level:'上',element:'木',direction:'东',poem:'时来运转遇良辰\n万里鹏程任君行\n一路贵人相扶助\n功成名就福临门',meaning:'时机成熟，大展宏图，贵人一路相助，百事称心。'},
    {id:12,level:'中',element:'木',direction:'东',poem:'镜里观花事不成\n水中捞月枉劳心\n不如守旧安天命\n免得奔波惹祸侵',meaning:'空想无益、虚耗精神，务实守旧，等待实际机缘。'},

    {id:15,level:'下下',element:'土',direction:'中',poem:'历尽风霜苦未休\n奔波劳碌事多愁\n一朝失势无人顾\n恰似残花落水流',meaning:'劳心劳力、徒劳无功，运势低迷，防小人与破财。'},
    {id:16,level:'上',element:'土',direction:'东',poem:'万里江山万里程\n前程远大好经营\n时来风送滕王阁\n一举成名天下闻',meaning:'根基稳固、前程远大，把握时机，功名可期。'},
    {id:17,level:'中',element:'金',direction:'东',poem:'云藏皓月正朦胧\n鼠牙雀角事无穷\n若得贵人提挈处\n管教喜气自相逢',meaning:'小有是非，贵人出现可解困，把握分寸则吉。'},
    {id:18,level:'下',element:'金',direction:'南',poem:'谋事在人成事天\n百般计较枉徒然\n时来风送无难事\n运去黄金也失缘',meaning:'时机未至，谋事多阻，宜静待天时，不可强为。'},
    {id:19,level:'上平',element:'水',direction:'南',poem:'一门福禄喜重重\n富贵荣华百事中\n老来更得儿孙孝\n寿比南山不老松',meaning:'家运亨通、福寿双全，家庭和睦，晚景吉祥。'},
    {id:20,level:'中',element:'水',direction:'中',poem:'时运未通且自守\n莫嫌眼下少荣华\n一朝得遇知音者\n名利双收福到家',meaning:'守时待势，遇贵人则发达，目前宜静不宜动。'},
    {id:21,level:'上',element:'木',direction:'东',poem:'姻缘天定不须疑\n匹配相逢正及时\n和合双双成佳偶\n百年偕老永无离',meaning:'婚姻大吉、天作之合，感情和顺，白头偕老。'},
    {id:22,level:'中',element:'木',direction:'东',poem:'寂寞寒宫独自居\n清灯冷帐影形孤\n荣华富贵如浮云\n到头一梦一场虚',meaning:'孤独、虚浮，情感或事业易空幻，宜务实防落空。'},
    {id:23,level:'上平',element:'火',direction:'南',poem:'欲扳仙桂入蟾宫\n岂虑天门不任通\n忽遇一朝时运至\n荣华富贵喜相逢',meaning:'有志可成，机缘一到，名利自来，平稳上升。'},
    {id:24,level:'中',element:'火',direction:'南',poem:'历尽艰难险阻多\n一朝得脱出罗网\n时来运转灾星退\n从此安宁福禄和',meaning:'先险后安，度过难关即转吉，守得住则终得福。'},
    {id:25,level:'上上',element:'土',direction:'中',poem:'福厚人安事事昌\n前程似锦耀荣光\n若得此签常吉利\n财源滚滚达三江',meaning:'大福大贵、吉祥如意，万事亨通，财运极佳。'},
    {id:26,level:'下下',element:'土',direction:'东',poem:'眼下受人欺与辱\n时乖运蹇事难谋\n一朝时来凌云志\n方显男儿大丈夫',meaning:'目前屈辱、困顿，但有转机，需忍耐等待时来。'},
    {id:27,level:'中',element:'金',direction:'东',poem:'直言进谏事多艰\n进退两难意未安\n若能谨慎知进退\n方可平安免祸端',meaning:'进退两难、压力大，谨慎低调，不可强出头。'},
    {id:28,level:'上',element:'金',direction:'南',poem:'乘风破浪正当时\n万里功名可自持\n智勇双全施谋略\n功成名就乐滋滋',meaning:'时机正好、能力足够，主动进取，功名可得。'},
    {id:29,level:'下',element:'水',direction:'南',poem:'奔波劳碌救危亡\n费力劳心事未昌\n虽有贵人来相助\n终是虚忙少主张',meaning:'多劳少获、事多波折，虽有贵人，仍难圆满。'},
    {id:30,level:'中',element:'水',direction:'中',poem:'千里姻缘一线牵\n有缘千里得相逢\n好事多磨终有果\n花开月圆福自浓',meaning:'姻缘或事情虽有波折，但终能成功，缘分可期。'},
    {id:31,level:'上上',element:'木',direction:'东',poem:'知心相遇两无猜\n意气相投好往来\n凡事调和多顺利\n福星高照乐开怀',meaning:'人缘佳、遇知己，合作顺利，百事称心如意。'},
    {id:32,level:'下下',element:'木',direction:'东',poem:'受尽辛劳与苦愁\n只为孝心不自由\n虽有贵人来相助\n终是艰难少自由',meaning:'辛苦、束缚多，付出多回报少，宜守旧防破财。'},
    {id:33,level:'上平',element:'火',direction:'南',poem:'高山流水遇知音\n意气相投情谊深\n凡事相逢多顺利\n同心协力利千金',meaning:'得贵人知己，合作默契，事业平稳发展。'},
    {id:34,level:'中',element:'火',direction:'南',poem:'时运不济受欺凌\n百般算计事难成\n一朝得遇高明者\n方脱灾危得安宁',meaning:'目前有灾、有小人，得贵人解救方转安。'},
    {id:35,level:'下',element:'土',direction:'中',poem:'千山万水苦奔波\n历尽艰辛始得果\n若问前程成与败\n坚持到底免消磨',meaning:'过程极苦、消耗大，坚持方有结果，急不得。'},
    {id:36,level:'上',element:'土',direction:'东',poem:'才高志大遇明时\n大展宏图正可期\n虽有小灾不足虑\n终成大业显威仪',meaning:'有才、有机会，小灾无碍，终能成就大事。'},
    {id:37,level:'中',element:'金',direction:'东',poem:'勤劳本分自安然\n苦尽甘来福禄全\n凡事用心多努力\n自然吉庆喜连连',meaning:'踏实肯干、先苦后甜，勤俭致富，家道安宁。'},
    {id:38,level:'下',element:'金',direction:'南',poem:'离乡背井事多愁\n万里风霜苦未休\n虽有荣华难称意\n心中忧闷几时休',meaning:'奔波、离乡、心情压抑，外在尚可，内心多烦。'},
    {id:39,level:'上',element:'水',direction:'南',poem:'少年得志气轩昂\n智勇双全胆气强\n一举成名天下知\n荣华富贵福绵长',meaning:'年轻有为、锐气足，事业进展顺利，名利双收。'},
    {id:40,level:'中',element:'水',direction:'中',poem:'风和日丽正春光\n百事谋为皆吉昌\n若得此签安稳处\n财源福禄自安康',meaning:'环境平顺、心情舒畅，凡事平稳，小吉小利。'},
    {id:41,level:'中',element:'木',direction:'东',poem:'固执己见事难成\n死守虚名误自身\n若能变通知进退\n方免灾危得安宁',meaning:'固执、死板易坏事，要灵活变通，防感情 / 承诺纠纷。'},
    {id:42,level:'上平',element:'木',direction:'东',poem:'孝心感动天与地\n历尽艰难事可期\n苦尽甘来终有报\n福泽绵延后代宜',meaning:'孝善得报，虽辛苦但终有好结果，家运平稳。'},
    {id:43,level:'中',element:'火',direction:'南',poem:'一路风霜一路劳\n心坚志毅始得朝\n若问功名成与败\n坚持到底自逍遥',meaning:'过程辛苦、考验多，坚持信念，终能成功。'},
    {id:44,level:'上上',element:'火',direction:'南',poem:'良驹得遇伯乐知\n青云直上正其时\n贵人提拔机缘至\n功成名就福相随',meaning:'遇大贵人、被重用，事业突飞猛进，大吉大利。'},
    {id:45,level:'下下',element:'土',direction:'中',poem:'眼前得意少思量\n祸起萧墙暗自伤\n若不谨慎防小人\n恐遭灾殃悔难当',meaning:'表面风光、暗藏危机，防小人、防口舌、防破财。'},
    {id:46,level:'中',element:'土',direction:'东',poem:'智勇双全谋略深\n运筹帷幄定乾坤\n时来运转功名就\n富贵荣华福满门',meaning:'有能力、有谋略，但需时机，时机到则成功。'},
    {id:47,level:'上',element:'金',direction:'东',poem:'苦读多年志气高\n一朝得志占鳌头\n功名成就人人羡\n福禄荣华乐悠悠',meaning:'苦尽甘来、金榜题名，事业有成，前程似锦。'},
    {id:48,level:'下',element:'金',direction:'南',poem:'功成身退远风波\n名利场中莫执着\n若得抽身归去好\n免招灾祸与消磨',meaning:'宜见好就收、退一步海阔天空，贪则招灾。'},
    {id:49,level:'上平',element:'水',direction:'南',poem:'男儿立志出乡关\n学不成名誓不还\n一朝得志青云上\n富贵荣华福自宽',meaning:'有志气、肯奋斗，终能成功，事业平稳上升。'},
    {id:50,level:'上上',element:'水',direction:'中',poem:'五湖四海任君行\n高挂帆篷自在撑\n若得顺风随即至\n满船宝贝喜层层',meaning:'一路顺风、无往不利，财运亨通，所求皆遂。'},
    {id:51,level:'中',element:'木',direction:'东',poem:'口舌奔波事未宁\n是非得失两难平\n若能闭口深藏舌\n方可安然免祸侵',meaning:'多口舌、多奔波，少说多做，防言多必失。'},
    {id:52,level:'下下',element:'木',direction:'东',poem:'奸人陷害事难防\n灾厄临身祸未央\n若不早图趋吉避\n恐遭横祸悔难当',meaning:'防小人陷害、官非、破财，运势极差，宜静守。'},
    {id:53,level:'上',element:'火',direction:'南',poem:'诚心感动圣贤人\n得遇高贤万事兴\n谋事在人成在天\n贵人相助福临门',meaning:'诚心可得贵人，事业得助力，万事顺利。'},
    {id:54,level:'中',element:'火',direction:'南',poem:'千里相送情谊真\n患难相随不离分\n好事多磨终有果\n恩情义重福自深',meaning:'重情重义、患难见真情，事情虽波折终成。'},
    {id:55,level:'下',element:'土',direction:'中',poem:'看破浮生万事空\n荣华富贵转头风\n若能悟得虚无理\n自在逍遥乐不穷',meaning:'看淡得失、放下执着，不宜强求，随缘则安。'},
    {id:56,level:'上平',element:'土',direction:'东',poem:'英雄末路事难量\n成败兴衰自有常\n若能忍辱存身命\n卷土重来未可量',meaning:'虽有挫折，但根基尚在，忍辱负重可东山再起。'},
    {id:57,level:'中',element:'金',direction:'东',poem:'一苇渡江胆气豪\n孤身远渡不辞劳\n凡事坚持心不退\n终成正果福滔滔',meaning:'孤独奋斗、辛苦，但信念坚定可成，平稳小吉。'},
    {id:58,level:'中',element:'金',direction:'南',poem:'奸邪当道事难成\n国运衰微祸乱生\n若不除奸安社稷\n黎民涂炭苦无穷',meaning:'小人当道、是非多，环境不利，宜自保、防纠纷。'},
    {id:59,level:'上',element:'水',direction:'南',poem:'智勇双全胆气雄\n孤身退敌显威风\n贵人相助灾星退\n国泰民安福自隆',meaning:'临危不乱、智勇化解危机，贵人相助，转危为安。'},
    {id:60,level:'下下',element:'水',direction:'中',poem:'抱薪救火火增烟\n烧却三千及大千\n若问营谋并出入\n不如收拾莫忧煎',meaning:'方法错误、越忙越乱，事情恶化，宜止损、停手。'},
    {id:61,level:'中',element:'木',direction:'东',poem:'奔波劳碌事多艰\n处处艰难少笑颜\n虽有才华难展志\n时乖运蹇莫强攀',meaning:'有才难伸、奔波多阻，宜守时待运，不可强求。'},
    {id:62,level:'下',element:'木',direction:'东',poem:'安贫守道自悠然\n不慕荣华不羡仙\n若得此签安稳处\n心无挂碍福绵绵',meaning:'平淡守旧、知足常乐，不宜贪求，平安即是福。'},
    {id:63,level:'上',element:'火',direction:'南',poem:'身处贫寒志不穷\n一朝时运转亨通\n困龙得水青云上\n富贵荣华福满胸',meaning:'贫而有志、终得转运，时来运转，名利双收。'},
    {id:64,level:'中',element:'火',direction:'南',poem:'军纪严明志气高\n运筹帷幄显英豪\n时来运转功名就\n福禄荣华乐陶陶',meaning:'严谨自律、有条理，事业稳步推进，终能成功。'},
    {id:65,level:'上上',element:'土',direction:'中',poem:'时和岁稔万事昌\n国泰民安福满堂\n若得此签常吉利\n财源滚滚达三江',meaning:'大吉大利、风调雨顺，家运、事业皆昌盛。'},
    {id:66,level:'下下',element:'土',direction:'东',poem:'奢华过度祸根藏\n纵欲荒淫国运亡\n若不收敛行正道\n灾殃临身悔断肠',meaning:'奢靡、放纵招灾，运势衰败，宜节俭、守正防祸。'},
    {id:67,level:'中',element:'金',direction:'东',poem:'才华出众遇明君\n一展经纶定乾坤\n时来运转功名就\n富贵荣华福满门',meaning:'有才、遇明主，事业可成，但需时机与伯乐。'},
    {id:68,level:'上',element:'金',direction:'南',poem:'宁在直中取不向\n曲中求未得鱼与\n饵静待水东流一\n朝时运至名利两悠悠',meaning:'正直守时、不投机，时机一到，名利自来。'},
    {id:69,level:'下',element:'水',direction:'南',poem:'红颜薄命事堪伤\n富贵荣华梦一场\n若问前程成与败\n空劳心力枉悲伤',meaning:'虚华、易失去，感情或财物有风险，防意外损失。'},
    {id:70,level:'中',element:'水',direction:'中',poem:'梅花开放正其时\n占得先机事可期\n凡事谋为皆顺利\n福星高照福相随',meaning:'时机刚好、预兆吉祥，事情进展顺利，小吉。'},
    {id:71,level:'上上',element:'木',direction:'东',poem:'早年辛苦未成名\n一朝醒悟弃浮名\n专心致志攻书史\n一举成名天下闻',meaning:'改过自新、专注正道，后发制人，大器晚成，大吉。'},
    {id:72,level:'中',element:'木',direction:'东',poem:'容貌出众惹人怜\n虚名虚利事难全\n若不修身求实干\n荣华富贵转头烟',meaning:'外表风光、内在空虚，虚名无益，宜务实防虚耗。'},
    {id:73,level:'上平',element:'火',direction:'南',poem:'昔日贫寒受人欺\n一朝得志万人知\n时来运转机缘至\n莫笑当初贫贱时',meaning:'先贫后富、先辱后荣，守得云开见月明。'},
    {id:74,level:'中',element:'火',direction:'南',poem:'去年今日此门中\n人面桃花相映红\n人面不知何处去\n桃花依旧笑春风',meaning:'怀旧、人事变迁，感情或事情有遗憾，平稳无大凶。'},
    {id:75,level:'下',element:'土',direction:'中',poem:'不慕荣华不羡仙\n渔樵笑傲自悠然\n若能悟得其中意\n自在逍遥乐无边',meaning:'归隐、淡泊名利，不宜争强，清闲安稳为上。'},
    {id:76,level:'上',element:'土',direction:'东',poem:'忠心耿耿气轩昂\n为国捐躯万古扬\n虽死犹生名不朽\n福泽后代永绵长',meaning:'守正道、有气节，虽有险难，终得善果、留名。'},
    {id:77,level:'中',element:'金',direction:'东',poem:'梦中说梦获多财\n身外浮名总莫猜\n水远山遥难信定\n贵人一指笑颜开',meaning:'虚梦多、实利少，需贵人点醒，方得实际收获。'},
    {id:78,level:'上上',element:'金',direction:'南',poem:'冷水来浇白雪洋\n不寒不热自温凉\n要行天下无他事\n惟有中藏一艺强',meaning:'平和稳定、技艺傍身，走遍天下皆安稳，大吉。'},
    {id:79,level:'中',element:'水',direction:'南',poem:'虚空结愿结人缘\n保得人安愿未还\n得兔忘蹄真绝迹\n敢将初誓谩轻瞒',meaning:'许愿要还、初心莫忘，失信则不利，守诺则平安。'},
    {id:80,level:'下下',element:'水',direction:'中',poem:'直上高岩去学仙\n岂知一旦帝王宣\n青天白日常明照\n志在声名四海传',meaning:'好高骛远、不切实际，空想误事，易招挫折。'},
    {id:81,level:'上',element:'木',direction:'东',poem:'白袍小将勇无双\n驰骋疆场显英豪\n一战成功名显赫\n荣华富贵福滔滔',meaning:'年轻有为、能力强，事业一战成名，名利双收。'},
    {id:82,level:'中',element:'木',direction:'东',poem:'荣华富贵转头空\n美色难留运已穷\n若不早悟抽身退\n恐遭横祸泪无穷',meaning:'盛极而衰、美色 / 名利招灾，宜低调、防变故。'},
    {id:83,level:'中',element:'火',direction:'南',poem:'反复思量事未宁\n斟酌损益两难平\n若能决断心无疑\n方可安然免祸侵',meaning:'犹豫多、反复难定，要果断，否则易错失机会。'},
    {id:84,level:'上平',element:'火',direction:'南',poem:'不为五斗米折腰\n归隐田园自逍遥\n虽无富贵与荣华\n心远尘烦福自饶',meaning:'淡泊名利、远离纷争，清闲自在，平安是福。'},
    {id:85,level:'下',element:'土',direction:'中',poem:'机关算尽太聪明\n反误了卿卿性命\n若能守拙安本分\n何至临刑叹不平',meaning:'聪明反被聪明误，算计招灾，宜本分、不耍心机。'},
    {id:86,level:'中',element:'土',direction:'东',poem:'弃文从武志气高\n万里封侯胆气豪\n建功立业扬名姓\n富贵荣华乐陶陶',meaning:'转行 / 改道有成，有魄力、敢闯荡，终能建功。'},
    {id:87,level:'上上',element:'金',direction:'东',poem:'阴德积来福自深\n救人危难胜千金\n善有善报终应验\n富贵荣华福满门',meaning:'积德行善、善有善报，贵人相助，大福大贵。'},
    {id:88,level:'下',element:'金',direction:'南',poem:'昔日才华盖世雄\n今朝才尽梦成空\n若不勤学重振作\n前途暗淡少成功',meaning:'灵感衰退、能力下滑，需重新学习，防停滞。'},
    {id:89,level:'中',element:'水',direction:'南',poem:'自荐才华胆气豪\n脱颖而出显英豪\n时机一到青云上\n名利双收福自高',meaning:'主动争取、自我推荐有机会成功，但需把握分寸。'},
    {id:90,level:'上',element:'水',direction:'中',poem:'仙缘偶遇喜非常\n万事亨通福满堂\n若得此签常吉利\n财源滚滚达三江',meaning:'机缘巧合、遇贵人 / 奇遇，万事顺利，福气临门。'},
    {id:91,level:'下下',element:'木',direction:'东',poem:'功高不遇运偏消\n百战无功恨未消\n时运不济空费力\n功名难遂泪空抛',meaning:'有功无赏、怀才不遇，运势低迷，付出难有回报。'},
    {id:92,level:'中',element:'木',direction:'东',poem:'困于陈蔡事多艰\n饥寒交迫苦难言\n虽有才华难展志\n时乖运蹇莫强攀',meaning:'困顿、受穷、环境差，忍耐守时，等待转机。'},
    {id:93,level:'上',element:'火',direction:'南',poem:'精忠报国气轩昂\n威震敌邦显英豪\n虽有奸人来陷害\n终留青史姓名高',meaning:'忠直有成、名垂青史，虽有小人，终得善果。'},
    {id:94,level:'中',element:'火',direction:'南',poem:'舍身佛寺事虔诚\n国破家亡祸已成\n若不修身兼治国\n空怀善念枉劳情',meaning:'偏信、本末倒置，事业 / 家运受损，宜务实平衡。'},
    {id:95,level:'上平',element:'土',direction:'中',poem:'举贤荐能福绵长\n为国为民显忠良\n贵人相助灾星退\n国泰民安福自昌',meaning:'助人助己、贵人互助，事业平稳，人缘佳。'},
    {id:96,level:'中',element:'土',direction:'东',poem:'福寿双全喜气扬\n儿孙满堂福满堂\n家和万事皆兴旺\n富贵荣华日月长',meaning:'家庭和睦、福寿安康，家运兴隆，小吉大利。'},
    {id:97,level:'下',element:'金',direction:'东',poem:'岁月蹉跎白发侵\n壮志未酬泪满襟\n若不及时图进取\n老来空自悔伤心',meaning:'时不我待、光阴易逝，宜抓紧时机，莫虚度。'},
    {id:98,level:'上上',element:'金',direction:'南',poem:'功成身退远凡尘\n辟谷修真养性灵\n名利场中无挂碍\n逍遥自在乐长生',meaning:'功成身退、修身养性，无灾无难，福寿绵长。'},
    {id:99,level:'中',element:'水',direction:'南',poem:'忠心一片付东流\n报国无门恨未休\n奸佞当道贤良隐\n时乖运蹇莫强求',meaning:'怀才不遇、悲愤难伸，环境不利，宜隐忍待机。'},
    {id:100,level:'下下',element:'水',direction:'中',poem:'佛神灵通与君知\n痴人说事转昏迷\n老人求得灵签去\n不如守旧待时来',meaning:'诸事虚浮、越动越错，宜守旧、不动、等待时机。'},
  ],
  '关帝灵签': [
    {id:1,level:'上上',element:'木',direction:'东',poem:'百万军中独护主\n一身胆气冠三国\n风烟散尽见太平\n功成名就福自多',meaning:'忠勇护身，遇险有救。行事秉持本心忠义，前路阻碍皆可化解，贵人常伴身旁，万事终能圆满。'},
    {id:2,level:'上',element:'木',direction:'东',poem:'功成身退合天心\n云散风清月满林\n名利场中知进退\n安然无祸福常临',meaning:'知足方能安稳，激进易招损耗。凡事懂得取舍退让，守旧本分即可守住福运，强求难得善果。'},
    {id:3,level:'上平',element:'火',direction:'南',poem:'几番跋涉访贤良\n一片诚心动上苍\n莫道眼前无际遇\n时来风送遂祯祥',meaning:'诚心做事自有回报，眼下时机未到切勿急躁。坚持本心静待机缘，贵人自会前来相助。'},
    {id:4,level:'下下',element:'火',direction:'南',poem:'去年百事颇相宜\n若较今年时运衰\n好把瓣香告神佛\n莫教福谢悔无追',meaning:'当下运势走低，诸事皆有阻碍。安稳居家规避风险，随意行动极易招致灾祸损耗。'},
    {id:5,level:'中',element:'土',direction:'中',poem:'子有三般不自由\n门庭萧索冷如秋\n若逢牛鼠交承日\n万事回春不用忧',meaning:'暂时困顿不必消沉，低谷只是短暂阶段。待到时机轮转，境遇便可逐步好转回升。'},
    {id:6,level:'下下',element:'土',direction:'东',poem:'何劳鼓瑟更吹笙\n寸步如登万里程\n彼此怀疑不相信\n休将私意误平生',meaning:'人心隔阂猜忌重重，合作共事难以同心。凡事依靠自身稳妥，轻信他人容易错失机缘。'},
    {id:7,level:'中',element:'金',direction:'东',poem:'一路风霜过五关\n忠心不改照尘寰\n虽然险阻多磨难\n终得团圆喜气还',meaning:'路途磨难重重，坚守忠义初心不改。熬过所有坎坷波折，最终能够如愿相聚收获圆满。'},
    {id:8,level:'中',element:'金',direction:'南',poem:'年来耕稼苦无收\n今岁时来运渐谋\n否极泰来春又至\n功名富贵逐时流',meaning:'前期付出难有回报，运势低谷即将结束。时来运转之后，生活事业都会逐步向好发展。'},
    {id:9,level:'上上',element:'水',direction:'南',poem:'黄袍加身应运兴\n四海讴歌贺太平\n时到自然成事易\n功成名就福满门',meaning:'天时地利齐聚，万事推进顺风顺水。自身气运强盛，谋划之事大多能够如愿达成。'},
    {id:10,level:'下下',element:'水',direction:'中',poem:'病患时时命蹇衰\n何须打瓦共钻龟\n直教重见一阳复\n始可求神仗佛持',meaning:'运势低迷灾祸相伴，病痛困扰难以摆脱。日常行事多加谨慎，静心祈福方可减缓不顺。'},
    {id:11,level:'上',element:'木',direction:'东',poem:'一朝拜将统三军\n壮志凌云四海闻\n昔日贫寒谁识我\n今朝富贵有天恩',meaning:'得贵人赏识举荐，身份境遇焕然一新。往日困顿尽数消散，自此平步青云名利双收。'},
    {id:12,level:'中',element:'木',direction:'东',poem:'走马匆匆荐贤良\n一片忠心为故邦\n眼前虽有分离苦\n后日相逢福满堂',meaning:'人生难免离别变动，旧的机缘散去，新的助力随之而来。看淡离合变迁，后续自有安稳福气。'},
    {id:13,level:'上上',element:'火',direction:'南',poem:'单刀赴会胆气豪\n不惧群奸与众骄\n一片忠心昭日月\n安然无恙福自招',meaning:'胆识气魄过人，面对险境毫不畏惧。心怀忠义坦荡行事，凶险都可化解，安稳守住自身福气。'},
    {id:14,level:'上平',element:'火',direction:'南',poem:'老当益壮气轩昂\n宝刀未老逞刚强\n莫道年高无大用\n临阵建功姓名扬',meaning:'年岁增长不减能力，阅历沉淀皆是优势。大器晚成运势渐旺，晚年依旧能够建功享福。'},
    {id:15,level:'下',element:'土',direction:'中',poem:'英雄气短困牢笼\n有勇无谋事不成\n一朝失势身难保\n空留遗恨叹平生',meaning:'空有魄力缺少谋略，自负任性容易落败。行事切勿冲动武断，沉稳思虑才能规避灾祸。'},
    {id:16,level:'中',element:'土',direction:'东',poem:'满腹经纶济世才\n奈何时运未全开\n落凤坡前遭暗算\n功未成兮祸已来',meaning:'身怀才华容易遭人妒忌，行事低调防备暗中算计。时机未到不可冒进，稳妥行事保全自身成果。'},
    {id:17,level:'上',element:'金',direction:'东',poem:'火烧连营破强敌\n智谋过人定社稷\n以柔克刚成大功\n威名赫赫震华夷',meaning:'依靠智慧谋略取胜，不必硬碰硬争抢。以缓制急后发制人，谋划得当便可成就大事扬名立万。'},
    {id:18,level:'中',element:'金',direction:'南',poem:'自作聪明反误身\n盗书献计枉劳心\n机关算尽成何事\n惹祸招灾悔莫伸',meaning:'小聪明难以成就大事，算计他人终究拖累自己。秉持真诚踏实做事，搬弄是非只会招致祸端。'},
    {id:19,level:'上上',element:'水',direction:'南',poem:'三分天下定乾坤\n德服人心四海尊\n昔日织席贩履客\n今朝九五称至尊',meaning:'品德宽厚聚拢人心，日积月累积攒实力。出身平凡亦可成就大业，名望富贵相伴一生。'},
    {id:20,level:'上平',element:'水',direction:'中',poem:'父子同心忠义全\n危难之际勇向前\n虽然险阻多艰险\n忠孝两全福自绵',meaning:'亲情同心合力抗险，忠孝品行积攒福报。家中团结和睦，即便遭遇困境，也能互相扶持安稳度过。'},
    {id:21,level:'中',element:'木',direction:'东',poem:'粗豪仗义晓人情\n大度容人万事宁\n放下纷争结善缘\n前程坦荡享安宁',meaning:'仗义待人心胸宽广，化解矛盾广结善缘。待人包容不记仇怨，人脉顺遂助力行事发展。'},
    {id:22,level:'中',element:'木',direction:'东',poem:'心存仁念纵枭雄\n一念留情后患生\n处事当分轻重义\n优柔寡断事难成',meaning:'处事心软犹豫不决，留情容易遗留后患。大义面前分清取舍，优柔寡断难以达成目标。'},
    {id:23,level:'上',element:'火',direction:'南',poem:'铁骑冲锋气势雄\n一身勇猛建奇功\n胆识双全行正道\n声名远播运亨通',meaning:'胆识兼备行事果敢，正道进取不惧挑战。凭借自身能力建功立业，名声与运势同步兴盛。'},
    {id:24,level:'中',element:'火',direction:'南',poem:'巧言游说乱初心\n见利忘义祸自临\n坚守本心行正道\n莫因贪欲误终身',meaning:'甜言蜜语容易迷惑心智，贪图利益背弃道义必招灾祸。坚守自身原则底线，不被外物诱惑迷失方向。'},
    {id:25,level:'上上',element:'土',direction:'中',poem:'七擒七纵服人心\n以德怀柔四海钦\n感化顽劣归正道\n千秋安稳福森森',meaning:'德行感化胜过强硬压制，宽厚处事收服人心。待人恩威并施，周边关系和睦，基业长久稳固。'},
    {id:26,level:'下',element:'土',direction:'东',poem:'恃才自负守孤城\n错判形势败局成\n行事虚心听劝谏\n狂妄必定损前程',meaning:'骄傲自负判断失误，一意孤行招致失败。遇事虚心接纳建议，轻视局势只会断送自身前程。'},
    {id:27,level:'中',element:'金',direction:'东',poem:'知恩图报秉真心\n侠义相交情谊深\n善念种下善果报\n贵人相助路途顺',meaning:'心怀感恩重情重义，真诚交友积攒善缘。往日善意终有回馈，前路坎坷自有贵人出手相助。'},
    {id:28,level:'中',element:'金',direction:'南',poem:'巧计离间起祸殃\n骨肉亲信互相伤\n心机算计终反噬\n坦荡安然岁月长',meaning:'心机算计挑起隔阂，亲友彼此反目受损。依靠诡计难长久安稳，坦荡真诚相处才能远离祸端。'},
    {id:29,level:'上平',element:'水',direction:'南',poem:'忠厚诚心缔联盟\n互信相依万事兴\n摒弃私心同协力\n同舟共济享太平',meaning:'诚恳守信缔结同盟，抛开私心携手共进。团结协作互帮互助，原本艰难之事也能平稳做成。'},
    {id:30,level:'下',element:'水',direction:'中',poem:'身怀妙术救苍生\n反遭奸佞祸缠身\n才华出众招人妒\n低调藏锋免灾侵',meaning:'本领过人容易招惹嫉妒，锋芒外露易被小人针对。日常行事低调内敛，收敛锐气便可规避无端灾祸。'},
    {id:31,level:'上上',element:'木',direction:'东',poem:'空城巧计退雄兵\n镇定从容破险情\n临危不乱心智稳\n千难万险自安宁',meaning:'身处险境保持镇定，聪慧谋略化解危机。心态沉稳处事有度，再大的风波都可安然度过。'},
    {id:32,level:'下下',element:'木',direction:'东',poem:'暴虐专横乱朝纲\n贪欲无边自取亡\n作恶多端天难佑\n修身守善避灾殃',meaning:'蛮横贪婪作恶行事，违背道义必会自取祸败。约束自身言行向善修身，方能避开灾祸安稳度日。'},
    {id:33,level:'上',element:'火',direction:'南',poem:'险路潜行觅契机\n胆识谋略两相宜\n另辟蹊径开新路\n功成名就耀门楣',meaning:'打破常规探寻新路，胆识谋略兼备把握契机。不走寻常路径，便能开辟全新局面收获成就。'},
    {id:34,level:'中',element:'火',direction:'南',poem:'半生威武享声名\n危难失节损美名\n坚守初心恒向善\n莫因困境改言行',meaning:'往日功绩难抵一时过错，困境之中最易动摇本心。始终坚守自身道义准则，切勿因境遇改变品行。'},
    {id:35,level:'中',element:'土',direction:'中',poem:'一心相伴守忠义\n风雨同舟不背离\n诚心辅佐成人美\n福报随身永不离',meaning:'秉持忠义忠心相伴，患难之时不离不弃。诚心辅佐他人成事，自身也会积攒福报安稳顺遂。'},
    {id:36,level:'中',element:'土',direction:'东',poem:'年少英姿意气扬\n锋芒太露祸潜藏\n谦和收敛行稳步\n方可平安守久长',meaning:'年少意气风发锋芒过盛，容易暗中埋下灾祸隐患。待人处事谦和收敛，稳步前行才能长久保全自身。'},
    {id:37,level:'上平',element:'金',direction:'东',poem:'寒冬奋力破敌围\n坚守时机显神威\n莫叹眼前境遇冷\n蓄力待时必腾飞',meaning:'处境艰难切勿灰心，默默积蓄力量等候时机。熬过清冷低谷，找准机会发力便可扭转局势。'},
    {id:38,level:'下',element:'金',direction:'南',poem:'沉溺安乐忘本心\n故土家国不再寻\n贪图闲适无远志\n虚度光阴难立身',meaning:'沉迷安逸消磨志向，贪图享乐不思进取。荒废时光虚度岁月，最终难以立足成就自身价值。'},
    {id:39,level:'中',element:'水',direction:'南',poem:'昔日疏庸未可知\n潜心勤学改风姿\n发奋修身增才干\n往后前程自有期',meaning:'基础浅薄不必自卑，静心学习提升自我。发奋修身增长才干，自身能力提升后，前程自然迎来光明机遇。'},
    {id:40,level:'下',element:'水',direction:'中',poem:'自持勇武小看敌\n大意疏忽败局栖\n处事周全多审慎\n莫因轻敌误时机',meaning:'依仗自身优势轻视对手，疏忽大意极易招致失败。凡事周全谨慎考量，轻敌心态只会错失良机酿成损失。'},
    {id:41,level:'上上',element:'木',direction:'东',poem:'大水奔腾破敌军\n神威震慑四方闻\n天时相助功业就\n名扬四海福盈门',meaning:'得天时相助行事顺遂，借助大势施展能力。一战立下赫赫功绩，名声远扬家中福运兴旺昌盛。'},
    {id:42,level:'上',element:'木',direction:'东',poem:'谦辞退让识时务\n不恋权位避灾祸\n心胸豁达纳福运\n安稳平和岁月多',meaning:'懂得退让审时度势，不贪恋权势名利便可避开祸端。心胸豁达看淡得失，安稳平和的生活自有福气相伴。'},
    {id:43,level:'中',element:'火',direction:'南',poem:'妙计筹谋算计深\n成败依旧看天心\n尽心谋划行正道\n得失随缘莫扰心',meaning:'尽心谋划全力行事，最终成败还看天时机缘。恪守正道无愧本心，看淡得失不必为此心绪烦忧。'},
    {id:44,level:'中',element:'火',direction:'南',poem:'舍身决战气如虹\n一意孤行难善终\n凡事留余知进退\n极端行事祸无穷',meaning:'行事极端不留余地，一意孤行很难收获圆满结局。处事懂得分寸进退有度，偏激做法极易招来无尽祸事。'},
    {id:45,level:'下',element:'土',direction:'中',poem:'心意反复难守一\n摇摆不定失良机\n坚守初心定方向\n三心二意万事虚',meaning:'心思摇摆立场不定，犹豫不决只会错失良机。认准方向坚守本心，三心二意到头来万事皆成泡影。'},
    {id:46,level:'中',element:'土',direction:'东',poem:'孝心感动天地间\n至诚所向困局迁\n行善积德逢助力\n苦尽甘来福连绵',meaning:'至诚善心能够扭转困局，积德行善自有天地庇佑。熬过艰难困苦阶段，往后福气接连不断安稳顺遂。'},
    {id:47,level:'上平',element:'金',direction:'东',poem:'布设疑阵阻强敌\n智慧周旋保疆域\n以智防守安稳守\n不求冒进自无虞',meaning:'依靠智慧周旋守护自身，稳妥防守不必贸然进攻。安稳守住现有根基，不贪冒进就不会遭遇祸患危机。'},
    {id:48,level:'下下',element:'金',direction:'南',poem:'乱世纷争战火连\n百姓流离苦难缠\n安稳居家避动乱\n妄动奔波惹祸牵',meaning:'周遭局势纷乱动荡，身处其中易遭受牵连。安稳居家减少外出奔波，随意行动都会招惹灾祸麻烦。'},
    {id:49,level:'上上',element:'水',direction:'南',poem:'坐拥基业守江东\n知人善任万事隆\n同心协力根基固\n世代安宁享丰功',meaning:'善于识人任用贤才，团队同心协力守护根基。家业事业稳固牢靠，世代都能享受功绩福气。'},
    {id:50,level:'中',element:'水',direction:'中',poem:'择主寻途几度迁\n初心坚守志拳拳\n路途辗转多磨砺\n终觅安身处世缘',meaning:'人生路途难免辗转抉择，历经诸多磨砺考验。坚守自身志向本心，最终总能寻得安稳立足的归宿。'},
    {id:51,level:'上',element:'木',direction:'东',poem:'千里传信秉忠心\n不惧危难守本真\n忠义之行得天佑\n险路通行无祸侵',meaning:'心怀忠义不惧前路艰险，坚守本心做事无愧于人。赤诚品行获得庇佑，即便行走险路也能避开灾祸安稳通行。'},
    {id:52,level:'中',element:'木',direction:'东',poem:'谗言蛊惑乱心神\n误导决策败家门\n分辨虚实明善恶\n莫被闲语乱分寸',meaning:'闲言碎语容易扰乱心智，错误判断会招致家业损耗。分清话语真假善恶，不因旁人言语打乱自身行事分寸。'},
    {id:53,level:'中',element:'火',direction:'南',poem:'矢志忠心护故疆\n舍生取义姓名扬\n坚守气节无遗憾\n福报荫及后代长',meaning:'坚守自身气节忠心不二，即便付出代价也能留名于世。正直品行积攒福报，恩泽能够绵延惠及后代子孙。'},
    {id:54,level:'下',element:'火',direction:'南',poem:'同室操戈互损伤\n相争两败皆空忙\n放下争端重和睦\n携手并肩才有光',meaning:'内部争执厮杀只会两败俱伤，彼此忙碌最终一无所获。放下矛盾重修和睦，团结携手前行才能看见希望转机。'},
    {id:55,level:'上平',element:'土',direction:'中',poem:'傲骨铮铮不肯降\n坚守气节自刚强\n磨难不改心中志\n安稳福运暗中藏',meaning:'风骨坚毅不屈服于困境磨难，历经考验依旧坚守志向。磨难只是暂时历练，安稳福气默默相伴等候时机。'},
    {id:56,level:'中',element:'土',direction:'东',poem:'势孤力弱难支撑\n顺势低头避祸横\n隐忍待机图后计\n莫逞刚强误前程',meaning:'自身实力单薄难以支撑局面，暂且退让隐忍避开灾祸。暗中积攒力量谋划后续，切勿一味逞强断送自身前程。'},
    {id:57,level:'上上',element:'金',direction:'东',poem:'心怀壮志复河山\n屡经战阵意志坚\n矢志不渝终有报\n盛名功绩永流传',meaning:'胸怀远大志向坚持不懈，历经无数坎坷依旧意志坚定。持之以恒的付出终有回报，功绩名声能够长久留存。'},
    {id:58,level:'下下',element:'金',direction:'南',poem:'苛政残暴失民心\n肆意奢靡基业倾\n修身律己行仁政\n方能安稳守太平',meaning:'严苛暴虐失去人心支持，挥霍无度会彻底损毁根基。约束自身推行宽厚处事，才能长久守住安稳太平生活。'},
    {id:59,level:'上',element:'水',direction:'南',poem:'前世缘分今生逢\n情意真挚两心通\n姻缘注定难拆散\n相守和美万事融',meaning:'命中注定的缘分今生相逢，彼此心意相通情意真挚。既定缘分难以拆散，相守相伴家庭和睦万事顺心。'},
    {id:60,level:'中',element:'水',direction:'中',poem:'慧眼识人辨俊良\n举荐贤才助四方\n成人之美积厚德\n自身安稳福运昌',meaning:'眼光通透分辨贤才优劣，推举能人助力世事发展。成全他人积攒深厚德行，自身也能收获安稳兴旺福运。'},
    {id:61,level:'上平',element:'木',direction:'东',poem:'行善救民结善缘\n无端横祸落身前\n善心不改从容对\n阴霾散尽见青天',meaning:'一心行善助人结缘，偶尔会遭遇无妄之灾。坚守善心从容面对困境，所有阴霾终会消散迎来顺遂光景。'},
    {id:62,level:'中',element:'木',direction:'东',poem:'沉迷安逸废操劳\n懈怠心神大事抛\n享乐消磨雄心志\n一朝落败悔难熬',meaning:'沉溺舒适生活放弃打拼，心神懈怠荒废重要事务。安逸会消磨进取志向，等到落败之时再悔恨已然来不及。'},
    {id:63,level:'中',element:'火',direction:'南',poem:'固守城池心志坚\n拒敌安稳保家园\n本分履职无贪念\n岁岁平安福自全',meaning:'坚定心智守护自身根基，抵御外界侵扰保全家园。恪守本职没有贪心杂念，岁岁年年都能平安顺遂福气圆满。'},
    {id:64,level:'下',element:'火',direction:'南',poem:'才情傲物口无遮\n直言招祸惹风波\n处世言辞留分寸\n谦和低调免挫磨',meaning:'依仗才华高傲处事，言语不加节制容易招惹风波。日常说话做事把握分寸，谦和低调行事便能避开坎坷挫折。'},
    {id:65,level:'上上',element:'土',direction:'中',poem:'藏锋隐忍待天时\n静待风云世事移\n一朝机遇乘风起\n执掌乾坤万事宜',meaning:'收敛锋芒默默隐忍等候天时，静观世事变迁沉淀自身。一旦机遇降临顺势而起，执掌局面之后万事皆能顺心如意。'},
    {id:66,level:'下下',element:'土',direction:'东',poem:'领兵无策守疆难\n敌军围困路途残\n运势衰败难扭转\n闭门守旧避灾寒',meaning:'谋划不足难以守护根基，遭遇围困前路艰难坎坷。当下运势衰败很难扭转局面，闭门守旧减少行动避开灾祸。'},
    {id:67,level:'中',element:'金',direction:'东',poem:'散尽家资助义君\n诚心相伴共浮沉\n得失随缘莫计较\n心安便是福家门',meaning:'舍弃财物真心相伴伙伴，共同经历人生起伏沉浮。看淡财物得失不必斤斤计较，内心安稳便是家中最大福气。'},
    {id:68,level:'上',element:'金',direction:'南',poem:'苦心施计破强敌\n舍小求全大局宜\n懂得权衡分轻重\n换来安稳大根基',meaning:'用心谋划突破艰难困局，舍弃小的利益保全整体大局。分清事情轻重权衡取舍，最终能够换来稳固安稳的根基。'},
    {id:69,level:'下',element:'水',direction:'南',poem:'密谋行事不周密\n风声外泄祸殃及\n坦荡处事少私计\n安稳度日免危机',meaning:'暗中谋划行事不够缜密，消息泄露就会引来祸事。坦然直白处事减少私下算计，安稳平淡生活便可避开危机。'},
    {id:70,level:'中',element:'水',direction:'中',poem:'随身吉物伴人行\n秉性良和善气生\n修身养性攒祥瑞\n一路平安万事成',meaning:'心怀和善之气待人处事，日常修身养性积攒祥瑞运势。福气随身相伴，人生前行路途平安，谋划之事大多能够成功。'},
    {id:71,level:'上上',element:'木',direction:'东',poem:'天时人事两相扶\n顺应潮流展宏图\n基业新开气象盛\n荣华安稳享通途',meaning:'天时人力相互扶持助力，顺应时代趋势施展抱负。全新基业蓬勃兴盛，往后人生路途通达，安稳享受荣华福气。'},
    {id:72,level:'中',element:'木',direction:'东',poem:'手足相争夺权名\n骨肉疏离情义轻\n放下争夺守本分\n阖家和睦享安宁',meaning:'至亲骨肉为名利相互争夺，亲情情谊日渐淡薄疏远。放下争抢之心恪守本分，家人和睦相处才能享受安宁生活。'},
    {id:73,level:'上平',element:'火',direction:'南',poem:'满腹才情寄诗文\n人生起伏自浮沉\n看淡荣辱心安定\n悠然度日避风尘',meaning:'一身才情寄托心境，人生起落沉浮皆是常态。看淡世间荣耀屈辱，内心安定淡然处世，悠然生活避开俗世纷争。'},
    {id:74,level:'中',element:'火',direction:'南',poem:'心志不定屡更改\n反复无常祸自来\n专一守心行正道\n安稳无灾福自来',meaning:'内心志向不定频繁改换选择，反复无常的行事方式会自取灾祸。专心坚守本心行走正道，安稳没有灾厄福气自然降临。'},
    {id:75,level:'下',element:'土',direction:'中',poem:'阵前辩驳辱其身\n虚名虚利难当真\n务实修身弃浮华\n脚踏实地避风尘',meaning:'口舌争辩损伤自身颜面，虚无的名利不值得执着追求。舍弃浮华外在踏实修养自身，脚踏实地做事避开俗世羞辱风波。'},
    {id:76,level:'上',element:'土',direction:'东',poem:'识人辨性需分明\n错信人心损己程\n慧眼甄别结良友\n前路无忧万事兴',meaning:'结交友人务必分辨品性好坏，轻信他人容易损耗自身前程。眼光精准筛选良师益友，前行路途没有阻碍万事兴旺。'},
    {id:77,level:'中',element:'金',direction:'东',poem:'小小城池心志坚\n孤军坚守破围艰\n恒心不改终脱困\n雨过天晴好运连',meaning:'身处困境依旧意志坚定，独自坚守熬过艰难围困。持之以恒不改本心终能脱离险境，风雨过后接连迎来美好运势。'},
    {id:78,level:'下下',element:'金',direction:'南',poem:'玩弄权术搅朝纲\n私心作祟祸四方\n权欲缠身难善果\n清心正道保安康',meaning:'依靠权谋算计搅乱秩序，私心过重会给各方带来灾祸。沉迷权力欲望很难收获好结局，清心寡欲恪守正道才能保全自身安康。'},
    {id:79,level:'上平',element:'水',direction:'南',poem:'出使邻邦守礼仪\n不卑不亢展威仪\n分寸得体通和睦\n两地安宁免战旗',meaning:'外出处事恪守礼仪规矩，态度有度不卑微不傲慢。言行得体促成和睦关系，彼此安稳相处避开战火纷争。'},
    {id:80,level:'中',element:'水',direction:'中',poem:'罢政归居静心修\n博览群书解世忧\n修身增智明事理\n安稳余生无烦愁',meaning:'放下俗世事务静心修养自身，博览学识排解心中烦忧。提升修养智慧明白世事道理，往后余生安稳度过没有烦心事扰。'},
    {id:81,level:'上上',element:'木',direction:'东',poem:'尽心辅佐储君身\n忠义谋划社稷春\n辅政安邦积大德\n福泽绵延后代人',meaning:'倾尽心力辅佐后辈领袖，忠义谋划助力家国兴盛。辅佐安定江山积攒厚重德行，福气恩泽能够绵延惠及子孙后代。'},
    {id:82,level:'下下',element:'木',direction:'东',poem:'将门之后负威名\n抵御强敌难守城\n大势已去难扭转\n退守保全莫强行',meaning:'身负名望却难以抵挡强敌进攻，大局走势衰败很难人力扭转。此时应当退守保全自身，强行对抗只会招致惨重损失。'},
    {id:83,level:'中',element:'火',direction:'南',poem:'审度时势晓兴衰\n顺势而为免祸灾\n执拗逞强皆无益\n变通处世福自来',meaning:'看清时局走向明白兴衰规律，顺应形势行事便可避开灾祸。固执逞强没有实际用处，灵活变通待人处事福气自然到来。'},
    {id:84,level:'上平',element:'火',direction:'南',poem:'半生辗转伴烟尘\n历尽兴衰守本真\n岁月磨砺心性稳\n平安终老享天伦',meaning:'人生半生辗转历经世事变迁，看过兴衰起落依旧坚守本心。岁月打磨沉淀沉稳心性，晚年平安终老享受阖家天伦之乐。'},
    {id:85,level:'下',element:'土',direction:'中',poem:'聪颖过人洞悉机\n锋芒太露惹猜疑\n藏智守拙低调处\n方可平安避祸机',meaning:'头脑聪慧能够看透世事玄机，但是才华外露太过张扬容易招人猜忌。隐藏智慧朴实低调处事，才能安稳避开潜藏的灾祸危机。'},
    {id:86,level:'中',element:'土',direction:'东',poem:'治军严谨守边防\n法度分明秩序彰\n依规行事无过错\n年年安稳享安康',meaning:'管理处事严谨遵守规矩，条理分明秩序井然。依照规章法度做事不会'},
    {id:87,level:'上上',element:'金',direction:'东',poem:'横矛立马挡千军\n豪气冲天镇乱云\n胆识立身皆顺遂\n前程坦荡福长存',meaning:'气魄胆识出众，危难时刻可挺身而出。行事果敢磊落，周遭阻碍皆可震慑化解，事业运势一路平稳上扬。'},
    {id:88,level:'下下',element:'金',direction:'南',poem:'肆意劫掠逞凶狂\n作恶横行祸自殃\n恶行难瞒天地眼\n一朝倾覆悔断肠',meaning:'蛮横作恶只顾私利，损人之举终会反噬自身。不守道义肆意妄为，终将落得衰败收场，诸事皆难圆满。'},
    {id:89,level:'中',element:'水',direction:'南',poem:'远赴京城赴邀约\n人心难测暗风波\n安分守心少妄动\n避开罗网免磋磨',meaning:'外界人事暗藏算计，贸然奔赴容易陷入险境。日常行事沉稳谨慎，不轻易听信邀约，安分度日便可规避祸事。'},
    {id:90,level:'上',element:'水',direction:'中',poem:'手足情深秉赤诚\n良言劝解化纷争\n真心处世人缘广\n家和业旺万事兴',meaning:'真诚待人、重视亲情情义，温和劝解便能消解矛盾。人缘和睦助力诸事推进，家庭安稳之下事业也能蒸蒸日上。'},
    {id:91,level:'中',element:'木',direction:'东',poem:'贪功冒进逞私心\n误入圈套难脱身\n功利蒙眼失判断\n沉稳行事免遭侵',meaning:'急于求成贪图功绩，容易丧失理智判断。放下浮躁功利之心，步步稳妥谋划行事，才能远离陷阱保全自身。'},
    {id:92,level:'中',element:'木',direction:'东',poem:'身拘异地念初心\n不为名利改忠贞\n坚守本心行正道\n虽处逆境亦安宁',meaning:'身处逆境境遇受限，依旧坚守自身气节初心。不被名利诱惑动摇品行，纵使环境不如意，内心也能安稳平和。'},
    {id:93,level:'上平',element:'火',direction:'南',poem:'起初隔阂不相容\n日久知贤心意通\n放下偏见识良友\n携手同行路路通',meaning:'初始相处存有偏见隔阂，日久相处便能看清本心。摒弃成见接纳他人，同心协力携手并进，前路阻碍尽数消散。'},
    {id:94,level:'下',element:'火',direction:'南',poem:'临危背弃失忠贞\n苟且偷安难立身\n气节丧失人缘尽\n往后前程多风尘',meaning:'危难之际背弃道义，纵使暂时保全自身，也会丧失人心口碑。失去信义难获他人信任，往后行事处处都会遭遇阻碍。'},
    {id:95,level:'上上',element:'土',direction:'中',poem:'沙场征战建功勋\n功成知退享安身\n一生忠正无过错\n晚年清闲福寿深',meaning:'一生行事忠义坦荡，建功立业后懂得知足退让。一生无重大过错，晚年远离纷争，清闲度日福寿绵长安稳无忧。'},
    {id:96,level:'下下',element:'土',direction:'东',poem:'奸邪当道蔽明君\n谗言四起社稷昏\n小人作祟难成事\n守正避凶免祸根',meaning:'身边小人暗中作祟，谗言虚语扰乱判断。环境浑浊诸事难成，坚守自身正道远离奸邪，才能避开灾祸保全自身。'},
    {id:97,level:'中',element:'金',direction:'东',poem:'危难时刻守初心\n舍身护主尽忠心\n世事起伏皆常态\n安稳度日少忧辛',meaning:'遭遇变故起伏波折，始终坚守忠义本心。人生起落本是寻常，秉持初心安稳度日，便可减少烦忧磨难。'},
    {id:98,level:'上',element:'金',direction:'南',poem:'妙计谋划拓疆土\n审时度势展宏图\n运筹得当诸事顺\n家业兴旺好运铺',meaning:'善于审时度势谋划布局，凭借智慧便能开拓新局面。行事规划周全稳妥，各项事务推进顺畅，家运事业皆能兴旺发达。'},
    {id:99,level:'中',element:'水',direction:'南',poem:'见危不救失仁心\n冷漠行事祸近身\n情义相交方长久\n薄情寡义难立身',meaning:'危难之时冷漠旁观，缺失情义易招致祸端。人与人相处贵在真心相助，薄情寡义难以立足长久，行事勿忘心怀仁善。'},
    {id:100,level:'上上',element:'水',direction:'中',poem:'一生忠义照乾坤\n万古英名四海尊\n善念修身多积福\n阖家兴旺福无垠',meaning:'坚守忠义善心修身，德行深厚自有福报护佑。一生品行受人尊崇，家族运势兴旺昌盛，往后福运无边绵延不息。'},
  ],
  '黄大仙灵签': [
    {id:1,level:'上上',element:'木',direction:'东',poem:'灵签求得第一枝\n龙虎风云际会时\n；一旦凌霄扬自\n乐任君来往赴瑶池',meaning:'大吉，万事亨通，贵人得力，功名富贵俱全。'},
    {id:2,level:'上',element:'木',direction:'东',poem:'枯木逢春尽发新\n花香叶茂蝶来频\n；桃源竞斗千红\n紫一片渔舟误入津',meaning:'吉，绝处逢生，意外得福，无心插柳柳成荫。'},
    {id:3,level:'中',element:'火',direction:'南',poem:'山前山后皆成路\n世上名利似水流\n；若得贵人来指\n引不愁无路到王侯',meaning:'中吉，前路可行，需人提携，自力难成。'},
    {id:4,level:'下下',element:'火',direction:'南',poem:'卖身葬父最堪怜\n历尽艰难始遇仙\n；虽是前缘天注\n定暂时劳苦莫怨天',meaning:'凶，劳多获少，委屈受累，诸事阻滞。'},
    {id:5,level:'中',element:'土',direction:'中',poem:'雪拥蓝关马不前\n一封朝奏九重天\n；云横秦岭家何\n在历尽风霜始见天',meaning:'平，先难后易，波折难免，终有转机。'},
    {id:6,level:'上',element:'土',direction:'东',poem:'完璧归来事已谐\n贵人指引笑颜开\n；云开月明风恬\n浪一路亨通任往来',meaning:'吉，险中得成，失而复得，名成利就。'},
    {id:7,level:'中',element:'金',direction:'东',poem:'十年窗下未逢时\n一旦成名天下知\n；忍耐守贫休妄\n动时来运转福自随',meaning:'中吉，守旧待时，先苦后甜，不可急躁。'},
    {id:8,level:'下下',element:'金',direction:'南',poem:'九里山前困霸王\n八千子弟散他乡\n；英雄到此无生\n路运去时衰事不昌',meaning:'凶，被困无力，四面楚歌，防破财官非。'},
    {id:9,level:'上上',element:'水',direction:'南',poem:'东篱菊放正金黄\n把酒临风醉一场\n；富贵荣华皆是\n梦清闲自在乐无疆',meaning:'大吉，名利双收，清闲有福，无忧无虑。'},
    {id:10,level:'下下',element:'水',direction:'中',poem:'十上秦书未遇时\n归来憔悴受人欺\n；一朝得志青云\n上方显男儿志气奇',meaning:'凶，目前失意，受人轻视，不宜强出头。'},
    {id:11,level:'上',element:'木',direction:'东',poem:'月夜追贤意甚诚\n英雄相遇气峥嵘\n；时来大展平生\n志功成名就福满门',meaning:'吉，得贵人助，机遇临门，事业大进。'},
    {id:12,level:'中',element:'木',direction:'东',poem:'醉里挥毫气似虹\n长安市上乐无穷\n；一朝天子来宣\n召不上兰舟醉梦中',meaning:'平，才华有用，行事散漫，宜守不宜进。'},
    {id:13,level:'上上',element:'火',direction:'南',poem:'龙门得水便升腾\n万里风云自此兴\n；脱却凡胎成变\n化身登金榜福康宁',meaning:'大吉，一跃成龙，名利双收，前程远大。'},
    {id:14,level:'中',element:'火',direction:'南',poem:'渭水垂钓待时来\n直钩不钓世间财\n；一朝得遇明君\n主八百江山掌上开',meaning:'中吉，静待时机，大器晚成，贵人终至。'},
    {id:15,level:'下下',element:'土',direction:'中',poem:'一别长安万里行\n黄沙漫漫路难程\n；思乡落泪无人\n见独抱琵琶恨不平',meaning:'凶，远行不利，离别之苦，凡事劳心劳力。'},
    {id:16,level:'中',element:'土',direction:'东',poem:'知音难觅最伤情\n摔碎瑶琴不忍听\n；高山流水无人\n赏独坐寒窗叹孤零',meaning:'平，知音难遇，人事冷淡，宜守旧、慎交友。'},
    {id:17,level:'上',element:'金',direction:'东',poem:'青梅煮酒论英雄\n暂屈韬光待时通\n；一旦风云来会\n合龙骧虎步定乾坤',meaning:'吉，深藏不露，时机一到，大展宏图。'},
    {id:18,level:'下下',element:'金',direction:'南',poem:'月下佳期事可疑\n风流惹祸悔难追\n；一朝泄漏春光\n去烦恼缠身不自知',meaning:'凶，桃花惹祸，情事纠缠，防小人、官非。'},
    {id:19,level:'上上',element:'水',direction:'南',poem:'历山耕田苦不辞\n一朝南面掌坤维\n；从来大器多磨\n折守得云开见日时',meaning:'大吉，先劳后荣，苦尽甘来，大福在后。'},
    {id:20,level:'中',element:'水',direction:'中',poem:'北海牧羊十九年\n忠心不改志弥坚\n；冰天雪地受尽\n苦终得归来拜汉天',meaning:'平，忍耐持久，守节得成，虽苦终吉。'},
    {id:21,level:'上',element:'木',direction:'东',poem:'当年贫困两相离\n一旦荣华独自归\n；富贵还乡谁不\n羡前程锦绣耀门楣',meaning:'吉，旧运已过，新运来临，苦尽荣华至。'},
    {id:22,level:'下下',element:'木',direction:'东',poem:'富贵忘恩太无情\n杀妻灭子罪非轻\n；一朝败露天难\n恕身首异处祸临门',meaning:'凶，忘恩负义，破财招灾，凡事莫负人心。'},
    {id:23,level:'中',element:'火',direction:'南',poem:'久别相逢喜气扬\n故人相遇话衷肠\n；患难扶持真义\n重前程相助有光昌',meaning:'中吉，旧友助力，人情温暖，合作有利。'},
    {id:24,level:'中',element:'火',direction:'南',poem:'功成身退五湖游\n不恋人间富贵侯\n；一叶扁舟随水\n去无忧无虑乐悠悠',meaning:'平，宜退不宜进，知足常乐，守旧安稳。'},
    {id:25,level:'上上',element:'土',direction:'中',poem:'功成身退合天心\n不恋荣华避祸侵\n；云散月明风日\n好逍遥自在享清宁',meaning:'大吉，名利两全，全身而退，福寿绵长。'},
    {id:26,level:'下下',element:'土',direction:'东',poem:'赤壁破曹气势雄\n机关算尽太聪明\n；虽胜一时身早\n损寿短难延叹薄情',meaning:'凶，好景不长，聪明反误，防过劳、损身。'},
    {id:27,level:'中',element:'金',direction:'东',poem:'宝剑随身处处通\n斩除邪祟显神通\n；逢凶化吉天庇\n佑一路平安万事隆',meaning:'中吉，有化解之力，逢凶化吉，贵人护佑。'},
    {id:28,level:'中',element:'金',direction:'南',poem:'月里伐桂几千年\n辛苦劳心不见闲\n；日日操劳无了\n日何时得见太平年',meaning:'平，劳碌无休，进展缓慢，难有大收获。'},
    {id:29,level:'上',element:'水',direction:'南',poem:'鲈鱼作脍菊花黄\n美酒盈樽近晚凉\n；泛棹正当潮上\n候这般佳景乐无央',meaning:'吉，安乐自在，名利两全，家宅安宁。'},
    {id:30,level:'下下',element:'水',direction:'中',poem:'恩爱到头一场空\n马嵬坡下泪无穷\n；红颜薄命遭天\n妒富贵荣华梦影中',meaning:'凶，情变、破财、分离，诸事难圆满。'},
    {id:31,level:'上上',element:'木',direction:'东',poem:'十八年离苦尽尝\n归来依旧守寒窑\n；一朝得志荣华\n至夫贵妻荣福自饶',meaning:'大吉，苦尽甘来，夫妻和合，家业兴旺。'},
    {id:32,level:'中',element:'木',direction:'东',poem:'少时谦让有贤名\n长大刚直不容情\n；虽有才华招祸\n患一生清誉自分明',meaning:'平，礼让得福，刚直招嫌，宜和缓处事。'},
    {id:33,level:'上',element:'火',direction:'南',poem:'过江招亲喜气扬\n龙凤呈祥福满堂\n；虽是计谋安排\n定姻缘天定自安康',meaning:'吉，喜事临门，姻缘和合，事业顺利。'},
    {id:34,level:'下下',element:'火',direction:'南',poem:'一生好佛敬神明\n到老被困台城深\n；善恶到头终有\n报修行不足祸难禁',meaning:'凶，被困、破财、病灾，宜修善、避祸。'},
    {id:35,level:'中',element:'土',direction:'中',poem:'万里西行路漫漫\n历尽魔难始得还\n；诚心终得神明\n助正果修成福自安',meaning:'中吉，磨难之后有成，诚心可感神明。'},
    {id:36,level:'中',element:'土',direction:'东',poem:'满腹经纶不得时\n忧国忧民泪暗垂\n；一朝身赴汨罗\n水万古千秋恨未迟',meaning:'平，怀才不遇，忧思过重，防抑郁、破财。'},
    {id:37,level:'上',element:'金',direction:'东',poem:'满堂福禄庆生辰\n七子八婿尽荣华\n；富贵双全人长\n寿一门和气乐无涯',meaning:'吉，家宅兴旺，福寿双全，子孙贤孝。'},
    {id:38,level:'下下',element:'金',direction:'南',poem:'醉酒娇痴宠万千\n一朝祸起马嵬前\n；荣华富贵如春\n梦色衰爱弛祸相连',meaning:'凶，桃花招祸，得意生悲，防纵欲、破财。'},
    {id:39,level:'中',element:'水',direction:'南',poem:'笔底生花志气高\n一朝金榜姓名标\n；文章自有神明\n助富贵荣华不待招',meaning:'中吉，学业事业有成，文运亨通，功名可期。'},
    {id:40,level:'中',element:'水',direction:'中',poem:'十年灯火用心勤\n命运崎岖不遇人\n；莫道文章无用\n处时来自有出头辰',meaning:'平，才华难展，时机未到，宜静待、自修。'},
    {id:41,level:'上上',element:'木',direction:'东',poem:'巾帼英雄胆气豪\n三军号令掌分毫\n；一战成功威名\n振福禄荣华日日高',meaning:'大吉，女强男旺，掌权得势，事业大成。'},
    {id:42,level:'下下',element:'木',direction:'东',poem:'荒淫无道失民心\n众叛亲离祸乱临\n；一旦身焚摘星\n楼万年遗臭到如今',meaning:'凶，纵欲败运，众叛亲离，防官非、破财。'},
    {id:43,level:'中',element:'火',direction:'南',poem:'百万军中独护主\n一身胆气冠三国\n；风烟散尽见太\n平功成名就福自多',meaning:'中吉，危难有救，忠心得报，贵人相助。'},
    {id:44,level:'中',element:'火',direction:'南',poem:'少年才俊美名扬\n中年落魄事无常\n；才尽途穷无去\n路空留遗恨叹凄凉',meaning:'平，后劲不足，才华渐衰，宜及早转行。'},
    {id:45,level:'上',element:'土',direction:'中',poem:'金蟾吐宝福临门\n刘海嬉游喜气深\n；财禄自来无阻\n隔家兴人旺乐长春',meaning:'吉，财运亨通，偏财易得，家宅吉祥。'},
    {id:46,level:'下下',element:'土',direction:'东',poem:'一片痴心付水流\n箱沉江底恨悠悠\n；负心薄幸难长\n久情海风波莫强求',meaning:'凶，情伤、破财、受骗，防人财两空。'},
    {id:47,level:'中',element:'金',direction:'东',poem:'月宫一游梦魂通\n富贵荣华转眼空\n；若得清闲无挂\n碍胜如金殿做王公',meaning:'中吉，梦幻之福，宜知足，守旧安稳。'},
    {id:48,level:'中',element:'金',direction:'南',poem:'守信不移志甚坚\n抱柱而死为情牵\n；太过执着成迂\n腐变通方可见青天',meaning:'平，守信可敬，过执反害，宜灵活处事。'},
    {id:49,level:'上上',element:'水',direction:'南',poem:'白袍征战十年功\n一旦荣归拜九重\n；富贵荣华天所\n赐衣锦还乡福满门',meaning:'大吉，功成名就，衣锦还乡，富贵双全。'},
    {id:50,level:'下下',element:'水',direction:'中',poem:'功高震主祸难逃\n未央宫里血刀摇\n；勇略过人遭主\n忌荣华转眼梦烟消',meaning:'凶，功高招忌，防小人、官非、破财。'},
    {id:51,level:'上',element:'木',direction:'东',poem:'八仙过海各神通\n风平浪静一帆风\n；各自显能成正\n果前程万里任君行',meaning:'吉，各展所长，顺利成功，合作有利。'},
    {id:52,level:'中',element:'木',direction:'东',poem:'井底安居眼界狭\n不知天地有荣华\n；一朝跳出方知\n阔眼界开时福自嘉',meaning:'平，眼界未开，宜学习、外出、求新。'},
    {id:53,level:'中',element:'火',direction:'南',poem:'几番跋涉访贤良\n一片诚心动上苍\n；莫道眼前无际\n遇时来风送遂祯祥',meaning:'中吉，诚心得报，贵人终至，时机成熟。'},
    {id:54,level:'下下',element:'火',direction:'南',poem:'英雄气短困牢笼\n有勇无谋事不成\n；一朝失势身难\n保空留遗恨叹平生',meaning:'凶，有勇无谋，防冲动、破财、官非。'},
    {id:55,level:'上',element:'土',direction:'中',poem:'天官赐福喜临门\n万事亨通福满门\n；灾厄消除身康\n健家兴财旺乐长春',meaning:'吉，福气临门，消灾解难，百事顺遂。'},
    {id:56,level:'中',element:'土',direction:'东',poem:'盲人骑瞎马\n夜半临深池\n；险处不知\n险祸来悔已迟',meaning:'平，盲目行事，危险暗藏，宜谨慎、勿冒险。'},
    {id:57,level:'中',element:'金',direction:'东',poem:'秋来黄菊正飘香\n晚节坚贞耐雪霜\n；莫道年高无大\n用老来福气更荣昌',meaning:'中吉，大器晚成，晚景荣华，福寿绵长。'},
    {id:58,level:'下下',element:'金',direction:'南',poem:'六月飞霜雪满天\n奇冤难诉苦连天\n；人心险恶难测\n度凡事提防莫自怜',meaning:'凶，冤屈、官非、破财，防小人构陷。'},
    {id:59,level:'上',element:'水',direction:'南',poem:'举案齐眉百世芳\n夫妻和顺乐无疆\n；贫贱不移真情\n在荣华富贵自天彰',meaning:'吉，夫妻和合，家道兴隆，贫贱见真情。'},
    {id:60,level:'中',element:'水',direction:'中',poem:'和番醉笔似云烟\n日在长安酒店眠\n；倘遇唐皇颁令\n召重呼不上木兰船',meaning:'平，才华有用，懒散成性，宜约束自己。'},
    {id:61,level:'上上',element:'木',direction:'东',poem:'黄袍加身应运兴\n四海讴歌贺太平\n；时到自然成事\n易功成名就福满门',meaning:'大吉，顺势而成，大权在握，富贵双全。'},
    {id:62,level:'下下',element:'木',direction:'东',poem:'龙舟千里下江都\n酒色荒淫国祚无\n；一旦兵临身不\n保繁华如梦总成虚',meaning:'凶，纵欲败运，远行不利，防破财、灾殃。'},
    {id:63,level:'中',element:'火',direction:'南',poem:'镇守三关志气雄\n忠心保国显威风\n；边疆平定狼烟\n息名垂青史福无穷',meaning:'中吉，守成得力，安稳无忧，名望自至。'},
    {id:64,level:'中',element:'火',direction:'南',poem:'空谈兵法不知行\n临阵慌忙败局成\n；凡事须求真历\n练莫将虚语误平生',meaning:'平，理论有余，实践不足，宜务实、勿空谈。'},
    {id:65,level:'上',element:'土',direction:'中',poem:'观音慈悲送子来\n一门和气笑颜开\n；添丁进财家兴\n旺福禄寿喜满庭阶',meaning:'吉，添丁、家兴、财旺，喜事连连。'},
    {id:66,level:'下下',element:'土',direction:'东',poem:'奸佞当权害忠良\n风波亭上恨绵长\n；善恶到头终有\n报害人害己祸难藏',meaning:'凶，小人当道，防构陷、官非、破财。'},
    {id:67,level:'中',element:'金',direction:'东',poem:'慧眼识英雄\n私奔出帝宫\n；相从成大\n业富贵两从容',meaning:'中吉，慧眼识人，主动得福，姻缘事业皆吉。'},
    {id:68,level:'中',element:'金',direction:'南',poem:'井底点灯光不远\n眼前昏暗路难行\n；守旧安分度时\n日莫贪名利自寻惊',meaning:'平，前途不明，宜守旧、低调，勿强进。'},
    {id:69,level:'上',element:'水',direction:'南',poem:'还带救人积德深\n阴功浩大鬼神钦\n；一朝得遇机缘\n至富贵荣华福禄临',meaning:'吉，积德得福，贵人相助，苦尽荣华至。'},
    {id:70,level:'下下',element:'水',direction:'中',poem:'悍妇咆哮似虎狂\n家宅不宁祸事扬\n；口舌是非难避\n免破财招灾悔断肠',meaning:'凶，女色招祸，家宅不宁，防口舌、破财。'},
    {id:71,level:'上上',element:'木',direction:'东',poem:'瑶池偷桃献寿来\n聪明伶俐显奇才\n；富贵荣华随手\n得无忧无虑乐开怀',meaning:'大吉，聪明得福，意外之财，长寿安康。'},
    {id:72,level:'中',element:'木',direction:'东',poem:'刻舟求剑太痴顽\n守旧不知世事迁\n；固执难成新事\n业变通方可见青天',meaning:'平，守旧固执，宜变通、求新，勿僵化。'},
    {id:73,level:'中',element:'火',direction:'南',poem:'机敏聪慧语如珠\n口角春风万事舒\n；才智过人多顺\n利前程锦绣乐无忧',meaning:'中吉，口才好、人缘佳，顺利无忧。'},
    {id:74,level:'下下',element:'火',direction:'南',poem:'好色贪财性愚顽\n高老庄上惹祸端\n；情迷心窍难成\n事破财招灾惹是非',meaning:'凶，桃花破财，贪心惹祸，防情色纠纷。'},
    {id:75,level:'上',element:'土',direction:'中',poem:'为国捐躯献美人\n功成身退隐江滨\n；名利双收全身\n退福禄绵长享太平',meaning:'吉，以柔克刚，事成身退，名利两全。'},
    {id:76,level:'中',element:'土',direction:'东',poem:'水中捞月枉劳心\n空费精神不见金\n；万事虚幻难成\n就不如守旧免灾侵',meaning:'平，徒劳无功，虚幻难成，宜守旧、勿妄求。'},
    {id:77,level:'中',element:'金',direction:'东',poem:'智取昆仑胆气豪\n英雄用计不徒劳\n；险阻重重皆打\n破功成名就福自高',meaning:'中吉，以智取胜，难关可破，事业有成。'},
    {id:78,level:'下下',element:'金',direction:'南',poem:'妖狐魅惑乱人心\n真假难分祸事临\n；迷色贪财终受\n害家破人亡悔难寻',meaning:'凶，小人魅惑，防受骗、破财、情色祸。'},
    {id:79,level:'上',element:'水',direction:'南',poem:'杨枝净水洒尘埃\n消灾解难福自来\n；百病消除身康\n健家兴财旺乐开怀',meaning:'吉，消灾解难，身心康健，百事吉祥。'},
    {id:80,level:'中',element:'水',direction:'中',poem:'守株待兔太愚痴\n妄想凭空得福时\n；不劳而获终难\n望勤力方可见生机',meaning:'平，妄想侥幸，宜勤劳、务实，勿空想。'},
    {id:81,level:'上上',element:'木',direction:'东',poem:'二月初二龙抬头\n青云直上福悠悠\n；万事亨通无阻\n隔富贵荣华日日稠',meaning:'大吉，时来运转，步步高升，前程远大。'},
    {id:82,level:'下下',element:'木',direction:'东',poem:'杜鹃啼血泣残红\n哀怨凄凉恨不穷\n；心事重重难排\n解破财招灾病气浓',meaning:'凶，忧思、病灾、破财，宜放宽心境。'},
    {id:83,level:'中',element:'火',direction:'南',poem:'出淤泥而不染尘\n清高自守品格真\n；名利场中能独\n醒一生清贵福绵长',meaning:'中吉，清高得福，品行端正，贵人敬重。'},
    {id:84,level:'中',element:'火',direction:'南',poem:'瓮中捉鳖易成功\n眼前小事可从容\n；大事还须防意\n外莫因轻忽惹灾凶',meaning:'平，小事易成，大事防险，勿轻敌。'},
    {id:85,level:'上',element:'土',direction:'中',poem:'麻姑献寿贺千秋\n福禄绵长岁月悠\n；身健家和多吉\n庆荣华富贵乐无忧',meaning:'吉，长寿安康，家兴人旺，吉祥如意。'},
    {id:86,level:'下下',element:'土',direction:'东',poem:'兵败麦城去路穷\n英雄末路泪纵横\n；运去时衰难振\n作破财招灾事事凶',meaning:'凶，兵败、失势、破财，防失败、官非。'},
    {id:87,level:'中',element:'金',direction:'东',poem:'善财童子拜观音\n步步生莲福自临\n；财源滚滚来不\n断家兴人旺乐长春',meaning:'中吉，财运渐佳，贵人相助，福运绵长。'},
    {id:88,level:'中',element:'金',direction:'南',poem:'缘木求鱼枉费心\n方向错误事难成\n；不改迷途空费\n力不如退步觅前程',meaning:'平，方向错误，徒劳无功，宜改弦易辙。'},
    {id:89,level:'上',element:'水',direction:'南',poem:'和合二仙笑盈盈\n万事和合喜气生\n；婚姻圆满家和\n睦财禄丰盈福满门',meaning:'吉，和合圆满，婚姻佳、家宅宁、财源旺。'},
    {id:90,level:'下下',element:'水',direction:'中',poem:'冰山靠日不久长\n转眼消融化作水\n；眼前富贵如朝\n露运去财空悔断肠',meaning:'凶，富贵难久，靠山不稳，防破财、失势。'},
    {id:91,level:'中',element:'木',direction:'东',poem:'周游列国历风霜\n教化苍生德泽长\n；虽有艰难终得\n济名垂千古福安康',meaning:'中吉，奔波有成，教化得福，名望自至。'},
    {id:92,level:'中',element:'木',direction:'东',poem:'隔岸观火不沾身\n旁观自保免灾侵\n；虽无大利亦无\n祸平淡安稳度光阴',meaning:'平，明哲保身，无大得亦无大失，宜旁观。'},
    {id:93,level:'上',element:'火',direction:'南',poem:'魁星点斗笔如神\n金榜题名喜气新\n；功名富贵从此\n至前程万里耀门庭',meaning:'吉，功名成就，文运亨通，步步高升。'},
    {id:94,level:'下下',element:'火',direction:'南',poem:'毒蛇当道阻前程\n暗箭伤人祸事临\n；小人暗算难防\n备破财招灾病气侵',meaning:'凶，小人暗害，防暗算、破财、官非。'},
    {id:95,level:'中',element:'土',direction:'中',poem:'龟鹤延年福寿长\n身心康健乐安康\n；家兴人旺多吉\n庆荣华富贵耀庭堂',meaning:'中吉，长寿安康，家宅兴旺，福气绵长。'},
    {id:96,level:'中',element:'土',direction:'东',poem:'孤舟蓑笠独飘零\n风雨飘摇路不明\n；守旧安分度时\n日莫贪名利自寻惊',meaning:'平，孤单漂泊，前路不明，宜守旧、忍耐。'},
    {id:97,level:'上',element:'金',direction:'东',poem:'丹凤朝阳瑞气生\n祥光普照福临门\n；万事亨通多吉\n庆富贵荣华日日新',meaning:'吉，祥瑞临门，前程远大，富贵双全。'},
    {id:98,level:'下下',element:'金',direction:'南',poem:'落叶归根势已衰\n旧运已去新不来\n；家道凋零人离\n散破财招灾事事哀',meaning:'凶，运衰、家败、人散，防破财、病灾。'},
    {id:99,level:'中',element:'水',direction:'南',poem:'禹门三级浪滔滔\n一跃龙门志气高\n；脱却尘埃成变\n化功成名就福滔滔',meaning:'中吉，突破难关，一跃成名，前程远大。'},
    {id:100,level:'中',element:'水',direction:'中',poem:'百花竞放贺阳春\n万物从今尽转新\n；末数莫言穷运\n至不知否极泰来临',meaning:'中吉，否极泰来，万象更新，旧运已过，新运来临。'},
  ],
  '妈祖灵签': [
    {id:1,level:'上上',element:'木',direction:'东',poem:'日出便见风云散\n光明清净照世间\n；一向前途通大\n道万事清吉保平安',meaning:'大吉，阴霾尽散，光明在前，万事顺遂，贵人得力。'},
    {id:2,level:'上',element:'木',direction:'东',poem:'蓝田种玉喜非常\n一点灵光照四方\n；有意栽花花自\n发无心插柳柳成行',meaning:'吉，天赐良缘，喜事临门，无心得福，谋望有成。'},
    {id:3,level:'中',element:'火',direction:'南',poem:'几番跋涉访贤良\n一片诚心动上苍\n；莫道眼前无际\n遇时来风送遂祯祥',meaning:'中吉，诚心得报，贵人终至，耐心等待，自有转机。'},
    {id:4,level:'下下',element:'火',direction:'南',poem:'九里山前困霸王\n八千子弟散他乡\n；英雄到此无生\n路运去时衰事不昌',meaning:'凶，四面楚歌，被困无力，防破财、官非、失利。'},
    {id:5,level:'中',element:'土',direction:'中',poem:'雪拥蓝关马不前\n一封朝奏九重天\n；云横秦岭家何\n在历尽风霜始见天',meaning:'平，先难后易，波折难免，忍耐守旧，终有转机。'},
    {id:6,level:'上',element:'土',direction:'东',poem:'完璧归来事已谐\n贵人指引笑颜开\n；云开月明风恬\n浪一路亨通任往来',meaning:'吉，险中得成，失而复得，名成利就，平安无虞。'},
    {id:7,level:'中',element:'金',direction:'东',poem:'十年窗下未逢时\n一旦成名天下知\n；忍耐守贫休妄\n动时来运转福自随',meaning:'中吉，守旧待时，先苦后甜，不可急躁，厚积薄发。'},
    {id:8,level:'下下',element:'金',direction:'南',poem:'十上秦书未遇时\n归来憔悴受人欺\n；一朝得志青云\n上方显男儿志气奇',meaning:'凶，目前失意，受人轻视，不宜强出头，守旧为上。'},
    {id:9,level:'上上',element:'水',direction:'南',poem:'东篱菊放正金黄\n把酒临风醉一场\n；富贵荣华皆是\n梦清闲自在乐无疆',meaning:'大吉，名利双收，清闲有福，无忧无虑，身心安泰。'},
    {id:10,level:'下下',element:'水',direction:'中',poem:'富贵忘恩太无情\n杀妻灭子罪非轻\n；一朝败露天难\n恕身首异处祸临门',meaning:'凶，忘恩负义，破财招灾，凡事莫负人心，防情灾。'},
    {id:11,level:'上',element:'木',direction:'东',poem:'月夜追贤意甚诚\n英雄相遇气峥嵘\n；时来大展平生\n志功成名就福满门',meaning:'吉，得贵人助，机遇临门，事业大进，前程似锦。'},
    {id:12,level:'中',element:'木',direction:'东',poem:'醉里挥毫气似虹\n长安市上乐无穷\n；一朝天子来宣\n召不上兰舟醉梦中',meaning:'平，才华有用，行事散漫，宜守不宜进，防误事。'},
    {id:13,level:'上上',element:'火',direction:'南',poem:'龙门得水便升腾\n万里风云自此兴\n；脱却凡胎成变\n化身登金榜福康宁',meaning:'大吉，一跃成龙，名利双收，前程远大，百事顺遂。'},
    {id:14,level:'中',element:'火',direction:'南',poem:'渭水垂钓待时来\n直钩不钓世间财\n；一朝得遇明君\n主八百江山掌上开',meaning:'中吉，静待时机，大器晚成，贵人终至，厚积薄发。'},
    {id:15,level:'下下',element:'土',direction:'中',poem:'一别长安万里行\n黄沙漫漫路难程\n；思乡落泪无人\n见独抱琵琶恨不平',meaning:'凶，远行不利，离别之苦，凡事劳心劳力，波折多。'},
    {id:16,level:'中',element:'土',direction:'东',poem:'知音难觅最伤情\n摔碎瑶琴不忍听\n；高山流水无人\n赏独坐寒窗叹孤零',meaning:'平，知音难遇，人事冷淡，宜守旧、慎交友，防孤单。'},
    {id:17,level:'上',element:'金',direction:'东',poem:'青梅煮酒论英雄\n暂屈韬光待时通\n；一旦风云来会\n合龙骧虎步定乾坤',meaning:'吉，深藏不露，时机一到，大展宏图，名利双收。'},
    {id:18,level:'下下',element:'金',direction:'南',poem:'月下佳期事可疑\n风流惹祸悔难追\n；一朝泄漏春光\n去烦恼缠身不自知',meaning:'凶，桃花惹祸，情事纠缠，防小人、官非、破财。'},
    {id:19,level:'上上',element:'水',direction:'南',poem:'历山耕田苦不辞\n一朝南面掌坤维\n；从来大器多磨\n折守得云开见日时',meaning:'大吉，先劳后荣，苦尽甘来，大福在后，终成大业。'},
    {id:20,level:'中',element:'水',direction:'中',poem:'北海牧羊十九年\n忠心不改志弥坚\n；冰天雪地受尽\n苦终得归来拜汉天',meaning:'平，忍耐持久，守节得成，虽苦终吉，贵在坚持。'},
    {id:21,level:'上',element:'木',direction:'东',poem:'当年贫困两相离\n一旦荣华独自归\n；富贵还乡谁不\n羡前程锦绣耀门楣',meaning:'吉，旧运已过，新运来临，苦尽荣华至，家运渐兴。'},
    {id:22,level:'下下',element:'木',direction:'东',poem:'醉酒娇痴宠万千\n一朝祸起马嵬前\n；荣华富贵如春\n梦色衰爱弛祸相连',meaning:'凶，桃花招祸，得意生悲，防纵欲、破财、情变。'},
    {id:23,level:'中',element:'火',direction:'南',poem:'久别相逢喜气扬\n故人相遇话衷肠\n；患难扶持真义\n重前程相助有光昌',meaning:'中吉，旧友助力，人情温暖，合作有利，贵人扶持。'},
    {id:24,level:'中',element:'火',direction:'南',poem:'功成身退五湖游\n不恋人间富贵侯\n；一叶扁舟随水\n去无忧无虑乐悠悠',meaning:'平，宜退不宜进，知足常乐，守旧安稳，避祸全身。'},
    {id:25,level:'上上',element:'土',direction:'中',poem:'功成身退合天心\n不恋荣华避祸侵\n；云散月明风日\n好逍遥自在享清宁',meaning:'大吉，名利两全，全身而退，福寿绵长，平安喜乐。'},
    {id:26,level:'下下',element:'土',direction:'东',poem:'赤壁破曹气势雄\n机关算尽太聪明\n；虽胜一时身早\n损寿短难延叹薄情',meaning:'凶，好景不长，聪明反误，防过劳、损身、短运。'},
    {id:27,level:'中',element:'金',direction:'东',poem:'宝剑随身处处通\n斩除邪祟显神通\n；逢凶化吉天庇\n佑一路平安万事隆',meaning:'中吉，有化解之力，逢凶化吉，贵人护佑，灾消福至。'},
    {id:28,level:'中',element:'金',direction:'南',poem:'月里伐桂几千年\n辛苦劳心不见闲\n；日日操劳无了\n日何时得见太平年',meaning:'平，劳碌无休，进展缓慢，难有大收获，宜守旧耐苦。'},
    {id:29,level:'上',element:'水',direction:'南',poem:'鲈鱼作脍菊花黄\n美酒盈樽近晚凉\n；泛棹正当潮上\n候这般佳景乐无央',meaning:'吉，安乐自在，名利两全，家宅安宁，身心舒畅。'},
    {id:30,level:'下下',element:'水',direction:'中',poem:'恩爱到头一场空\n马嵬坡下泪无穷\n；红颜薄命遭天\n妒富贵荣华梦影中',meaning:'凶，情变、破财、分离，诸事难圆满，防情灾、不测。'},
    {id:31,level:'上上',element:'木',direction:'东',poem:'十八年离苦尽尝\n归来依旧守寒窑\n；一朝得志荣华\n至夫贵妻荣福自饶',meaning:'大吉，苦尽甘来，夫妻和合，家业兴旺，富贵双全。'},
    {id:32,level:'中',element:'木',direction:'东',poem:'少时谦让有贤名\n长大刚直不容情\n；虽有才华招祸\n患一生清誉自分明',meaning:'平，礼让得福，刚直招嫌，宜和缓处事，防口舌。'},
    {id:33,level:'上',element:'火',direction:'南',poem:'过江招亲喜气扬\n龙凤呈祥福满堂\n；虽是计谋安排\n定姻缘天定自安康',meaning:'吉，喜事临门，姻缘和合，事业顺利，家运昌隆。'},
    {id:34,level:'下下',element:'火',direction:'南',poem:'一生好佛敬神明\n到老被困台城深\n；善恶到头终有\n报修行不足祸难禁',meaning:'凶，被困、破财、病灾，宜修善、避祸，防孤苦。'},
    {id:35,level:'中',element:'土',direction:'中',poem:'万里西行路漫漫\n历尽魔难始得还\n；诚心终得神明\n助正果修成福自安',meaning:'中吉，磨难之后有成，诚心可感神明，苦尽功成。'},
    {id:36,level:'中',element:'土',direction:'东',poem:'满腹经纶不得时\n忧国忧民泪暗垂\n；一朝身赴汨罗\n水万古千秋恨未迟',meaning:'平，怀才不遇，忧思过重，防抑郁、破财、心疾。'},
    {id:37,level:'上',element:'金',direction:'东',poem:'满堂福禄庆生辰\n七子八婿尽荣华\n；富贵双全人长\n寿一门和气乐无涯',meaning:'吉，家宅兴旺，福寿双全，子孙贤孝，阖家安康。'},
    {id:38,level:'下下',element:'金',direction:'南',poem:'荒淫无道失民心\n众叛亲离祸乱临\n；一旦身焚摘星\n楼万年遗臭到如今',meaning:'凶，纵欲败运，众叛亲离，防官非、破财、身败名裂。'},
    {id:39,level:'中',element:'水',direction:'南',poem:'笔底生花志气高\n一朝金榜姓名标\n；文章自有神明\n助富贵荣华不待招',meaning:'中吉，学业事业有成，文运亨通，功名可期，前程光明。'},
    {id:40,level:'中',element:'水',direction:'中',poem:'十年灯火用心勤\n命运崎岖不遇人\n；莫道文章无用\n处时来自有出头辰',meaning:'平，才华难展，时机未到，宜静待、自修，厚积薄发。'},
    {id:41,level:'上上',element:'木',direction:'东',poem:'巾帼英雄胆气豪\n三军号令掌分毫\n；一战成功威名\n振福禄荣华日日高',meaning:'大吉，女强男旺，掌权得势，事业大成，威名远扬。'},
    {id:42,level:'下下',element:'木',direction:'东',poem:'一片痴心付水流\n箱沉江底恨悠悠\n；负心薄幸难长\n久情海风波莫强求',meaning:'凶，情伤、破财、受骗，防人财两空、情变、负心。'},
    {id:43,level:'中',element:'火',direction:'南',poem:'百万军中独护主\n一身胆气冠三国\n；风烟散尽见太\n平功成名就福自多',meaning:'中吉，危难有救，忠心得报，贵人相助，化险为夷。'},
    {id:44,level:'中',element:'火',direction:'南',poem:'少年才俊美名扬\n中年落魄事无常\n；才尽途穷无去\n路空留遗恨叹凄凉',meaning:'平，后劲不足，才华渐衰，宜及早转行，防落魄。'},
    {id:45,level:'上',element:'土',direction:'中',poem:'金蟾吐宝福临门\n刘海嬉游喜气深\n；财禄自来无阻\n隔家兴人旺乐长春',meaning:'吉，财运亨通，偏财易得，家宅吉祥，财源广进。'},
    {id:46,level:'下下',element:'土',direction:'东',poem:'英雄气短困牢笼\n有勇无谋事不成\n；一朝失势身难\n保空留遗恨叹平生',meaning:'凶，有勇无谋，防冲动、破财、官非、身危。'},
    {id:47,level:'中',element:'金',direction:'东',poem:'月宫一游梦魂通\n富贵荣华转眼空\n；若得清闲无挂\n碍胜如金殿做王公',meaning:'中吉，梦幻之福，宜知足，守旧安稳，看淡名利。'},
    {id:48,level:'中',element:'金',direction:'南',poem:'守信不移志甚坚\n抱柱而死为情牵\n；太过执着成迂\n腐变通方可见青天',meaning:'平，守信可敬，过执反害，宜灵活处事，防固执误事。'},
    {id:49,level:'上上',element:'水',direction:'南',poem:'白袍征战十年功\n一旦荣归拜九重\n；富贵荣华天所\n赐衣锦还乡福满门',meaning:'大吉，功成名就，衣锦还乡，富贵双全，家门荣耀。'},
    {id:50,level:'下下',element:'水',direction:'中',poem:'功高震主祸难逃\n未央宫里血刀摇\n；勇略过人遭主\n忌荣华转眼梦烟消',meaning:'凶，功高招忌，防小人、官非、破财、祸端。'},
    {id:51,level:'上',element:'木',direction:'东',poem:'八仙过海各神通\n风平浪静一帆风\n；各自显能成正\n果前程万里任君行',meaning:'吉，各展所长，顺利成功，合作有利，前程远大。'},
    {id:52,level:'中',element:'木',direction:'东',poem:'井底安居眼界狭\n不知天地有荣华\n；一朝跳出方知\n阔眼界开时福自嘉',meaning:'平，眼界未开，宜学习、外出、求新，防固步自封。'},
    {id:53,level:'中',element:'火',direction:'南',poem:'镇守三关志气雄\n忠心保国显威风\n；边疆平定狼烟\n息名垂青史福无穷',meaning:'中吉，守成得力，安稳无忧，名望自至，忠义得福。'},
    {id:54,level:'下下',element:'火',direction:'南',poem:'毒蛇当道阻前程\n暗箭伤人祸事临\n；小人暗算难防\n备破财招灾病气侵',meaning:'凶，小人暗害，防暗算、破财、官非、病灾。'},
    {id:55,level:'上',element:'土',direction:'中',poem:'天官赐福喜临门\n万事亨通福满门\n；灾厄消除身康\n健家兴财旺乐长春',meaning:'吉，福气临门，消灾解难，百事顺遂，安康吉祥。'},
    {id:56,level:'中',element:'土',direction:'东',poem:'盲人骑瞎马\n夜半临深池\n；险处不知\n险祸来悔已迟',meaning:'平，盲目行事，危险暗藏，宜谨慎、勿冒险，防意外。'},
    {id:57,level:'中',element:'金',direction:'东',poem:'秋来黄菊正飘香\n晚节坚贞耐雪霜\n；莫道年高无大\n用老来福气更荣昌',meaning:'中吉，大器晚成，晚景荣华，福寿绵长，老来安康。'},
    {id:58,level:'下下',element:'金',direction:'南',poem:'六月飞霜雪满天\n奇冤难诉苦连天\n；人心险恶难测\n度凡事提防莫自怜',meaning:'凶，冤屈、官非、破财，防小人构陷、含冤、灾殃。'},
    {id:59,level:'中',element:'水',direction:'南',poem:'直上重楼去藏身\n四围荆棘绕为林\n；天高君命长和\n短得一反成失二人',meaning:'平，守旧随时，宜退不宜进，避祸全身，待机而动。'},
    {id:60,level:'中',element:'水',direction:'中',poem:'月出光辉本清吉\n浮云总是蔽荫色\n；户内用心再作\n福当官分理便有益',meaning:'中平，浮云蔽月，暂时困境；修身行善、尽责守分，可化解转吉。'},
  ],
  '月老灵签': [
    {id:1,level:'上上',element:'木',direction:'东',poem:'花好月圆福禄自全',meaning:'良缘天定，情投意合，可成婚，白头可期。'},
    {id:2,level:'上上',element:'木',direction:'东',poem:'一见倾心再见情深',meaning:'缘分强烈，相遇即来电，感情进展快且稳。'},
    {id:3,level:'上',element:'火',direction:'南',poem:'红豆相思终得相依',meaning:'虽有思念煎熬，但坚持可等到相守。'},
    {id:4,level:'上',element:'火',direction:'南',poem:'清风明月不负良人',meaning:'彼此真诚，无欺无诈，是可靠的长久关系。'},
    {id:5,level:'中',element:'土',direction:'中',poem:'缘浅情深难抵风尘',meaning:'感情深，但现实阻碍多，需耐心经营。'},
    {id:6,level:'上上',element:'土',direction:'东',poem:'红线紧系白首不离',meaning:'月老牵牢，正缘无疑，婚姻稳固。'},
    {id:7,level:'中',element:'金',direction:'东',poem:'心有灵犀未许相依',meaning:'互相懂彼此，但时机未到，宜静待。'},
    {id:8,level:'中',element:'金',direction:'南',poem:'雾里看花似真似假',meaning:'关系暧昧，对方心意不明，不宜急进。'},
    {id:9,level:'上上',element:'水',direction:'南',poem:'三生石上旧约重光',meaning:'前世缘分，今生再续，感情极稳。'},
    {id:10,level:'下下',element:'水',direction:'中',poem:'劳燕分飞各自东西',meaning:'分手、离别、异地难续，缘分已尽。'},
    {id:11,level:'上',element:'木',direction:'东',poem:'情根深种终见春风',meaning:'感情基础好，熬过难关就能开花结果。'},
    {id:12,level:'中',element:'木',direction:'东',poem:'孤灯夜冷独自沉吟',meaning:'单身、相思、孤单，短期难遇良缘。'},
    {id:13,level:'上上',element:'火',direction:'南',poem:'佳偶天成琴瑟和鸣',meaning:'天生一对，性格契合，婚姻美满。'},
    {id:14,level:'中',element:'火',direction:'南',poem:'情深缘薄聚散匆匆',meaning:'相爱却难长久，易因误会或现实分开。'},
    {id:15,level:'上',element:'土',direction:'中',poem:'相思不负终得相逢',meaning:'远距离、暗恋、等待，最后能见面、成缘。'},
    {id:16,level:'下下',element:'土',direction:'东',poem:'心已成灰情不可追',meaning:'对方已死心，挽回无望，宜放下。'},
    {id:17,level:'上上',element:'金',direction:'东',poem:'春风得意良缘自至',meaning:'心态好、气场顺，正缘很快出现。'},
    {id:18,level:'中',element:'金',direction:'南',poem:'镜花水月空梦一场',meaning:'关系虚幻，承诺不实，难有结果。'},
    {id:19,level:'上',element:'水',direction:'南',poem:'两心相照无负今朝',meaning:'彼此真诚付出，感情踏实温暖。'},
    {id:20,level:'中',element:'水',direction:'中',poem:'好事多磨终得圆满',meaning:'过程波折，但结局能走到一起。'},
    {id:21,level:'中',element:'木',direction:'东',poem:'情路孤单缓步寻欢',meaning:'单身期长，不宜将就，慢慢遇更好。'},
    {id:22,level:'上上',element:'木',direction:'东',poem:'久旱逢甘雨他乡遇故知',meaning:'感情大转机，重逢旧爱或遇绝佳新缘。'},
    {id:23,level:'中',element:'火',direction:'南',poem:'一心难两许取舍自分明',meaning:'三角关系、两难，必须果断选择。'},
    {id:24,level:'下下',element:'火',direction:'南',poem:'他思已穷恨不穷娇鸾雏凤失雌雄',meaning:'对方情已尽，只剩怨，关系难挽回。'},
    {id:25,level:'上',element:'土',direction:'中',poem:'伊人可嫁佳偶可期',meaning:'对方是良配，适合结婚。'},
    {id:26,level:'上上',element:'土',direction:'东',poem:'执子之手与子偕老',meaning:'承诺可靠，感情长久，白头到老。'},
    {id:27,level:'中',element:'金',direction:'东',poem:'前缘未尽再续温柔',meaning:'旧爱回头，或缘分未尽，可复合。'},
    {id:28,level:'中',element:'金',direction:'南',poem:'心事无言脉脉情牵',meaning:'暗恋、暧昧、不敢说，关系停滞。'},
    {id:29,level:'上',element:'水',direction:'南',poem:'情如细水长流不殆',meaning:'平淡但稳定，适合长久婚姻。'},
    {id:30,level:'中',element:'水',direction:'中',poem:'话别长夜相思又一春',meaning:'离别后仍思念，但重逢不易。'},
    {id:31,level:'上上',element:'木',direction:'东',poem:'凤凰于飞和鸣锵锵',meaning:'天生般配，感情和谐，婚姻幸福。'},
    {id:32,level:'下下',element:'木',direction:'东',poem:'落花有意流水无情',meaning:'单相思，对方无意，强求无果。'},
    {id:33,level:'中',element:'火',direction:'南',poem:'一念情深千里相逢',meaning:'缘分跨越距离，异地也能成。'},
    {id:34,level:'中',element:'火',direction:'南',poem:'旧情难舍新缘难托',meaning:'放不下过去，又难开始新感情，纠结。'},
    {id:35,level:'上',element:'土',direction:'中',poem:'温柔相伴岁月安然',meaning:'相处舒服，细水长流，安稳幸福。'},
    {id:36,level:'下下',element:'土',direction:'东',poem:'情海风波爱恨交缠',meaning:'争吵、误会、纠缠多，关系痛苦。'},
    {id:37,level:'上上',element:'金',direction:'东',poem:'有情人终成眷属',meaning:'无论多难，最后都能在一起。'},
    {id:38,level:'中',element:'金',direction:'南',poem:'半缘修道半缘君',meaning:'理性与感性并存，感情克制但深情。'},
    {id:39,level:'中',element:'水',direction:'南',poem:'缘来缘去聚散有时',meaning:'缘分顺其自然，不必强求。'},
    {id:40,level:'下下',element:'水',direction:'中',poem:'痴心错付泪湿罗衫',meaning:'爱错人，付出无回报，伤心收场。'},
    {id:41,level:'上上',element:'木',direction:'东',poem:'红绳系足千里相会',meaning:'正缘不远，即使异地也能遇见。'},
    {id:42,level:'中',element:'木',direction:'东',poem:'情到深处无言也懂',meaning:'默契十足，无需多言，感情稳固。'},
    {id:43,level:'中',element:'火',direction:'南',poem:'爱而不得憾此生',meaning:'很爱但无法在一起，留下遗憾。'},
    {id:44,level:'上',element:'火',direction:'南',poem:'得来全不费功夫',meaning:'良缘意外出现，轻松遇见对的人。'},
    {id:45,level:'上上',element:'土',direction:'中',poem:'恩爱两不疑白首不相离',meaning:'信任满满，无猜忌，婚姻长久。'},
    {id:46,level:'中',element:'土',direction:'东',poem:'旧梦难寻新梦难成',meaning:'过去回不去，未来难开始，过渡期。'},
    {id:47,level:'上',element:'金',direction:'东',poem:'心似双丝网中有千千结',meaning:'感情羁绊深，难分难舍，缘分重。'},
    {id:48,level:'下下',element:'金',direction:'南',poem:'缘尽于此各自安好',meaning:'彻底分手，复合无望，放下为上。'},
    {id:49,level:'中',element:'水',direction:'南',poem:'苦尽甘来情暖花开',meaning:'熬过痛苦，感情越来越好。'},
    {id:50,level:'中',element:'水',direction:'中',poem:'一身抱两世形单影自支',meaning:'心里装着过去，现在孤单，难投入。'},
    {id:51,level:'上上',element:'木',direction:'东',poem:'此生不负情深不渝',meaning:'一生一世一双人，忠诚长久。'},
    {id:52,level:'中',element:'木',direction:'东',poem:'相思莫负相见有期',meaning:'别放弃，很快就能见面、和好。'},
    {id:53,level:'中',element:'火',direction:'南',poem:'情路多歧步步小心',meaning:'感情选择多，易走错，需谨慎。'},
    {id:54,level:'下下',element:'火',direction:'南',poem:'情迷意乱错付终身',meaning:'被感情冲昏头，选错人，后悔莫及。'},
    {id:55,level:'上上',element:'土',direction:'中',poem:'花开并蒂连理同心',meaning:'婚姻美满，同心同德，恩爱到老。'},
    {id:56,level:'上上',element:'土',direction:'东',poem:'永老无离别万古当团聚',meaning:'永不分离，天长地久，签王级姻缘。'},
    {id:57,level:'中',element:'金',direction:'东',poem:'莫道无缘缘在眼前',meaning:'别灰心，正缘就在身边，容易忽略。'},
    {id:58,level:'中',element:'金',direction:'南',poem:'旧婚难续高攀不易',meaning:'旧关系难恢复，高攀不成，务实为好。'},
    {id:59,level:'下下',element:'水',direction:'南',poem:'相思成疾难愈难离',meaning:'执念太深，痛苦难放下，影响生活。'},
    {id:60,level:'中',element:'水',direction:'中',poem:'心苟不愆何惜于人言',meaning:'感情只要真心，不必太在意别人看法。'},
  ],
  '财神灵签': [
    {id:1,level:'上上',element:'木',direction:'东',poem:'巍巍独步向云间玉殿千官第一班',meaning:'大财将至，事业登顶，正偏财皆旺，投资必赚。'},
    {id:2,level:'上',element:'木',direction:'东',poem:'富贵荣华天付汝福如东海寿如山',meaning:'天赐财运，正财稳、偏财旺，享福无忧。'},
    {id:3,level:'中',element:'火',direction:'南',poem:'平地风雷起青云有路通',meaning:'先难后易，财运渐升，转机在即，宜进取。'},
    {id:4,level:'下下',element:'火',direction:'南',poem:'云遮月暗风卷花残',meaning:'财运低迷，防破财、亏损、投资陷阱。'},
    {id:5,level:'中',element:'土',direction:'中',poem:'谋财未遂守旧为宜',meaning:'财来缓慢，不宜冒险，稳守可保本。'},
    {id:6,level:'上上',element:'土',direction:'东',poem:'金炉香烬火初红财禄盈门喜气浓',meaning:'财气鼎盛，正财稳进，偏财自来，万事亨通。'},
    {id:7,level:'上',element:'金',direction:'东',poem:'春到人间草木知财源滚滚自有时',meaning:'时机已到，财运回暖，生意兴隆，获利可期。'},
    {id:8,level:'下下',element:'金',direction:'南',poem:'水中捞月镜里看花',meaning:'虚财假象，投资必亏，求财徒劳，防骗局。'},
    {id:9,level:'上上',element:'水',direction:'南',poem:'龙门得水富贵可期',meaning:'一跃发财，财运大爆发，正偏财皆得。'},
    {id:10,level:'中',element:'水',direction:'中',poem:'勤俭持家财自荣华',meaning:'正财稳，靠努力得财，偏财平平，守成吉。'},
    {id:11,level:'上',element:'木',direction:'东',poem:'贵人指引财路大开',meaning:'遇贵人带财，合作获利，投资有靠山。'},
    {id:12,level:'中',element:'木',direction:'东',poem:'财来财去两手空空',meaning:'留不住财，开销大、漏财，需节流。'},
    {id:13,level:'上上',element:'火',direction:'南',poem:'堆金积玉满门庭富贵荣华日日增',meaning:'巨财入库，财源广进，富贵双全，财运极旺。'},
    {id:14,level:'中',element:'火',direction:'南',poem:'时来运转财禄渐丰',meaning:'转运得财，之前辛苦，之后渐富。'},
    {id:15,level:'下下',element:'土',direction:'中',poem:'财星暗淡百事艰难',meaning:'财运差，易破财、负债、生意亏损。'},
    {id:16,level:'中',element:'土',direction:'东',poem:'守旧安贫不可妄求',meaning:'不宜求财，安分守己，冒险必败。'},
    {id:17,level:'上',element:'金',direction:'东',poem:'春风得意财利双全',meaning:'财运亨通，事业顺利，正偏财皆吉。'},
    {id:18,level:'下下',element:'金',direction:'南',poem:'破财难免口舌相随',meaning:'破财招灾，防纠纷、官非、意外损失。'},
    {id:19,level:'上上',element:'水',direction:'南',poem:'天降横财福禄自来',meaning:'偏财爆棚，意外之财、奖金、馈赠可期。'},
    {id:20,level:'中',element:'水',direction:'中',poem:'先苦后甜财禄自添',meaning:'前期辛苦，后期获利，坚持可富。'},
    {id:21,level:'中',element:'木',direction:'东',poem:'财如流水来去无常',meaning:'财运不稳，时好时坏，难聚财。'},
    {id:22,level:'上',element:'木',direction:'东',poem:'生意兴隆通四海财源茂盛达三江',meaning:'大财广进，生意红火，八方来财。'},
    {id:23,level:'下下',element:'火',direction:'南',poem:'财落空门万事无成',meaning:'求财无获，投资亏损，事业受阻。'},
    {id:24,level:'上上',element:'火',direction:'南',poem:'黄金满屋白玉盈堂',meaning:'富贵至极，财运鼎盛，家资丰厚。'},
    {id:25,level:'中',element:'土',direction:'中',poem:'脚踏实地财自相随',meaning:'正财稳，踏实做事得财，偏财一般。'},
    {id:26,level:'下下',element:'土',direction:'东',poem:'贪财惹祸得不偿失',meaning:'贪则破财，防高风险投资、骗局。'},
    {id:27,level:'上',element:'金',direction:'东',poem:'花开富贵财禄盈门',meaning:'财运吉，喜事临门，财源稳步增长。'},
    {id:28,level:'上上',element:'金',direction:'南',poem:'八方来财四季安康',meaning:'财路宽广，正偏财皆旺，平安进财。'},
    {id:29,level:'中',element:'水',direction:'南',poem:'财缘浅薄莫要强求',meaning:'财运平平，无大财，安稳度日即可。'},
    {id:30,level:'下下',element:'水',direction:'中',poem:'雪上加霜财破灾临',meaning:'财运极差，连续破财，防重病、意外。'},
    {id:31,level:'上上',element:'木',direction:'东',poem:'锦上添花财禄荣华',meaning:'财运升级，原有财富增值，意外获利。'},
    {id:32,level:'中',element:'木',direction:'东',poem:'贵人送财喜事自来',meaning:'贵人相助得财，合作、馈赠、奖金可期。'},
    {id:33,level:'下下',element:'火',direction:'南',poem:'财星被克谋利不成',meaning:'求财受阻，竞争激烈，投资亏损。'},
    {id:34,level:'中',element:'火',direction:'南',poem:'小财可得大财难求',meaning:'仅得小利，无暴富，安稳小富。'},
    {id:35,level:'上',element:'土',direction:'中',poem:'福星高照财利双收',meaning:'财运吉，福气加持，事业顺利获利。'},
    {id:36,level:'下下',element:'土',direction:'东',poem:'漏财不止积蓄难存',meaning:'破财漏财，开销大、被骗、意外损失。'},
    {id:37,level:'上上',element:'金',direction:'东',poem:'财临吉地富贵双全',meaning:'大财临门，正偏财皆旺，富贵长久。'},
    {id:38,level:'中',element:'金',direction:'南',poem:'苦尽甘来财禄自来',meaning:'熬过难关得财，后期财运好转。'},
    {id:39,level:'中',element:'水',direction:'南',poem:'财来缓慢耐心等待',meaning:'财运迟来，不可急躁，静待时机。'},
    {id:40,level:'下下',element:'水',direction:'中',poem:'财入虎口有去无回',meaning:'投资血本无归，借贷难回，防小人。'},
    {id:41,level:'上上',element:'木',direction:'东',poem:'手握千金富贵可期',meaning:'财运极旺，掌控财富，事业大成。'},
    {id:42,level:'上',element:'木',direction:'东',poem:'顺水行舟财路无忧',meaning:'求财顺利，阻力小，获利轻松。'},
    {id:43,level:'下下',element:'火',direction:'南',poem:'逆风求财劳而无功',meaning:'逆势求财必败，时机不对，徒劳无获。'},
    {id:44,level:'中',element:'火',direction:'南',poem:'半吉半凶财利平平',meaning:'财运一般，无大赚也无大亏，平稳度日。'},
    {id:45,level:'上上',element:'土',direction:'中',poem:'财如潮涌富贵荣华',meaning:'大财狂进，财运爆发，八方来财。'},
    {id:46,level:'中',element:'土',direction:'东',poem:'勤俭生财富贵自来',meaning:'靠努力得财，踏实肯干，慢慢致富。'},
    {id:47,level:'下下',element:'金',direction:'东',poem:'财陷困局进退两难',meaning:'资金链断裂，负债压力大，周转困难。'},
    {id:48,level:'中',element:'金',direction:'南',poem:'偏财无望正财安稳',meaning:'无意外之财，靠工资、主业稳进。'},
    {id:49,level:'上上',element:'水',direction:'南',poem:'财星高照万事亨通',meaning:'财运极吉，正偏财皆旺，事业顺利。'},
    {id:50,level:'下下',element:'水',direction:'中',poem:'财去人安破财消灾',meaning:'必破财，但可免灾，宜看淡得失。'},
    {id:51,level:'上',element:'木',direction:'东',poem:'时来财至富贵可期',meaning:'时机成熟得财，财运上升，获利可期。'},
    {id:52,level:'中',element:'木',direction:'东',poem:'合作生财互利共赢',meaning:'合伙求财吉，贵人助力，分红可观。'},
    {id:53,level:'下下',element:'火',direction:'南',poem:'小人挡路财利难寻',meaning:'小人破财，被算计、陷害、损失。'},
    {id:54,level:'中',element:'火',direction:'南',poem:'守旧求财安稳无虞',meaning:'不宜创新冒险，守旧业稳赚不赔。'},
    {id:55,level:'上上',element:'土',direction:'中',poem:'横财就手富贵荣华',meaning:'偏财大发，意外之财、中奖、馈赠。'},
    {id:56,level:'中',element:'土',direction:'东',poem:'积少成多财禄自丰',meaning:'小财累积成大财，长期坚持可富。'},
    {id:57,level:'下下',element:'金',direction:'东',poem:'财气衰弱百事不顺',meaning:'财运低迷，事业受阻，破财连连。'},
    {id:58,level:'中',element:'金',direction:'南',poem:'财缘一般知足常乐',meaning:'财运普通，无大财，安稳度日即可。'},
    {id:59,level:'上',element:'水',direction:'南',poem:'财源广进福禄双全',meaning:'财运亨通，正偏财皆吉，福气满满。'},
    {id:60,level:'下下',element:'水',direction:'中',poem:'空忙一场财利无成',meaning:'徒劳求财，付出多回报少，白忙。'},
    {id:61,level:'上上',element:'木',direction:'东',poem:'金玉满堂富贵长久',meaning:'巨财入库，家资丰厚，富贵绵长。'},
    {id:62,level:'中',element:'木',direction:'东',poem:'稳中求进财利自来',meaning:'稳健求财吉，不冒险，稳步获利。'},
    {id:63,level:'下下',element:'火',direction:'南',poem:'财遇风波损失难免',meaning:'财运有波折，投资亏损、生意纠纷。'},
    {id:64,level:'中',element:'火',direction:'南',poem:'小富由勤大富由命',meaning:'努力得小财，大财看运势，平常心。'},
    {id:65,level:'上',element:'土',direction:'中',poem:'贵人扶持财禄盈门',meaning:'贵人带财，事业提升，获利丰厚。'},
    {id:66,level:'下下',element:'土',direction:'东',poem:'财落他人空自叹息',meaning:'机会被抢，投资失败，财归别人。'},
    {id:67,level:'上上',element:'金',direction:'东',poem:'财运亨通万事顺遂',meaning:'财运极佳，正偏财皆旺，事事顺利。'},
    {id:68,level:'中',element:'金',direction:'南',poem:'先难后易财禄可期',meaning:'前期困难，后期获利，坚持可成。'},
    {id:69,level:'中',element:'水',direction:'南',poem:'财路平平无惊无喜',meaning:'财运一般，无大赚大亏，平淡安稳。'},
    {id:70,level:'下下',element:'水',direction:'中',poem:'贪多必失财破名损',meaning:'贪心破财，投资过大、亏损、名誉受损。'},
    {id:71,level:'上上',element:'木',direction:'东',poem:'财临旺地富贵荣华',meaning:'财运鼎盛，八方来财，富贵双全。'},
    {id:72,level:'上',element:'木',direction:'东',poem:'生意兴隆财源广进',meaning:'事业红火，客源不断，利润丰厚。'},
    {id:73,level:'下下',element:'火',direction:'南',poem:'财星不显谋利艰难',meaning:'求财困难，竞争激烈，难有收益。'},
    {id:74,level:'中',element:'火',direction:'南',poem:'守分安命不可强求',meaning:'财运有限，安分守己，强求反损。'},
    {id:75,level:'上上',element:'土',direction:'中',poem:'横财天降富贵自来',meaning:'意外之财，中奖、馈赠、投资爆赚。'},
    {id:76,level:'中',element:'土',direction:'东',poem:'勤俭持家财自丰盈',meaning:'努力得财，踏实肯干，慢慢积累财富。'},
    {id:77,level:'下下',element:'金',direction:'东',poem:'财遭损耗诸事不顺',meaning:'破财、漏财，意外损失、纠纷、病灾。'},
    {id:78,level:'中',element:'金',direction:'南',poem:'正财安稳偏财莫求',meaning:'主业稳赚，偏财无望，不宜投机。'},
    {id:79,level:'上',element:'水',direction:'南',poem:'福星临宅财禄自来',meaning:'福气加持，财运好转，获利可期。'},
    {id:80,level:'下下',element:'水',direction:'中',poem:'财入空门万事成空',meaning:'求财无获，投资亏损，事业失败。'},
    {id:81,level:'上上',element:'木',direction:'东',poem:'财如旭日蒸蒸日上',meaning:'财运上升，事业发展，财富稳步增长。'},
    {id:82,level:'中',element:'木',direction:'东',poem:'贵人指路财路大开',meaning:'贵人相助，找到赚钱门路，获利丰厚。'},
    {id:83,level:'下下',element:'火',direction:'南',poem:'小人作祟财利难成',meaning:'小人破财，被算计、陷害、生意失败。'},
    {id:84,level:'中',element:'火',direction:'南',poem:'小财可得大财无缘',meaning:'仅得小利，无暴富，安稳度日。'},
    {id:85,level:'上上',element:'土',direction:'中',poem:'富贵临门财禄双全',meaning:'大财将至，正偏财皆旺，富贵荣华。'},
    {id:86,level:'中',element:'土',direction:'东',poem:'苦尽财来时运转吉',meaning:'熬过困境，财运好转，时来运转。'},
    {id:87,level:'下下',element:'金',direction:'东',poem:'财遇危机破财难免',meaning:'资金危机，负债、亏损、意外破财。'},
    {id:88,level:'中',element:'金',direction:'南',poem:'财来财去难聚千金',meaning:'留不住财，开销大、漏财，难积蓄。'},
    {id:89,level:'上',element:'水',direction:'南',poem:'财源滚滚福禄安康',meaning:'财运亨通，正偏财皆吉，平安进财。'},
    {id:90,level:'下下',element:'水',direction:'中',poem:'财星暗淡祸事相随',meaning:'财运差，破财、病灾、纠纷不断。'},
    {id:91,level:'上上',element:'木',direction:'东',poem:'手握财权富贵可期',meaning:'掌控财富，事业大成，财运极旺。'},
    {id:92,level:'中',element:'木',direction:'东',poem:'和气生财万事顺遂',meaning:'人缘好得财，合作顺利，获利可观。'},
    {id:93,level:'下下',element:'火',direction:'南',poem:'财被人夺空自烦恼',meaning:'财被抢、被骗，投资失败，损失惨重。'},
    {id:94,level:'中',element:'火',direction:'南',poem:'守旧安财不宜妄动',meaning:'稳守现有财富，不宜投资、冒险。'},
    {id:95,level:'上上',element:'土',direction:'中',poem:'横财就手富贵荣华',meaning:'偏财大发，意外之财、奖金、馈赠。'},
    {id:96,level:'中',element:'土',direction:'东',poem:'积财有道富贵自来',meaning:'理财得当，财富积累，慢慢致富。'},
    {id:97,level:'下下',element:'金',direction:'东',poem:'财气衰竭百事难成',meaning:'财运低迷，事业受阻，破财连连。'},
    {id:98,level:'中',element:'金',direction:'南',poem:'财缘浅薄莫要强求',meaning:'财运普通，无大财，安稳度日即可。'},
    {id:99,level:'上',element:'水',direction:'南',poem:'财星高照福禄双全',meaning:'财运吉，福气加持，事业顺利获利。'},
  ],
  '吕祖灵签': [
    {id:1,level:'上上',element:'木',direction:'东',poem:'蓬莱东阁玉桃香\n顺水推舟仙赐方\n；宜男正好图全\n计不必他方觅短长',meaning:'大吉大利，万事顺遂。正缘、正财、事业皆顺，贵人扶持，心想事成。'},
    {id:2,level:'上',element:'木',direction:'东',poem:'潜藏自有光明日\n守耐无如待丙丁\n；龙虎相遭生大\n利君今起步得芳津',meaning:'先困后达，转机将至。宜守不宜急，时机一到，名利双收。'},
    {id:3,level:'中',element:'火',direction:'南',poem:'巍巍宝殿势峥嵘\n斧凿功夫用意深\n；一旦功成垂万\n古贵人指引遇知音',meaning:'靠技艺 / 实力成事。辛苦但有回报，事业稳，财运渐丰。'},
    {id:4,level:'下下',element:'火',direction:'南',poem:'卖身葬父孝为先\n历尽艰辛始得缘\n；莫道眼前多坎\n坷云开月出自安然',meaning:'付出多、回报迟。易破财、受累，感情多波折，需忍耐。'},
    {id:5,level:'中',element:'土',direction:'中',poem:'云横秦岭家何在\n雪拥蓝关马不前\n；若得贵人相指\n引一时风送过前川',meaning:'阻滞多、前路迷茫。需贵人点拨，不可硬闯，守旧为宜。'},
    {id:6,level:'上上',element:'土',direction:'东',poem:'渭水垂钓待时来\n直钩不钓世间财\n；一朝得遇文王\n聘万里鹏程任剪裁',meaning:'大器晚成，贵人提携。事业腾飞，财运亨通，婚姻美满。'},
    {id:7,level:'上',element:'金',direction:'东',poem:'琴心暗许两情投\n冲破尘缘万里愁\n；好事多磨终有\n果花开并蒂占鳌头',meaning:'感情主动可得。缘分强烈，虽有阻力，终能成眷属。'},
    {id:8,level:'下下',element:'金',direction:'南',poem:'九里山前杀气高\n八千子弟散荒郊\n；英雄末路无依\n靠财运功名两寂寥',meaning:'绝境、大败、破财。事业受阻，投资必亏，感情破裂，诸事不宜。'},
    {id:9,level:'中',element:'水',direction:'南',poem:'圯桥进履敬贤良\n隐忍方能遇贵帮\n；莫道眼前多屈\n抑他年位列紫薇郎',meaning:'以退为进，得贵人助。先受委屈，后获重用，财运渐好。'},
    {id:10,level:'中',element:'水',direction:'中',poem:'十上功名十不成\n囊中羞涩气难平\n；一朝得志还乡\n日衣锦荣华耀祖庭',meaning:'时运未到，屡试不第。事业受阻，财运平平，需静待时机。'},
    {id:11,level:'上',element:'木',direction:'东',poem:'一个兔儿一个鸡\n等全无不合人思\n；有朝遇著东风\n力且看天公造化机',meaning:'合作大吉，借力成事。合伙、团队、婚姻皆吉，顺风得利。'},
    {id:12,level:'中',element:'木',direction:'东',poem:'御手调羹意气豪\n醉中挥笔显才高\n；一朝宠尽恩荣\n歇依旧孤云野鹤翱',meaning:'才华外露，昙花一现。名气有、难长久，财运起伏，感情易变。'},
    {id:13,level:'上上',element:'火',direction:'南',poem:'蜀川基业已分明\n五虎同心辅圣明\n；天意人心皆顺\n泰荣华富贵享升平',meaning:'大业可成，地位稳固。事业登顶，财运鼎盛，家宅安宁。'},
    {id:14,level:'中',element:'火',direction:'南',poem:'一战功成胆气豪\n金戈铁马破尘嚣\n；虽非绝世无双\n士亦有英名著锦袍',meaning:'小胜可期，贵在坚持。努力有回报，事业稳进，财运渐佳。'},
    {id:15,level:'下下',element:'土',direction:'中',poem:'碧海青天夜夜心\n广寒宫里冷森森\n；荣华富贵如朝\n露寂寞孤单恨最深',meaning:'孤苦、分离、空虚。感情破裂，家宅不宁，财运低迷，诸事不顺。'},
    {id:16,level:'上',element:'土',direction:'东',poem:'一苇渡江任去留\n心无挂碍自悠悠\n；功成不必居人\n上德厚方能福泽悠',meaning:'超凡脱俗，万事顺遂。事业稳、财运平，感情和睦，平安健康。'},
    {id:17,level:'中',element:'金',direction:'东',poem:'萧何月下赶韩信\n为国求贤一片心\n；伯乐识马方得\n用青云路上遇知音',meaning:'贵人赏识，才华得展。事业遇伯乐，升职加薪，合作有利。'},
    {id:18,level:'下下',element:'金',direction:'南',poem:'功高震主祸难逃\n鸟尽弓藏走狗烹\n；富贵荣华如梦\n幻一朝失势命飘摇',meaning:'功成身退，防小人陷害。事业顶峰易翻车，财运大起大落，感情危机。'},
    {id:19,level:'上',element:'水',direction:'南',poem:'喜得秋风万事足\n一举成名天下福\n；凤凰五彩利飞\n行只看子午时日卜',meaning:'金榜题名，名利双收。考试、晋升、创业皆吉，财运亨通。'},
    {id:20,level:'中',element:'水',direction:'中',poem:'九转丹成白日昇\n神仙有数利人营\n；一朝走马龙行\n会此是荣华一美征',meaning:'苦尽甘来，修成正果。长期努力终有回报，事业稳，财运渐丰。'},
    {id:21,level:'中',element:'木',direction:'东',poem:'同窗结义却相残\n诡计阴谋惹祸端\n；莫道智谋能取\n胜到头终究受天瞒',meaning:'小人当道，内斗耗损。防竞争、纠纷、背叛，合作不利，感情不和。'},
    {id:22,level:'上上',element:'木',direction:'东',poem:'满门朱紫庆生辰\n福寿双全世所珍\n；七子八婿皆显\n贵荣华富贵享天伦',meaning:'福禄寿全，家运昌盛。事业、财运、感情、家宅皆吉，万事圆满。'},
    {id:23,level:'下下',element:'火',direction:'南',poem:'赤壁功成意气扬\n谁知短命少年亡\n；英雄气短空遗\n恨财运功名两渺茫',meaning:'英年早逝，功败垂成。事业受阻，健康堪忧，财运破败，感情分离。'},
    {id:24,level:'中',element:'火',direction:'南',poem:'雪地冰天十九年\n忠心不改志弥坚\n；一朝得遇还乡\n日名垂青史万古传',meaning:'坚守信念，终得回报。长期忍耐，事业有成，财运稳，感情忠贞。'},
    {id:25,level:'上',element:'土',direction:'中',poem:'周游列国志难酬\n大道之行不我谋\n；一旦时来天地\n泰春风得意占鳌头',meaning:'厚积薄发，时来运转。前期奔波，后期大成，财运渐旺，感情稳定。'},
    {id:26,level:'下下',element:'土',direction:'东',poem:'举世皆浊我独清\n众人皆醉我独醒\n；一腔热血付流\n水汨罗江上恨难平',meaning:'怀才不遇，悲愤难平。事业受阻，财运低迷，感情失意，易有是非。'},
    {id:27,level:'中',element:'金',direction:'东',poem:'过五关来斩六将\n千里独行义气扬\n；虽有险阻终能\n过功成名就耀四方',meaning:'突破难关，勇往直前。克服困难，事业成功，财运渐佳，感情忠贞。'},
    {id:28,level:'中',element:'金',direction:'南',poem:'一声喝断当阳桥\n勇冠三军胆气豪\n；虽有威名无远\n虑到头难免祸根苗',meaning:'勇而无谋，易招祸患。事业有冲劲但缺规划，财运起伏，感情冲动。'},
    {id:29,level:'上',element:'水',direction:'南',poem:'文星高照耀门庭\n笔下生花锦绣成\n；金榜题名功名\n显荣华富贵自亨通',meaning:'学业 / 事业大吉，文运亨通。考试、写作、文职、晋升皆吉，财运好。'},
    {id:30,level:'下下',element:'水',direction:'中',poem:'六军不发无奈何\n宛转蛾眉马前死\n；荣华富贵一场\n梦红颜薄命恨难辞',meaning:'美色招祸，富贵成空。感情危机，家宅不宁，财运破败，防桃色纠纷。'},
    {id:31,level:'上上',element:'木',direction:'东',poem:'陈桥兵变黄袍加\n万里山河一掌拿\n；天意人心皆归\n顺荣华富贵享无涯',meaning:'大权在握，基业稳固。事业登顶，财运鼎盛，家宅安宁，万事大吉。'},
    {id:32,level:'中',element:'木',direction:'东',poem:'巾帼英雄胆气豪\n辕门外斩将显英\n豪；一朝挂帅三\n军服名利双收步步高',meaning:'女强运，掌权成事。女性事业吉，升职掌权，财运佳，感情强势圆满。'},
    {id:33,level:'下下',element:'火',direction:'南',poem:'半生帝王半生僧\n看破红尘万事空\n；荣华富贵皆虚\n幻到头来一场春梦',meaning:'看破红尘，事业空忙。努力难有回报，财运平平，感情淡漠，宜修身。'},
    {id:34,level:'中',element:'火',direction:'南',poem:'一夜白头过昭关\n历尽艰辛渡险滩\n；虽有才华遭陷\n害功成之后亦难安',meaning:'危机重重，险象环生。事业受阻，财运不稳，感情波折，需谨慎避险。'},
    {id:35,level:'上',element:'土',direction:'中',poem:'天子呼来不上船\n自称臣是酒中仙\n；才华盖世无人\n及富贵荣华自安然',meaning:'才华出众，自由洒脱。事业凭实力成功，财运够用，感情随性自在。'},
    {id:36,level:'下下',element:'土',direction:'东',poem:'渔阳鼙鼓破霓裳\n盛世繁华一旦亡\n；叛乱四起生灵\n炭财运功名尽遭殃',meaning:'大乱将至，灾祸连连。事业崩溃，财运破败，家宅不宁，诸事凶险。'},
    {id:37,level:'上上',element:'金',direction:'东',poem:'禅让贤明万古传\n民心归顺自安然\n；国泰民安享太\n平福禄寿喜乐无边',meaning:'谦让得福，名利双收。事业平稳晋升，财运亨通，感情和睦，家宅安宁。'},
    {id:38,level:'中',element:'金',direction:'南',poem:'老当益壮胆气豪\n宝刀未老显英豪\n；虽非年少身强\n健建功立业在今朝',meaning:'老运亨通，宝刀未老。中老年事业财运转好，健康尚可，感情稳定。'},
    {id:39,level:'中',element:'水',direction:'南',poem:'玉树后庭花正开\n谁知国破家亦摧\n；沉迷酒色无大\n志荣华富贵化尘埃',meaning:'贪图享乐，事业荒废。沉迷安逸难成事，财运耗散，感情花心易败。'},
    {id:40,level:'下下',element:'水',direction:'中',poem:'风波亭上起冤魂\n陷害忠良罪恶深\n；虽得荣华一时\n乐遗臭万年恨难平',meaning:'小人陷害，冤屈难伸。事业遭小人破坏，财运受损，感情被挑拨，防官司。'},
    {id:41,level:'上',element:'木',direction:'东',poem:'跨海征东胆气豪\n功成名就显英豪\n；衣锦还乡荣故\n里荣华富贵乐逍遥',meaning:'远征得利，建功立业。外出发展吉，事业成功，财运大进，感情圆满。'},
    {id:42,level:'中',element:'木',direction:'东',poem:'时运不济命多乖\n破窑之内受饥寒\n；一朝得遇时来\n运金榜题名富贵来',meaning:'先贫后富，时来运转。前期穷困，后期发达，财运渐旺，感情苦尽甘来。'},
    {id:43,level:'下下',element:'火',direction:'南',poem:'妖妃乱国祸连连\n忠臣尽丧国祚偏\n；酒池肉林荒朝\n政财运功名尽化烟',meaning:'女色 / 小人乱局，灾祸不断。感情招祸，家宅不宁，财运破败，事业崩塌。'},
    {id:44,level:'中',element:'火',direction:'南',poem:'知音难觅恨难平\n碎琴绝弦不再鸣\n；满腔心事无人\n诉孤芳自赏度余生',meaning:'知音难遇，孤独寂寞。事业少贵人，财运平平，感情难寻知己，易孤独。'},
    {id:45,level:'上上',element:'土',direction:'中',poem:'中兴汉室显英才\n扫平群寇定尘埃\n；天意人心皆归\n顺荣华富贵享天开',meaning:'绝地重生，复国大业。事业东山再起，财运鼎盛，家宅安宁，万事顺遂。'},
    {id:46,level:'中',element:'土',direction:'东',poem:'镇守三关胆气豪\n忠心报国显英豪\n；虽有险阻终能\n守名利双收步步高',meaning:'守成得利，稳扎稳打。事业稳守可成，财运平稳，感情忠贞，家宅安宁。'},
