<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
.container { max-width:420px; margin:0 auto; padding:50px 20px 40px; position:relative; z-index:1; }
.header { text-align:center; margin-bottom:32px; }
.title { font-size:26px; font-weight:700; color:rgba(255,255,255,.82); letter-spacing:8px; font-family:serif; }
.subtitle { font-size:12px; color:var(--text-faint); margin-top:8px; letter-spacing:2px; }

.tool-list { display:flex; flex-direction:column; gap:32px; }
.tool-card {
  display:flex; align-items:center; gap:16px;
  background:linear-gradient(135deg,rgba(255,220,160,.05),rgba(255,220,160,.01));
  border:1px solid var(--border-card);
  border-radius:var(--radius-lg); padding:20px; text-decoration:none;
  transition:transform var(--t-hover),box-shadow var(--t-hover),border-color var(--t-hover),background var(--t-hover);
}
.tool-card:first-child{background:linear-gradient(135deg,rgba(255,220,160,.08),rgba(255,220,160,.02))}
.tool-card:hover{transform:translateY(-3px);box-shadow:0 0 30px rgba(255,180,80,.08),0 8px 36px rgba(0,0,0,.5);border-color:rgba(200,155,60,.2);background:linear-gradient(135deg,rgba(255,220,160,.1),rgba(255,220,160,.03))}
.tool-icon { width:40px; height:40px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.tool-icon svg { width:30px; height:30px; }
.tool-info { flex:1; }
.tool-name { font-size:16px; font-weight:600; color:var(--text-body); }
.tool-desc { font-size:12px; color:var(--text-secondary); margin-top:3px; }
.tool-arrow { font-size:16px; color:var(--text-faint); flex-shrink:0; opacity:0.25; transition:opacity 0.5s,transform 0.5s; }
.tool-card:hover .tool-arrow{opacity:0.6;transform:translateX(4px)}

.placeholder-card {
  display:flex; align-items:center; justify-content:center; gap:8px;
  background:rgba(255,255,255,.02); border:1px dashed var(--border-subtle);
  border-radius:16px; padding:20px; color:var(--text-faint); font-size:13px;
}
.footer { text-align:center; margin-top:48px; color:var(--text-faint); font-size:10px; letter-spacing:2px; }
</style>
<link rel="stylesheet" href="./theme/theme.css">
