<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>小工具站</title>
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
.container { max-width:420px; margin:0 auto; padding:50px 20px 40px; position:relative; z-index:1; }
.header { text-align:center; margin-bottom:32px; }
.title { font-size:26px; font-weight:700; color:rgba(255,255,255,.88); letter-spacing:6px; }
.subtitle { font-size:12px; color:rgba(255,255,255,.35); margin-top:8px; }

.tool-list { display:flex; flex-direction:column; gap:12px; }
.tool-card {
  display:flex; align-items:center; gap:16px;
  background:var(--bg-surface); border:1px solid var(--border-card);
  border-radius:var(--radius-lg); padding:20px; text-decoration:none;
  transition:transform var(--t-hover),box-shadow var(--t-hover),border-color var(--t-hover);
}
.tool-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover);border-color:rgba(200,155,60,.15)}
.tool-icon { font-size:40px; flex-shrink:0; }
.tool-info { flex:1; }
.tool-name { font-size:16px; font-weight:600; color:var(--text-body); }
.tool-desc { font-size:12px; color:var(--text-secondary); margin-top:3px; }
.tool-arrow { font-size:18px; color:var(--text-faint); flex-shrink:0; }

.placeholder-card {
  display:flex; align-items:center; justify-content:center; gap:8px;
  background:rgba(255,255,255,.02); border:1px dashed var(--border-subtle);
  border-radius:16px; padding:20px; color:var(--text-faint); font-size:13px;
}
.footer { text-align:center; margin-top:36px; color:var(--text-faint); font-size:10px; }
</style>
<link rel="stylesheet" href="./theme/theme.css">
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">小工具站</div>
    <div class="subtitle">映照当下，辅助觉察</div>
  </div>

  <div class="tool-list">
    <a href="xuansha/index.html" class="tool-card">
      <span class="tool-icon">🎯</span>
      <span class="tool-info">
        <div class="tool-name">选啥</div>
        <div class="tool-desc">输入选项 · 卡片翻牌 · 随机选一个</div>
      </span>
      <span class="tool-arrow">→</span>
    </a>
    <a href="yaoshaizi/index.html" class="tool-card">
      <span class="tool-icon">🎲</span>
      <span class="tool-info">
        <div class="tool-name">摇骰子</div>
        <div class="tool-desc">选骰子数 · 摇一摇 · 运气系统</div>
      </span>
      <span class="tool-arrow">→</span>
    </a>
    <a href="qiugian/index.html" class="tool-card">
      <span class="tool-icon">🎋</span>
      <span class="tool-info">
        <div class="tool-name">求签</div>
        <div class="tool-desc">竹签筒 · 长按摇签 · 解签释义</div>
      </span>
      <span class="tool-arrow">→</span>
    </a>
    <div class="placeholder-card">🔮 更多工具开发中...</div>
  </div>

  <div class="footer">暖木暗金 · 小工具系列</div>
</div>
<script src="./theme/particles.js"></script>
</body>
</html>
