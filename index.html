<script src="./theme/particles.js"></script>
<script>
(function(){
  var glow = document.getElementById('pageGlow');
  var cards = document.querySelectorAll('.tool-card');
  if (!glow || !cards.length) return;
  cards.forEach(function(card, i) {
    card.addEventListener('mouseenter', function() {
      var rect = card.getBoundingClientRect();
      glow.style.top = (rect.top + rect.height/2) + 'px';
      glow.style.left = (rect.left + rect.width/2) + 'px';
      glow.style.transform = 'translate(-50%,-50%)';
      // 粒子响应
      if (window.themeParticles) {
        if (i === 1) themeParticles.resume(); // 摇骰: 粒子加速感
        if (i === 2) themeParticles.pause();   // 求签: 变安静
      }
    });
    card.addEventListener('mouseleave', function() {
      glow.style.top = '38%';
      glow.style.left = '50%';
      glow.style.transform = 'translate(-50%,-38%)';
      if (window.themeParticles) themeParticles.resume();
    });
  });
})();
</script>
