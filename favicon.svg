<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glow" cx="32" cy="32" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d6a85f" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#c49545" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#b08030" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#120b09" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot" cx="32" cy="32" r="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8c070" stop-opacity="1"/>
      <stop offset="50%" stop-color="#d6a85f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b08030" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="64" height="64" rx="12" fill="#120b09"/>

  <!-- 外环 — 不完整，像旧铜器的磨损 -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="rgba(180,140,90,0.12)" stroke-width="1.5"
    stroke-dasharray="28 6 12 4 20 5 16 3 24 7" stroke-linecap="round"/>

  <!-- 琥珀光晕 -->
  <circle cx="32" cy="32" r="20" fill="url(#glow)"/>

  <!-- 中心火种 -->
  <circle cx="32" cy="32" r="3" fill="url(#dot)"/>
</svg>
